// Habits section for the WEEK segment.
// Each habit shows: emoji + title, small count, 7-cell horizontal strip.
// No prose at this scale — the strip says it.
function weekHabitsSectionHTML() {
  const habits = activeHabits();
  if (!habits.length) return '';

  // 7 dates: Mon-Sun of current week (or last 7 days). Use last-7 to align with Today.
  const dates = lastNDates(7);

  const rowHTML = (h) => {
    const need = h.count_per_day || 1;
    let countLabel;
    if (h.cadence === 'weekly') {
      const hasLog = (state.habitLogs || []).some(l => l.habit_id === h.id && dates.includes(l.date_iso));
      countLabel = hasLog ? 'this week' : '—';
    } else if (need > 1) {
      const totalParts = (state.habitLogs || []).filter(l => l.habit_id === h.id && dates.includes(l.date_iso)).reduce((s, l) => s + (l.count || 1), 0);
      const possible = h.cadence === 'weekdays' ? 5 * need : 7 * need;
      countLabel = `${totalParts}/${possible}`;
    } else {
      const totalDone = dates.filter(d => habitCellDensity(h, d) > 0).length;
      const possible = h.cadence === 'weekdays' ? 5 : 7;
      countLabel = `${totalDone}/${possible}`;
    }

    // 7-cell horizontal strip
    const cellW = 18;
    const cellH = 13;
    const gap = 3;
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const iso = dates[i];
      const isToday = iso === todayISO();
      const dow = new Date(iso + 'T12:00:00').getDay();
      const isWeekendForWeekdays = h.cadence === 'weekdays' && (dow === 0 || dow === 6);
      const density = habitCellDensity(h, iso);
      const fill = isWeekendForWeekdays ? 'transparent' : densityColor(density);
      const stroke = isToday ? ' stroke="var(--brass)" stroke-width="0.6"' : (isWeekendForWeekdays ? ' stroke="var(--line)" stroke-width="0.4" stroke-dasharray="2 2"' : '');
      cells += `<rect x="${i * (cellW + gap)}" y="0" width="${cellW}" height="${cellH}" rx="3" fill="${fill}"${stroke}/>`;
    }
    const totalW = 7 * cellW + 6 * gap;

    return `
      <button onclick="openHabitCreateSheet('${h.id}')" style="display:flex;align-items:center;width:100%;gap:12px;padding:12px 0;background:none;border:none;color:inherit;font-family:inherit;cursor:pointer;text-align:left;border-bottom:0.5px solid var(--line);">
        <div style="font-size:18px;line-height:1;flex-shrink:0;">${h.emoji || '✨'}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Fraunces',serif;font-size:14px;color:var(--ink);font-weight:400;line-height:1.2;">${escapeHtml(h.title)}</div>
        </div>
        <svg width="${totalW}" height="${cellH}" viewBox="0 0 ${totalW} ${cellH}" style="flex-shrink:0;">${cells}</svg>
        <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-muted);min-width:36px;text-align:right;">${countLabel}</div>
      </button>
    `;
  };

  return `
    <div class="pulse-card" style="margin-top:8px;padding:14px 14px 12px;">
      <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:2px;">WHAT YOU EMBODIED</div>
      <div style="padding:0 0 4px;">
        ${habits.map(rowHTML).join('')}
        <button onclick="openHabitCreateSheet()" style="display:flex;align-items:center;justify-content:center;width:100%;padding:10px;background:transparent;border:0.5px dashed var(--brass-dim);border-radius:10px;color:var(--brass);font-family:inherit;font-size:11.5px;cursor:pointer;margin-top:12px;letter-spacing:0.02em;font-weight:500;">+ Name a practice</button>
      </div>
    </div>
  `;
}

// Habits section for the YEAR segment.
// 12-month strip per habit, density-shaded by completion ratio of that month.
function yearHabitsSectionHTML() {
  const habits = activeHabits();
  const retired = (state.habits || []).filter(h => h.retired_at);
  if (!habits.length && !retired.length) return '';

  // Compute the last 12 months as anchor dates (start of each month).
  const today = new Date(todayISO() + 'T12:00:00');
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    months.push(d);
  }

  // For a habit, compute its monthly density (0-4 levels) for each of the 12 months.
  const monthDensity = (h, monthDate) => {
    const yr = monthDate.getFullYear();
    const mo = monthDate.getMonth();
    const lastDay = new Date(yr, mo + 1, 0).getDate();
    const startISO = new Date(yr, mo, 1).toISOString().slice(0, 10);
    const endISO = new Date(yr, mo, lastDay).toISOString().slice(0, 10);

    const hCreated = new Date(h.created_at);
    const monthEnd = new Date(yr, mo, lastDay);
    if (hCreated > monthEnd) return -1;  // habit didn't exist yet — return sentinel

    if (h.cadence === 'weekly') {
      // Weeks-in-month rough approximation: count distinct ISO weeks logged
      const logs = (state.habitLogs || []).filter(l => l.habit_id === h.id && l.date_iso >= startISO && l.date_iso <= endISO);
      const weeks = new Set();
      for (const l of logs) {
        const dt = new Date(l.date_iso + 'T12:00:00');
        const wk = Math.floor(dt.getDate() / 7);
        weeks.add(wk);
      }
      const possibleWeeks = 4;
      const ratio = weeks.size / possibleWeeks;
      if (ratio >= 1)    return 4;
      if (ratio >= 0.66) return 3;
      if (ratio >= 0.33) return 2;
      if (ratio > 0)     return 1;
      return 0;
    }

    const need = h.count_per_day || 1;
    const logs = (state.habitLogs || []).filter(l => l.habit_id === h.id && l.date_iso >= startISO && l.date_iso <= endISO);
    if (!logs.length) return 0;

    if (need === 1) {
      const distinctDays = new Set(logs.map(l => l.date_iso)).size;
      const possible = h.cadence === 'weekdays' ? Math.round(lastDay * 5/7) : lastDay;
      const ratio = distinctDays / possible;
      if (ratio >= 0.85) return 4;
      if (ratio >= 0.6)  return 3;
      if (ratio >= 0.3)  return 2;
      return 1;
    }
    // Count habit
    const totalParts = logs.reduce((s, l) => s + (l.count || 1), 0);
    const possibleParts = (h.cadence === 'weekdays' ? Math.round(lastDay * 5/7) : lastDay) * need;
    const ratio = totalParts / possibleParts;
    if (ratio >= 0.85) return 4;
    if (ratio >= 0.6)  return 3;
    if (ratio >= 0.3)  return 2;
    return 1;
  };

  const yearProse = (h) => {
    const monthsActive = months.filter(m => monthDensity(h, m) > 0).length;
    const totalMonths = months.filter(m => monthDensity(h, m) >= 0).length;
    if (totalMonths === 0) return `Recently begun.`;
    if (totalMonths <= 3) {
      // Still a young practice — different language scale
      if (monthsActive === totalMonths) return `Held every month since beginning.`;
      if (monthsActive > 0)              return `Held ${monthsActive} of ${totalMonths} months since beginning.`;
      return `Quiet so far.`;
    }
    if (monthsActive === totalMonths && totalMonths >= 6) return `Held across all ${totalMonths} months. The practice took root.`;
    if (monthsActive === totalMonths) return `Held every month — ${totalMonths} so far.`;
    if (monthsActive >= totalMonths * 0.66) return `Held in ${monthsActive} of ${totalMonths} months. A long thread.`;
    if (monthsActive >= totalMonths * 0.33) return `Held in ${monthsActive} of ${totalMonths} months. Came and went with the seasons.`;
    if (monthsActive > 0) return `${monthsActive} of ${totalMonths} months. The shape is sparse.`;
    return `Quiet across the year.`;
  };

  const habitRowHTML = (h, isRetired) => {
    const cellW = 22;
    const cellH = 16;
    const gap = 3;
    let cells = '';
    months.forEach((m, i) => {
      const density = monthDensity(h, m);
      // v3.2.4: use explicit rgba values for both filled and empty states
      // so cells are visible in light mode (--surface-2 was near-invisible)
      let fill, stroke;
      if (density === -1) {
        fill = 'transparent';
        stroke = ' stroke="rgba(128,110,88,0.20)" stroke-width="0.5" stroke-dasharray="2 2"';
      } else if (density === 0) {
        fill = 'rgba(128,110,88,0.12)'; // visible empty cell in both light + dark
        stroke = ' stroke="rgba(128,110,88,0.25)" stroke-width="0.5"';
      } else {
        fill = densityColor(density);
        stroke = '';
      }
      cells += `<rect x="${i * (cellW + gap)}" y="0" width="${cellW}" height="${cellH}" rx="2" fill="${fill}"${stroke}/>`;
    });
    const totalW = 12 * cellW + 11 * gap;

    return `
      <div style="padding:14px 0;${isRetired ? 'opacity:0.55;' : ''}">
        <button onclick="${isRetired ? '' : `openHabitCreateSheet('${h.id}')`}" style="display:flex;align-items:flex-start;width:100%;gap:12px;background:none;border:none;color:inherit;font-family:inherit;cursor:${isRetired ? 'default' : 'pointer'};text-align:left;padding:0;">
          <div style="font-size:18px;line-height:1;flex-shrink:0;margin-top:1px;">${h.emoji || '✨'}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Fraunces',serif;font-size:14.5px;color:var(--ink);font-weight:400;line-height:1.2;">${escapeHtml(h.title)}</div>
            ${h.note ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:10.5px;color:var(--ink-muted);margin-top:1px;line-height:1.35;">"${escapeHtml(h.note)}"</div>` : ''}
          </div>
        </button>
        <div style="margin-top:10px;">
          <svg width="${totalW}" height="${cellH}" viewBox="0 0 ${totalW} ${cellH}" style="display:block;">${cells}</svg>
        </div>
        <div style="font-family:'Fraunces',serif;font-style:italic;font-size:11.5px;color:var(--ink-muted);line-height:1.5;margin-top:8px;">${escapeHtml(yearProse(h))}</div>
      </div>
    `;
  };

  const activeBlock = habits.map(h => habitRowHTML(h, false)).join('<div style="height:0.5px;background:var(--line);margin:0;"></div>');
  const retiredBlock = retired.length ? `
    <div style="height:0.5px;background:var(--line);margin:14px 0;"></div>
    <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:4px;font-family:'Inter',sans-serif;">RETIRED · ${retired.length}</div>
    ${retired.map(h => habitRowHTML(h, true)).join('<div style="height:0.5px;background:var(--line);margin:0;"></div>')}
  ` : '';

  return `
    <div class="pulse-card" style="margin-top:8px;padding:14px 14px 12px;">
      <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:4px;">PRACTICES THROUGH THE YEAR</div>
      ${activeBlock}
      ${retiredBlock}
    </div>
  `;
}

function whoopSettingsTileHTML() {
  const w = state.whoop || {};
  const last = state.config.whoop_last_sync;
  const lastStr = last ? whoopRelTime(last) : null;
  const profileName = w.profile && (w.profile.first_name || w.profile.email);
  if (!w.connected) {
    return `
      <button class="setting-row" onclick="startWhoopOAuth()">
        <div class="label">Whoop <span style="color:var(--ink-faint);font-size:10px;font-style:italic;font-family:'Fraunces',serif;">· sleep, recovery, strain</span></div>
        <div class="value" style="color:var(--brass);">Connect</div>
      </button>
    `;
  }
  return `
    <button class="setting-row" onclick="syncWhoop()">
      <div class="label">Whoop ${profileName ? `<span style="color:var(--ink-faint);font-size:10px;font-style:italic;font-family:'Fraunces',serif;">· ${escapeHtml(profileName)}</span>` : ''}</div>
      <div class="value" style="color:var(--accent-bright);">${lastStr || 'Sync now'}</div>
    </button>
    <button class="setting-row" onclick="confirmDisconnectWhoop()">
      <div class="label" style="color:var(--ink-muted);">Disconnect Whoop</div>
      <div class="value">×</div>
    </button>
  `;
}

function whoopRelTime(iso) {
  try {
    const ms = Date.now() - new Date(iso).getTime();
    if (ms < 60_000) return 'just now';
    if (ms < 3600_000) return Math.round(ms / 60_000) + 'm ago';
    if (ms < 86400_000) return Math.round(ms / 3600_000) + 'h ago';
    const d = Math.round(ms / 86400_000);
    return d === 1 ? 'yesterday' : d + 'd ago';
  } catch (e) { return ''; }
}

function confirmDisconnectWhoop() {
  openModal(`
    <div class="modal-title">Disconnect Whoop?</div>
    <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);margin-bottom:18px;line-height:1.5;">
      Cached Whoop data will be cleared. You can reconnect anytime.
    </div>
    <div class="modal-row">
      <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="flex:1" onclick="closeModal();disconnectWhoop()">Disconnect</button>
    </div>
  `);
}

  if (typeof kuzuriConfirm === 'function') {
    kuzuriConfirm({
      title: 'Delete your Kuzuri account?',
      body: 'This permanently wipes everything: your examens, captures, chapters, people, workouts, and any connected wearables. This cannot be undone.',
      confirmLabel: 'Delete forever',

    }).then((ok) => { if (ok) deleteAccountNow(); });

async function deleteAccountNow() {
  try {
    const r = await fetch(WORKER_BASE_URL + '/api/account/delete', { method: 'POST', credentials: 'include' });
    if (r.ok) {
      localStorage.removeItem(STORAGE_KEY);
      window.location.href = window.location.pathname;
    } else {
      toast('Could not delete. Try again.');
    }
  } catch (e) {
    toast('Could not delete. Check connection.');
  }
}

function confirmWipeLocalCache() {
  closeOverlay();
  if (typeof kuzuriConfirm === 'function') {
    kuzuriConfirm({
      title: 'Wipe local cache?',
      body: 'Your data stays in your account. Only this device\u2019s copy is removed. The app will reload and pull fresh data.',
      confirmLabel: 'Wipe cache',
      cancelLabel: 'Cancel',
    }).then((ok) => {
      if (!ok) return;
      localStorage.removeItem(STORAGE_KEY);
      window.location.reload();
    });
  } else {
    if (confirm('Wipe local cache? Your data stays in your account.')) {
      localStorage.removeItem(STORAGE_KEY);
      window.location.reload();
    }
  }
}

function importJSONPicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  input.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      let parsed = JSON.parse(text);
      if (typeof parsed !== 'object' || parsed === null) throw new Error('Invalid format');
      // v3.2.9: accept both raw state objects and localStorage-wrapped objects
      // v3.0.0 exported localStorage directly which may have the state nested
      if (parsed.kuzuri_v2_3 && typeof parsed.kuzuri_v2_3 === 'string') {
        parsed = JSON.parse(parsed.kuzuri_v2_3);
      } else if (parsed.kuzuri_v2_3 && typeof parsed.kuzuri_v2_3 === 'object') {
        parsed = parsed.kuzuri_v2_3;
      }
      // Load locally first — this always works regardless of server state
      state = loadStateFromObject(parsed);
      saveState(); // this triggers sync to server via kuzuriSync
      closeOverlay();
      render();
      toast('Imported ✓');
    } catch (err) {
      toast('Import failed · ' + (err.message || 'invalid file'));
    }
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(() => input.remove(), 1000);
}

function onAvatarSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Crop to square, resize to 200px max — small enough for state storage
      const size = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
      state.profile = state.profile || {};
      state.profile.avatar = canvas.toDataURL('image/jpeg', 0.80);
      saveState();
      renderMe();
      openSettingsOverlay(); // refresh settings to show new avatar
      toast('Profile picture updated');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = ''; // reset so same file can be re-selected
}

function saveSunsetTime() {
  const v = (document.getElementById('sunset-input')?.value || '').trim();
  if (!/^\d{1,2}:\d{2}$/.test(v)) { toast('Invalid time'); return; }
  const [h, m] = v.split(':').map(Number);
  if (h > 23 || m > 59) { toast('Invalid time'); return; }
  state.config.sunset_time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  saveState();
  closeModal();
  render();
  toast('Saved');
}
function toggleExamenVoiceSetting() {
  // v3.0.6 (Group 8): the prior version called render() which paints the
  // main app, but the settings overlay was never re-rendered, so the
  // displayed value (On/Off) stayed stale and the toggle felt broken.
  // Re-open the settings overlay after toggling to refresh the value row.
  state.config.examen_voice_enabled = !(state.config.examen_voice_enabled !== false);
  saveState();
  // Stop any active voice session immediately if user just turned voice off.
  if (state.config.examen_voice_enabled === false) {
    stopVoice();
    if (typeof stopExamenVoice === 'function') stopExamenVoice();
  }
  render();
  // Re-render the settings overlay so the value row updates.
  openSettingsOverlay();
}

// SUBSCRIPTIONS — Bobby-style list, Stoic treatment (annualized cost shown)
// ═══════════════════════════════════════════════════════════════════════
function subscriptionAnnualCost(sub) {
  const amt = parseFloat(sub.amount);
  if (!isFinite(amt)) return 0;
  return sub.period === 'yearly' ? amt : amt * 12;
}
function subscriptionsAnnualTotal() {
  return (state.subscriptions || []).reduce((sum, s) => sum + subscriptionAnnualCost(s), 0);
}
function subscriptionsAnnualLabel() {
  const n = subscriptionsAnnualTotal();
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function openSubscriptions() {
  const subs = [...(state.subscriptions || [])].sort((a, b) => subscriptionAnnualCost(b) - subscriptionAnnualCost(a));
  const total = subscriptionsAnnualTotal();
  const monthly = total / 12;

  const list = subs.length ? subs.map(s => {
    const annual = subscriptionAnnualCost(s);
    const periodLabel = s.period === 'yearly' ? 'yr' : 'mo';
    const monthlyAmt = s.period === 'yearly' ? (annual / 12) : parseFloat(s.amount);
    return `
      <button class="detail-row" onclick="editSubscription('${s.id}')">
        <div style="flex:1;min-width:0;">
          <div class="lab">${escapeHtml(s.name)}</div>
          ${s.category ? `<div style="font-size:10.5px;color:var(--ink-faint);letter-spacing:0.02em;margin-top:2px;">${escapeHtml(s.category)}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="val brass" style="font-family:ui-monospace,monospace;font-size:12.5px;">$${annual.toLocaleString('en-US', { maximumFractionDigits: 0 })}/yr</div>
          <div style="font-size:10px;color:var(--ink-faint);font-family:ui-monospace,monospace;margin-top:2px;">$${s.amount}/${periodLabel}</div>
        </div>
      </button>
    `;
  }).join('') : `
    <div class="touch-empty" style="padding:36px 0;">No subscriptions tracked yet.</div>
  `;

  openOverlay(`
    <div class="today-header" style="margin-bottom:18px;">
      <div class="today-header-l">
        <div class="today-date">Money</div>
        <div class="today-title">What you pay for</div>
      </div>
    </div>
    <div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink-muted);line-height:1.55;margin-bottom:18px;">
      Annual cost is the honest number. Monthly hides it.
    </div>

    ${subs.length ? `
      <div class="detail-stats" style="margin-bottom:16px;">
        <div class="close-stat">
          <div class="close-stat-n">${subs.length}</div>
          <div class="close-stat-l">Services</div>
        </div>
        <div class="close-stat">
          <div class="close-stat-n brass" style="color:var(--brass);">$${monthly.toFixed(0)}</div>
          <div class="close-stat-l">/month</div>
        </div>
        <div class="close-stat">
          <div class="close-stat-n brass" style="color:var(--brass);">$${total.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
          <div class="close-stat-l">/year</div>
        </div>
      </div>
    ` : ''}

    ${list}

    <button class="btn-full" onclick="addSubscription()" style="margin-top:16px;">
      ${subs.length ? '+ Add another' : '+ Add a subscription'}
    </button>
  `);
}

function setSubPeriod(p) {
  window.__subPeriod = p;
  const m = document.getElementById('sub-period-monthly');
  const y = document.getElementById('sub-period-yearly');
  if (m && y) {
    m.style.background = p === 'monthly' ? 'var(--surface)' : 'transparent';
    m.style.color = p === 'monthly' ? 'var(--ink)' : 'var(--ink-muted)';
    y.style.background = p === 'yearly' ? 'var(--surface)' : 'transparent';
    y.style.color = p === 'yearly' ? 'var(--ink)' : 'var(--ink-muted)';
  }
}
function saveSubscription(id, isNew) {
  const name = (document.getElementById('sub-name')?.value || '').trim();
  const amountRaw = (document.getElementById('sub-amount')?.value || '').trim();
  const category = (document.getElementById('sub-category')?.value || '').trim();
  const period = window.__subPeriod || 'monthly';
  const amount = parseFloat(amountRaw);
  if (!name) { toast('Name it'); return; }
  if (!isFinite(amount) || amount <= 0) { toast('Amount?'); return; }
  if (isNew || !id) {
    state.subscriptions = state.subscriptions || [];
    state.subscriptions.push({
      id: uid(), name, amount: amount.toFixed(2), period, category: category || null,
    });
  } else {
    const s = state.subscriptions.find(x => x.id === id);
    if (!s) return;
    s.name = name;
    s.amount = amount.toFixed(2);
    s.period = period;
    s.category = category || null;
  }
  saveState();
  openSubscriptions();
  toast(isNew ? 'Added' : 'Saved');
}
async function deleteSubscription(id) {
  const s = (state.subscriptions || []).find(x => x.id === id);
  if (!s) return;
  const ok = await kuzuriConfirm({
    title: `Stop tracking ${s.name}?`,
    body: 'This doesn\u2019t cancel the subscription itself.',
    confirmLabel: 'Stop tracking',
    cancelLabel: 'Keep',
    tone: 'danger',
  });
  if (!ok) return;
  state.subscriptions = state.subscriptions.filter(x => x.id !== id);
  saveState();
  openSubscriptions();
  toast('Removed');
}

  const sess = state.program.sessions[sessionId];
  if (!sess) { closeModal(); return; }
  const name = (document.getElementById('new-ex-name')?.value || '').trim();
  const setsN = parseInt(document.getElementById('new-ex-sets')?.value || '3', 10) || 3;
  const range = (document.getElementById('new-ex-range')?.value || '').trim() || '6-8';
  const intensity = (document.getElementById('new-ex-intensity')?.value || '').trim() || '1-0 RIR';
  if (!name) { toast('Exercise name?'); return; }
  sess.exercises = sess.exercises || [];
  const code = String.fromCharCode(65 + sess.exercises.length);
  sess.exercises.push({
    code, name,
    sets: Array.from({ length: setsN }, () => ({ range, intensity })),
  });
  saveState();
  closeModal();
  editSession(sessionId);
}
function editSession(sessionId) {
  const sess = state.program.sessions[sessionId];
  if (!sess) return;

  const prepList = (sess.exercises || []).filter(e => e.prep);
  const workList = (sess.exercises || []).filter(e => !e.prep);

  const renderExRow = (ex) => {
    const firstRange = ex.sets && ex.sets[0] ? ex.sets[0].range : '—';
    const rangeStr = ex.sets.every(s => s.range === firstRange)
      ? firstRange
      : ex.sets.map(s => s.range).join(' · ');
    const firstInt = ex.sets && ex.sets[0] ? ex.sets[0].intensity : '';
    const intStr = ex.sets.every(s => s.intensity === firstInt)
      ? firstInt
      : ex.sets.map(s => s.intensity).join(' · ');
    const lastStr = ex.last ? (
      ex.last.filter(s => s).map(s => s.weight + (s.reps ? '×' + s.reps : '')).join(', ')
    ) : '';
    return `
      <div class="picker-card" style="margin-bottom:6px;cursor:default;padding:12px 14px;">
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span style="font-family:ui-monospace,monospace;font-size:10px;color:var(--ink-muted);letter-spacing:0.04em;">${ex.code}</span>
          <div class="picker-card-title" style="font-size:14px;">${escapeHtml(ex.name)}</div>
        </div>
        <div class="picker-card-meta" style="margin-top:3px;">${(ex.sets || []).length} × ${escapeHtml(rangeStr)}${intStr ? ' · ' + escapeHtml(intStr) : ''}</div>
        ${ex.note ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--brass);margin-top:6px;line-height:1.4;">${escapeHtml(ex.note)}</div>` : ''}
        ${lastStr ? `<div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-family:ui-monospace,monospace;letter-spacing:0.01em;">last: ${escapeHtml(lastStr)}</div>` : ''}
      </div>
    `;
  };

  const prepBlock = prepList.length ? `
    <div class="section-h" style="margin-top:8px;">Prep</div>
    ${prepList.map(renderExRow).join('')}
  ` : '';
  const workBlock = workList.length ? `
    <div class="section-h">Work</div>
    ${workList.map(renderExRow).join('')}
  ` : '';

  openOverlay(`
    <div class="today-header">
      <div class="today-header-l">
        <div class="today-date">Session</div>
        <div class="today-title">${escapeHtml(sess.name)}</div>
      </div>
    </div>
    <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--ink-muted);margin-bottom:14px;line-height:1.5;">
      ${workList.length} exercises${prepList.length ? ` · ${prepList.length} prep` : ''} · tap &ldquo;Start&rdquo; on Train to begin.
    </div>
    ${prepBlock}
    ${workBlock}
    <button class="btn-full" onclick="addExerciseToSession('${sessionId}')" style="margin-top:16px;">+ Add exercise</button>
    <button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="openProgramEditor()">Back</button>
  `);
}
function removeExerciseFromSession(sessionId, exIdx) {
  const sess = state.program.sessions[sessionId];
  if (!sess || !sess.exercises) return;
  sess.exercises.splice(exIdx, 1);
  // Re-letter
  sess.exercises.forEach((ex, i) => { ex.code = String.fromCharCode(65 + i); });
  saveState();
  editSession(sessionId);
}
async function deleteSession(sessionId) {
  const ok = await kuzuriConfirm({
    title: 'Delete this session?',
    body: '',
    confirmLabel: 'Delete',
    cancelLabel: 'Keep',
    tone: 'danger',
  });
  if (!ok) return;
  delete state.program.sessions[sessionId];
  saveState();
  openProgramEditor();
}

async function reloadDefaultProgram() {
  const hasCustom = state.program && state.program.sessions && Object.keys(state.program.sessions).length;
  const ok = await kuzuriConfirm({
    title: hasCustom ? 'Replace your current program?' : 'Load the default program?',
    body: hasCustom
      ? 'Your logged workouts stay — only the program template resets to the Upper/Lower split.'
      : 'The default Upper/Lower split will be loaded.',
    confirmLabel: hasCustom ? 'Replace' : 'Load',
    cancelLabel: 'Cancel',
    tone: hasCustom ? 'danger' : 'primary',
  });
  if (!ok) return;
  state.program = seedDefaultProgram();
  saveState();
  render();
  toast('Program reloaded');
}

// Format minutes as "12 min" (under 60) or "1h 23m" (60+)
function formatDurationMin(min) {
  if (!isFinite(min) || min <= 0) return '—';
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

let expandedSetKey = null;  // 'exIdx-setIdx' or null
let restTimer = null;
let restEnd = null;
// Pause state for the floating rest chip
let restPausedAt = null;       // Timestamp when paused (also acts as a paused flag)
let restPausedRemaining = 0;   // Seconds left at pause time

async function startLiftSession(sessionId) {
  // v3.0.5 (Group 6): confirmation prompt before starting a session.
  // Pulls expected duration from the most recent prior workout for context.
  const sess = state.program && state.program.sessions[sessionId];
  if (!sess) { toast('Session not found'); return; }

  // Prior workout for duration estimate
  const priorWorkouts = (state.workouts || [])
    .filter(w => w.type === 'lift' && w.session_name === sess.name)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const lastDur = priorWorkouts[0] && priorWorkouts[0].duration_min;
  const totalSets = (sess.exercises || []).reduce((a, ex) => a + (ex.prep ? 0 : (ex.sets || []).length), 0);
  const setsLine = totalSets ? `${totalSets} working ${totalSets === 1 ? 'set' : 'sets'}` : '';
  const durLine = lastDur ? `\u00b7 last took ${lastDur} min` : '';

  const ok = await kuzuriConfirm({
    title: `Begin ${sess.name}?`,
    body: [setsLine, durLine].filter(Boolean).join(' ') || 'Take your time.',
    confirmLabel: 'Begin',
    cancelLabel: 'Cancel',
    tone: 'primary',
  });
  if (!ok) return;
  _doStartLiftSession(sessionId);
}

function _doStartLiftSession(sessionId) {
  const sess = state.program && state.program.sessions[sessionId];
  if (!sess) { toast('Session not found'); return; }

  // Find the most recent prior workout for this session (by name match)
  const priorWorkouts = (state.workouts || [])
    .filter(w => w.type === 'lift' && w.session_name === sess.name)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const lastWorkout = priorWorkouts[0] || null;

  // Build a map of exercise name → last_note from prior session (for carry-forward)
  const lastNoteMap = {};
  if (lastWorkout) {
    for (const ex of (lastWorkout.exercises || [])) {
      if (ex._next_note && ex._next_note.trim()) {
        lastNoteMap[ex.name] = ex._next_note.trim();
      }
    }
  }

  // v3.0.5 (Group 6): build a map of exercise name → most recent in-app
  // logged sets across ALL prior sessions. This is what powers the "last:
  // 80×6, 80×5, 75×5" line on each exercise card. Previously this came from
  // the program's seed data only — now it tracks what you actually lifted.
  const lastSetsMap = {};
  for (const wk of [...(state.workouts || [])].reverse()) {
    if (wk.type !== 'lift') continue;
    for (const ex of (wk.exercises || [])) {
      if (!ex.name) continue;
      if (lastSetsMap[ex.name]) continue;  // already have a more recent one
      const loggedSets = (ex.sets || []).filter(s => s.rating && (s.weight || s.reps != null));
      if (!loggedSets.length) continue;
      lastSetsMap[ex.name] = loggedSets.map(s => ({
        weight: s.weight || '',
        reps: s.reps != null ? s.reps : '',
      }));
    }
  }

  activeWorkout = {
    id: uid(),
    type: 'lift',
    session_id: sessionId,
    session_name: sess.name,
    started_at: Date.now(),
    ts: new Date().toISOString(),
    exercises: (sess.exercises || []).map(ex => ({
      code: ex.code,
      name: ex.name,
      note: ex.note || '',
      prep: !!ex.prep,
      // v3.0.5: prefer in-app history over program seed
      last: lastSetsMap[ex.name] || ex.last || null,
      last_note: lastNoteMap[ex.name] || '',
      _next_note: '',
      sets: (ex.sets || []).map(s => ({ ...s })),
    })),
  };
  saveActiveWorkout();
  expandedSetKey = null;
  renderLiftSession();
}
function renderLiftSession() {
  if (!activeWorkout) return;
  // Count work-only sets for progress (prep is separate)
  const workExercises = activeWorkout.exercises.filter(e => !e.prep);
  const prepExercises = activeWorkout.exercises.filter(e => e.prep);
  const totalSets = workExercises.reduce((a, e) => a + e.sets.length, 0);
  const doneSets = workExercises.reduce((a, e) => a + e.sets.filter(s => s.rating).length, 0);
  const elapsedMin = Math.floor((Date.now() - activeWorkout.started_at) / 60000);
  const elapsed = elapsedMin <= 0 ? 'just started' : formatDurationMin(elapsedMin);
  const currentIdx = activeWorkout.exercises.findIndex(e => !e.prep && e.sets.some(s => !s.rating));
  // Floating circular rest chip — only when timer active
  const restChipHTML = restEnd || restPausedAt ? (() => {
    const isPaused = !!restPausedAt;
    const remaining = isPaused
      ? restPausedRemaining
      : Math.max(0, Math.ceil((restEnd - Date.now())/1000));
    const mm = Math.floor(remaining / 60);
    const ss = String(remaining % 60).padStart(2, '0');
    const total = window.__restTotal || 90;
    const pct = Math.max(0, Math.min(1, remaining / total));
    const r = 32, c = 2 * Math.PI * r;
    const dashOffset = c * (1 - pct);
    const ringColor = isPaused ? 'var(--ink-faint)' : 'var(--brass)';
    const textColor = isPaused ? 'var(--ink-muted)' : 'var(--ink)';
    const labelColor = isPaused ? 'var(--ink-faint)' : 'var(--brass)';
    const labelText = isPaused ? 'PAUSED' : 'REST';
    // v3.3.2: aria-label reflects actual next action (pause vs resume)
    const circleAriaLabel = isPaused ? 'Resume rest' : 'Pause rest';
    return `
      <div class="rest-chip" id="rest-chip">
        <button class="rest-chip-circle" id="rest-chip-circle" onclick="onRestChipTap()" aria-label="${circleAriaLabel}">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="${r}" fill="var(--surface)" stroke="var(--ring-track)" stroke-width="3"/>
            <circle cx="40" cy="40" r="${r}" fill="none" stroke="${ringColor}" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}" transform="rotate(-90 40 40)"
                    class="rest-chip-arc"/>
            <text x="40" y="38" text-anchor="middle" class="rest-chip-time" fill="${textColor}">${mm}:${ss}</text>
            <text x="40" y="51" text-anchor="middle" class="rest-chip-label" fill="${labelColor}">${labelText}</text>
          </svg>
        </button>
        <div class="rest-chip-ctrls">
          <button class="rest-chip-btn" onclick="adjustRest(-15)" aria-label="Subtract 15 seconds">−15</button>
          <button class="rest-chip-btn" onclick="adjustRest(15)" aria-label="Add 15 seconds">+15</button>
        </div>
        <button class="rest-chip-skip" onclick="skipRest()" aria-label="Skip rest">Skip</button>
      </div>
    `;
  })() : '';

  // ── Prep card (grouped, collapsible) ──────────────────────────────
  let prepCard = '';
  if (prepExercises.length) {
    const prepDone = prepExercises.every(e => e.prep_done);
    const isExpanded = !!activeWorkout._prep_expanded;
    const prepStatus = prepDone ? 'Done' : `${prepExercises.filter(e => e.prep_done).length} of ${prepExercises.length}`;
    const prepItems = prepExercises.map(ex => {
      const origIdx = activeWorkout.exercises.indexOf(ex);
      return `
        <button class="prep-item ${ex.prep_done ? 'done' : ''}" onclick="togglePrepItem(${origIdx})">
          <div class="prep-item-tick">${ex.prep_done ? '✓' : ''}</div>
          <div class="prep-item-body">
            <div class="prep-item-name">${escapeHtml(ex.name)}</div>
            <div class="prep-item-meta">${ex.sets.length} × ${ex.sets[0]?.range || ''}${ex.sets[0]?.intensity ? ' · ' + ex.sets[0].intensity : ''}${ex.note ? ' · ' + escapeHtml(ex.note) : ''}</div>
          </div>
        </button>
      `;
    }).join('');
    prepCard = `
      <div class="prep-card ${prepDone ? 'done' : ''}">
        <button class="prep-card-head" onclick="togglePrepCard()">
          <div class="prep-card-head-l">
            <div class="prep-card-kicker">Prep</div>
            <div class="prep-card-title">Warmup &amp; activation</div>
            <div class="prep-card-sub">${prepExercises.length} items · ${prepStatus}</div>
          </div>
          <div class="prep-card-chevron ${isExpanded ? 'open' : ''}">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5l3 3 3-3"/></svg>
          </div>
        </button>
        ${isExpanded ? `
          <div class="prep-card-body">
            ${prepItems}
            ${!prepDone ? `
              <button class="prep-mark-all" onclick="markAllPrepDone()">Mark all prep done</button>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  // ── Work exercise cards ──────────────────────────────────────────
  const workCards = workExercises.map((ex) => {
    const exIdx = activeWorkout.exercises.indexOf(ex);
    const isCurrent = exIdx === currentIdx;
    const allDone = ex.sets.length > 0 && ex.sets.every(s => s.rating);
    const anyLogged = ex.sets.some(s => s.rating);
    const cls = allDone ? 'done' : (isCurrent ? 'current' : '');
    const showHandle = !anyLogged;

    // Auto-collapse when all sets done, unless user has explicitly expanded
    // ex._collapsed === undefined → default behavior (allDone = collapse)
    // ex._collapsed === false → user manually expanded
    // ex._collapsed === true → user manually collapsed
    const collapsed = ex._collapsed !== undefined ? ex._collapsed : allDone;

    const handleHTML = showHandle ? `
      <button class="drag-handle"
              ontouchstart="dragStart(${exIdx}, event)"
              onmousedown="dragStart(${exIdx}, event)"
              onclick="event.stopPropagation()"
              aria-label="Reorder">
        <svg viewBox="0 0 12 16" fill="none"><circle cx="3.5" cy="3" r="1.2" fill="currentColor"/><circle cx="8.5" cy="3" r="1.2" fill="currentColor"/><circle cx="3.5" cy="8" r="1.2" fill="currentColor"/><circle cx="8.5" cy="8" r="1.2" fill="currentColor"/><circle cx="3.5" cy="13" r="1.2" fill="currentColor"/><circle cx="8.5" cy="13" r="1.2" fill="currentColor"/></svg>
      </button>` : '';

    // Collapsed summary line — most useful info at a glance
    let summaryLine = '';
    if (collapsed && anyLogged) {
      const loggedSets = ex.sets.filter(s => s.rating);
      const setStrs = loggedSets.map(s => {
        const w = s.weight || '—';
        const r = s.reps != null ? s.reps : '?';
        const star = s.rating === 'pr' ? '★' : '';
        return `${w}×${r}${star}`;
      });
      summaryLine = setStrs.join(', ');
    }

    // Per-exercise "note for next time" — surfaces on next session
    const liveNote = ex._next_note || '';
    const lastSessionNote = ex.last_note || '';

    // Last-session line: weights/reps + carry-forward note from prior session
    const lastWeightsLine = ex.last
      ? `<div style="font-size:10.5px;color:var(--ink-faint);padding:4px 14px 2px;font-family:ui-monospace,monospace;letter-spacing:0.01em;">last: ${ex.last.filter(s => s).map(s => s.weight + (s.reps ? '×' + s.reps : '')).join(', ')}</div>`
      : '';
    const lastNoteLine = lastSessionNote
      ? `<div style="padding:2px 14px 4px;font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-muted);line-height:1.4;">last note · ${escapeHtml(lastSessionNote)}</div>`
      : '';

    if (collapsed) {
      // Collapsed view — chevron right, summary line, tap to expand.
      // v3.0.10: Using <div> instead of <button> here. Safari/iOS browsers
      // apply odd internal flex layout to <button> elements that broke the
      // .ex-header flex row (drag handle + letter + title were stacking
      // vertically and the card extended with empty space). The expanded
      // card uses <div> too, so this also brings the two states in line.
      return `
        <div class="ex-card ex-card-collapsed ${cls}" id="excard-${exIdx}"
             role="button" tabindex="0"
             onclick="toggleExerciseCollapse(${exIdx})">
          <div class="ex-header" style="margin-bottom:0;">
            ${handleHTML}
            <div class="ex-letter">${ex.code}</div>
            <div class="ex-name">${escapeHtml(ex.name)}</div>
            <div class="ex-collapse-chevron"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5l3 3 3-3"/></svg></div>
          </div>
          ${summaryLine ? `<div class="ex-summary-line">${escapeHtml(summaryLine)}</div>` : ''}
        </div>
      `;
    }

    // Expanded view
    const setRows = ex.sets.map((s, si) => renderSetRow(ex, exIdx, s, si)).join('');
    const lastSetUnlogged = ex.sets.length > 0 && !ex.sets[ex.sets.length - 1].rating;
    return `
      <div class="ex-card ${cls}" id="excard-${exIdx}">
        <div class="ex-header" onclick="toggleExerciseCollapse(${exIdx})" style="cursor:pointer;">
          ${handleHTML}
          <div class="ex-letter">${ex.code}</div>
          <div class="ex-name">${escapeHtml(ex.name)}</div>
          <div class="ex-collapse-chevron open"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5l3 3 3-3"/></svg></div>
        </div>
        <div class="ex-prescription">${ex.sets.length} sets · ${ex.sets[0]?.intensity || ''}</div>
        ${ex.note ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:11.5px;color:var(--brass);padding:4px 14px 0;line-height:1.45;">${escapeHtml(ex.note)}</div>` : ''}
        ${lastWeightsLine}
        ${lastNoteLine}
        ${setRows}
        <div class="ex-set-ctrls">
          <button class="ex-set-btn" onclick="addExerciseSet(${exIdx})">+ Add a set</button>
          ${(ex.sets.length > 1 && lastSetUnlogged) ? `<button class="ex-set-btn ex-set-btn-rm" onclick="removeLastExerciseSet(${exIdx})">− Remove last</button>` : ''}
        </div>
        <div class="ex-next-note-wrap">
          <label class="ex-next-note-label">Note for next time <span style="color:var(--ink-faint);font-style:italic;font-family:'Fraunces',serif;letter-spacing:0;text-transform:none;font-size:10px;">optional</span></label>
          <textarea class="ex-next-note" placeholder="Hack squat 70 next time · used straps · machine 3 felt better"
                    oninput="updateExerciseNextNote(${exIdx}, this.value)"
                    onblur="commitExerciseNextNote(${exIdx})">${escapeHtml(liveNote)}</textarea>
        </div>
      </div>
    `;
  }).join('');

  const overlayEl = document.getElementById('overlay');
  overlayEl.innerHTML = `
    <div class="overlay-controls">
      <button class="overlay-ctrl-btn" onclick="toggleTheme()" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
      </button>
      <button class="overlay-close" onclick="confirmCancelLift()">×</button>
    </div>
    <div class="overlay-inner${restEnd ? ' resting' : ''}" style="padding-bottom:140px">
      <div class="workout-header sticky">
        <div>
          <div class="workout-meta-l">In session</div>
          <div class="workout-meta-t">${escapeHtml(activeWorkout.session_name)}</div>
          <div class="workout-progress">${elapsed} · ${doneSets} of ${totalSets} sets</div>
        </div>
      </div>
      ${prepCard}
      ${workCards}
    </div>
    ${restChipHTML}
    <div class="workout-cta">
      <button class="btn-primary" onclick="finishLiftSession()">Finish workout</button>
      <button class="btn-secondary" onclick="confirmCancelLift()">Save · close</button>
    </div>
  `;
  overlayEl.classList.add('active');
  // v3.0.5 (Group 6): wire up the floating rest chip drag (no-op if no chip)
  setupRestChipDrag();
}
// Exercise card: toggle expand/collapse (auto-collapses on full completion by default)
function toggleExerciseCollapse(exIdx) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex) return;
  const allDone = ex.sets.length > 0 && ex.sets.every(s => s.rating);
  // Default state matches allDone — toggling flips relative to that
  const currentlyCollapsed = ex._collapsed !== undefined ? ex._collapsed : allDone;
  ex._collapsed = !currentlyCollapsed;
  renderLiftSession();
}

// Add a set to an exercise mid-workout. New set inherits range/intensity from last prescribed set.
function addExerciseSet(exIdx) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex) return;
  const lastSet = ex.sets[ex.sets.length - 1] || { range: '', intensity: '' };
  ex.sets.push({
    range: lastSet.range || '',
    intensity: lastSet.intensity || '',
    weight: '', reps: '', rating: null,
  });
  // If the exercise was collapsed (because all sets were done), expand it
  ex._collapsed = false;
  renderLiftSession();
}

// Remove the last set from an exercise — only allowed if it's unlogged
function removeLastExerciseSet(exIdx) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex || ex.sets.length <= 1) return;
  const last = ex.sets[ex.sets.length - 1];
  if (last.rating) return; // safety: don't remove a logged set
  ex.sets.pop();
  renderLiftSession();
}

// Per-exercise "note for next time" — typed during the workout, surfaces on next session's card
function updateExerciseNextNote(exIdx, value) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex) return;
  ex._next_note = value;
}
function commitExerciseNextNote(exIdx) {
  // Persist on blur — saves the note into the workout state for save-time write to program
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex) return;
  saveState();
}

// Prep card: toggle open/closed, tick individual items, mark all done
function togglePrepCard() {
  if (!activeWorkout) return;
  activeWorkout._prep_expanded = !activeWorkout._prep_expanded;
  renderLiftSession();
}
function togglePrepItem(exIdx) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[exIdx];
  if (!ex || !ex.prep) return;
  ex.prep_done = !ex.prep_done;
  renderLiftSession();
}
function markAllPrepDone() {
  if (!activeWorkout) return;
  activeWorkout.exercises.forEach(ex => {
    if (ex.prep) ex.prep_done = true;
  });
  // Collapse after marking done — keeps the screen tidy for the real work
  activeWorkout._prep_expanded = false;
  renderLiftSession();
}

function renderSetRow(ex, exIdx, set, setIdx) {
  const isExpanded = expandedSetKey === `${exIdx}-${setIdx}`;
  const isLogged = !!set.rating;
  if (isExpanded) {
    const chips = prepWeightsFor(ex.name, setIdx);
    const chipRow = chips.length ? `
      <div class="prep-chips">
        ${chips.map((w, i) => `<button class="prep-chip ${i === 0 ? 'suggest' : ''}" onclick="applyPrepWeight(${exIdx},${setIdx},'${escapeJs(w)}')">${escapeHtml(w)}</button>`).join('')}
      </div>` : '';
    return `
      <div class="set-row expanded" id="setrow-${exIdx}-${setIdx}">
        <div class="set-expand-meta">
          <div class="set-num">${setIdx + 1}</div>
          <div class="set-range">${set.range || ''}</div>
          <div class="set-expand-label">Set ${setIdx + 1} of ${ex.sets.length}</div>
        </div>
        ${chipRow}
        <div class="set-input-row">
          <input type="text" id="w-${exIdx}-${setIdx}" class="set-input"
                 placeholder="kg or BW" value="${escapeHtml(set.weight || '')}" inputmode="text" autocomplete="off">
          <span class="set-input-x">×</span>
          <input type="number" id="r-${exIdx}-${setIdx}" class="set-input reps"
                 placeholder="reps" value="${escapeHtml(set.reps || '')}" inputmode="numeric" autocomplete="off">
          <button class="set-save-btn" onclick="saveSetEntry(${exIdx},${setIdx})" aria-label="Save">
            <svg viewBox="0 0 12 12" fill="none"><path d="M2 6 L5 9 L10 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          ${isLogged ? `<button class="set-del-btn" onclick="clearSetEntry(${exIdx},${setIdx})" aria-label="Clear">×</button>` : ''}
        </div>
      </div>`;
  }
  if (isLogged) {
    return `
      <div class="set-row logged" onclick="expandSet(${exIdx},${setIdx})">
        <div class="set-num">${setIdx + 1}</div>
        <div class="set-range">${set.range || ''}</div>
        <div class="set-logged-vals">
          <span>${escapeHtml(set.weight || '—')}${set.weight && /^\d/.test(set.weight) ? ' kg' : ''}</span>
          <span class="set-logged-sep">×</span>
          <span>${escapeHtml(set.reps || '—')}</span>
        </div>
        <svg class="set-chev check" viewBox="0 0 10 10"><path d="M2 5 L4.5 7.5 L8.5 2.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
  }
  return `
    <div class="set-row" onclick="expandSet(${exIdx},${setIdx})">
      <div class="set-num">${setIdx + 1}</div>
      <div class="set-range">${set.range || ''}</div>
      <div class="set-hint">Tap to log</div>
      <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6"/></svg>
    </div>`;
}
function escapeJs(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
function expandSet(exIdx, setIdx) {
  expandedSetKey = `${exIdx}-${setIdx}`;
  renderLiftSession();
  setTimeout(() => {
    const w = document.getElementById(`w-${exIdx}-${setIdx}`);
    if (w) w.focus();
  }, 80);
}
function saveSetEntry(exIdx, setIdx) {
  const w = document.getElementById(`w-${exIdx}-${setIdx}`).value.trim();
  const r = document.getElementById(`r-${exIdx}-${setIdx}`).value.trim();
  if (!w && !r) { expandedSetKey = null; renderLiftSession(); return; }
  const set = activeWorkout.exercises[exIdx].sets[setIdx];
  const wasLogged = !!set.rating;
  set.weight = w;
  set.reps = r;
  set.rating = set.rating || 'prescribed';
  set.logged_at = set.logged_at || new Date().toISOString();
  saveActiveWorkout();
  expandedSetKey = null;
  if (!wasLogged) {
    startRestTimer(90);
    // Auto-advance
    const nextIdx = activeWorkout.exercises[exIdx].sets.findIndex((s, i) => i > setIdx && !s.rating);
    if (nextIdx >= 0) {
      setTimeout(() => { expandedSetKey = `${exIdx}-${nextIdx}`; renderLiftSession(); setTimeout(() => { const el = document.getElementById(`w-${exIdx}-${nextIdx}`); if (el) el.focus(); }, 80); }, 180);
      return;
    }
  }
  renderLiftSession();
}
function clearSetEntry(exIdx, setIdx) {
  const set = activeWorkout.exercises[exIdx].sets[setIdx];
  set.weight = ''; set.reps = ''; set.rating = null; set.logged_at = null;
  saveActiveWorkout();
  expandedSetKey = null;
  renderLiftSession();
}

// ── Active workout persistence (hard-pause) ─────────────────────────────
// Persists activeWorkout to state so it survives navigation and reload.
function saveActiveWorkout() {
  if (!activeWorkout) return;
  state._active_workout = activeWorkout;
  saveState();
}
function clearActiveWorkout() {
  state._active_workout = null;
  saveState();
}
// Returns the persisted active workout iff it's from today (local) and has logged sets
function pausedWorkoutFromToday() {
  const w = state._active_workout;
  if (!w) return null;
  if (!isSameDay(w.ts, todayISO())) return null;
  return w;
}
function resumePausedWorkout() {
  const w = pausedWorkoutFromToday();
  if (!w) return;
  activeWorkout = w;
  expandedSetKey = null;
  renderLiftSession();
}
// Discard a paused session entirely
async function discardPausedWorkout() {
  const ok = await kuzuriConfirm({
    title: 'Discard the paused session?',
    body: 'Logged sets will be lost.',
    confirmLabel: 'Discard',
    cancelLabel: 'Keep',
    tone: 'danger',
  });
  if (!ok) return;
  clearActiveWorkout();
  render();
  toast('Discarded');
}
function startRestTimer(seconds) {
  stopRestTimer();
  restEnd = Date.now() + seconds * 1000;
  window.__restTotal = seconds;  // Store original duration for ring-fill ratio
  restPausedAt = null;
  restPausedRemaining = 0;
  restTimer = setInterval(() => {
    if (restPausedAt) return;  // No tick while paused
    const remaining = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    updateRestChipDOM(remaining);
    if (remaining <= 0) {
      stopRestTimer();
      if (activeWorkout) renderLiftSession();
    }
  }, 250);
  // Trigger a render so the chip appears immediately
  if (activeWorkout) renderLiftSession();
}
// Update the chip DOM in place (called every tick while running)
function updateRestChipDOM(remaining) {
  const timeEl = document.querySelector('.rest-chip-time');
  if (!timeEl) return;
  const mm = Math.floor(remaining / 60);
  const ss = String(remaining % 60).padStart(2, '0');
  timeEl.textContent = `${mm}:${ss}`;
  // Update ring fill
  const arc = document.querySelector('.rest-chip-arc');
  if (arc) {
    const total = window.__restTotal || 90;
    const r = 32, c = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(1, remaining / total));
    arc.setAttribute('stroke-dashoffset', (c * (1 - pct)).toFixed(1));
  }
}
function stopRestTimer() {
  if (restTimer) clearInterval(restTimer);
  restTimer = null;
  restEnd = null;
  restPausedAt = null;
  restPausedRemaining = 0;
  window.__restTotal = null;
  // Old selectors kept for safety
  const badge = document.getElementById('rest-badge');
  if (badge) badge.remove();
  const bar = document.getElementById('rest-bar');
  if (bar) bar.remove();
  const chip = document.getElementById('rest-chip');
  if (chip) chip.remove();
}
// v3.3.2: clear 3-state tap behavior
//   running → pause
//   paused  → resume (recalculate restEnd from remaining)
// Explicit skip/dismiss is handled by skipRest() only — never by this handler.
function onRestChipTap() {
  if (!restEnd && !restPausedAt) return;
  if (!restPausedAt) {
    // Running → pause
    restPausedAt = Date.now();
    restPausedRemaining = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    renderLiftSession();
  } else {
    // Paused → resume: push restEnd forward by the remaining time
    restEnd = Date.now() + restPausedRemaining * 1000;
    restPausedAt = null;
    restPausedRemaining = 0;
    renderLiftSession();
  }
}
// Explicit skip — the only way to dismiss the timer early
function skipRest() {
  stopRestTimer();
  if (activeWorkout) renderLiftSession();
}
function adjustRest(deltaSec) {
  if (!restEnd) return;
  if (restPausedAt) {
    // Adjust the held remaining time
    restPausedRemaining = Math.max(0, restPausedRemaining + deltaSec);
    if (restPausedRemaining <= 0) {
      stopRestTimer();
      renderLiftSession();
      return;
    }
    renderLiftSession();
    return;
  }
  // Running: shift restEnd
  restEnd += deltaSec * 1000;
  if (restEnd <= Date.now() + 1000) {
    stopRestTimer();
    renderLiftSession();
    return;
  }
  renderLiftSession();
}

// ═══════════════════════════════════════════════════════════════════════
// v3.0.5 (Group 6) — DRAGGABLE REST CHIP
// Long-press the rest chip to arm drag mode, then drag anywhere on screen.
// Position persists in localStorage across sessions.
// ═══════════════════════════════════════════════════════════════════════
const REST_CHIP_POS_KEY = 'kuzuri_rest_chip_pos';
function setupRestChipDrag() {
  const chip = document.getElementById('rest-chip');
  if (!chip) return;

  // Restore saved position (if any). We use left/top instead of right/top
  // once the user has explicitly placed it.
  try {
    const saved = JSON.parse(localStorage.getItem(REST_CHIP_POS_KEY) || 'null');
    if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
      // Clamp to viewport in case the screen rotated or shrank
      const w = chip.offsetWidth || 90;
      const h = chip.offsetHeight || 130;
      const maxLeft = window.innerWidth - w - 8;
      const maxTop = window.innerHeight - h - 8;
      chip.style.left = `${Math.max(8, Math.min(saved.left, maxLeft))}px`;
      chip.style.top = `${Math.max(8, Math.min(saved.top, maxTop))}px`;
      chip.style.right = 'auto';
    }
  } catch (e) { /* ignore */ }

  let pressTimer = null;
  let dragging = false;
  let startX = 0, startY = 0;
  let originLeft = 0, originTop = 0;

  const onPress = (clientX, clientY) => {
    startX = clientX; startY = clientY;
    const rect = chip.getBoundingClientRect();
    originLeft = rect.left;
    originTop = rect.top;
    chip.classList.add('long-press-armed');
    pressTimer = setTimeout(() => {
      dragging = true;
      chip.classList.remove('long-press-armed');
      chip.classList.add('dragging');
      // Convert to absolute positioning at current location
      chip.style.left = `${originLeft}px`;
      chip.style.top = `${originTop}px`;
      chip.style.right = 'auto';
      // Subtle haptic on iOS, no-op elsewhere
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
    }, 380);
  };

  const onMove = (clientX, clientY) => {
    if (!dragging) {
      // If pointer moved more than ~12px before long-press fires, cancel
      const dx = clientX - startX;
      const dy = clientY - startY;
      if (Math.sqrt(dx*dx + dy*dy) > 12) {
        clearTimeout(pressTimer);
        chip.classList.remove('long-press-armed');
        pressTimer = null;
      }
      return;
    }
    const dx = clientX - startX;
    const dy = clientY - startY;
    let newLeft = originLeft + dx;
    let newTop = originTop + dy;
    // Clamp to viewport with 8px margin
    const w = chip.offsetWidth;
    const h = chip.offsetHeight;
    newLeft = Math.max(8, Math.min(newLeft, window.innerWidth - w - 8));
    newTop = Math.max(8, Math.min(newTop, window.innerHeight - h - 8));
    chip.style.left = `${newLeft}px`;
    chip.style.top = `${newTop}px`;
  };

  const onRelease = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    chip.classList.remove('long-press-armed');

      dragging = false;
      chip.classList.remove('dragging');
      // Persist final position
      const rect = chip.getBoundingClientRect();
      try {
        localStorage.setItem(REST_CHIP_POS_KEY, JSON.stringify({
          left: rect.left,
          top: rect.top,
        }));
      } catch (e) { /* ignore */ }
    }
  };

  // Touch
  chip.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    onPress(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  chip.addEventListener('touchmove', (e) => {
    if (!pressTimer && !dragging) return;
    if (dragging) e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  chip.addEventListener('touchend', onRelease);
  chip.addEventListener('touchcancel', onRelease);

  // Mouse (for desktop dev / debugging)
  chip.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    onPress(e.clientX, e.clientY);
    const moveHandler = (ev) => onMove(ev.clientX, ev.clientY);
    const upHandler = () => {
      onRelease();
      window.removeEventListener('mousemove', moveHandler);
      window.removeEventListener('mouseup', upHandler);
    };
    window.addEventListener('mousemove', moveHandler);
    window.addEventListener('mouseup', upHandler);
  });

  // If user just taps without long-pressing, the existing onclick handler
  // (onRestChipTap) still fires through the button — drag mode never engaged.
}

// ── Weight parser (string weights: "BW", "BW+10", "80kg", etc.)
function parseWeight(str) {
  if (!str) return { numeric: null, raw: '', hasBodyweight: false };
  const s = String(str).trim();
  if (!s) return { numeric: null, raw: '', hasBodyweight: false };
  const upper = s.toUpperCase();
  if (upper === 'BW' || upper === 'BODYWEIGHT') return { numeric: 0, raw: s, hasBodyweight: true };
  const bw = upper.match(/^BW\s*([+-])\s*(\d+(?:\.\d+)?)/);
  if (bw) return { numeric: (bw[1] === '-' ? -1 : 1) * parseFloat(bw[2]), raw: s, hasBodyweight: true };
  const n = s.match(/^(-?\d+(?:\.\d+)?)/);
  if (n) return { numeric: parseFloat(n[1]), raw: s, hasBodyweight: false };
  return { numeric: null, raw: s, hasBodyweight: false };
}
function prepWeightsFor(exerciseName, setIdx) {
  const seen = new Set();
  const chips = [];
  const past = [...state.workouts].reverse();
  for (const wk of past) {
    if (wk.type !== 'lift') continue;
    if (wk.id === (activeWorkout && activeWorkout.id)) continue;
    const ex = (wk.exercises || []).find(e => e.name === exerciseName);
    if (!ex) continue;
    const ordered = [ex.sets[setIdx], ...ex.sets.filter((_, i) => i !== setIdx)].filter(Boolean);
    for (const s of ordered) {
      if (!s.weight) continue;
      const w = String(s.weight).trim();
      if (!w || seen.has(w)) continue;
      seen.add(w);
      chips.push(w);
      if (chips.length >= 4) return chips;
    }
  }
  // Fallback to seeded last-session data on the active workout's exercise
  if (!chips.length && activeWorkout) {
    const liveEx = activeWorkout.exercises.find(e => e.name === exerciseName);
    if (liveEx && liveEx.last) {
      const ordered = [liveEx.last[setIdx], ...liveEx.last.filter((_, i) => i !== setIdx)].filter(Boolean);
      for (const s of ordered) {
        if (!s || s.weight == null) continue;
        const w = String(s.weight).trim();
        if (!w || seen.has(w)) continue;
        seen.add(w);
        chips.push(w);
        if (chips.length >= 4) return chips;
      }
    }
  }
  return chips;
}

  const w = document.getElementById(`w-${exIdx}-${setIdx}`);
  if (w) {
    w.value = weight;

}

// TRAINING — STOIC CLOSE (lift)
// ═══════════════════════════════════════════════════════════════════════
function detectPR(workout) {
  if (!workout.exercises) return null;
  let bestNew = null;
  for (const exercise of workout.exercises) {
    for (const set of (exercise.sets || [])) {
      const p = parseWeight(set.weight);
      if (p.numeric == null) continue;
      const r = parseInt(set.reps);
      if (!r) continue;
      let histBest = null;
      state.workouts.forEach(wk => {
        if (wk.id === workout.id || wk.type !== 'lift') return;
        (wk.exercises || []).forEach(e => {
          if (e.name !== exercise.name) return;
          (e.sets || []).forEach(s => {
            const pp = parseWeight(s.weight);
            const pr = parseInt(s.reps);
            if (pp.numeric == null || !pr || pr < r) return;
            if (p.hasBodyweight !== pp.hasBodyweight) return;
            if (histBest === null || pp.numeric > histBest) histBest = pp.numeric;
          });
        });
      });
      if (histBest !== null && p.numeric >= histBest) {
        const score = p.numeric * r;
        if (!bestNew || score > bestNew.score) {
          bestNew = { exercise: exercise.name, weight: p.raw, reps: r, score, matched: p.numeric === histBest };
        }
      }
    }
  }
  return bestNew;
}
function marqueeLift(workout) {
  let best = null;
  for (const exercise of workout.exercises || []) {
    for (const set of (exercise.sets || [])) {
      const p = parseWeight(set.weight);
      if (p.numeric == null) continue;
      const r = parseInt(set.reps);
      if (!r) continue;
      const score = p.numeric * r;
      if (!best || score > best.score) best = { weight: p.raw, reps: r, score };
    }
  }
  return best;
}
function sessionShape(workout) {
  const sets = (workout.exercises || []).flatMap(e => e.sets || []);
  const rated = sets.filter(s => s.rating);
  if (rated.length === 0) return 'minimal';
  if (detectPR(workout)) return 'pr';
  if (rated.length < 6) return 'minimal';
  const scaled = rated.filter(s => s.rating === 'scaled' || s.rating === 'easier').length;
  const honest = rated.filter(s => s.rating === 'prescribed' || s.rating === 'pr').length;
  if (scaled > honest) return 'scaled';
  return 'solid';
}

  const q = pool[Math.floor(Math.random() * pool.length)];

  const honest = (workout.exercises || []).reduce((a, e) => a + (e.sets || []).filter(s => s.rating === 'prescribed' || s.rating === 'pr').length, 0);

      seen.set(key, {
        name: w.activity_name.trim(),
        emoji: w.emoji || suggestHabitEmoji(w.activity_name)[0] || '',
      });
    }
    if (seen.size >= limit) break;
  }
  return Array.from(seen.values());
}

function startActivity() {
  activeActivity = {
    id: uid(),
    type: 'activity',
    activity_name: '',
    emoji: '',
    duration_min: null,
    effort: null,
    close_note: '',
    started_at: Date.now(),
  };
  renderActivitySheet();
}

function pickRecentActivity(name, emoji) {
  if (!activeActivity) return;
  // Preserve current field values before re-render
  const dur = document.getElementById('act-dur'); if (dur) activeActivity.duration_min = parseInt(dur.value, 10) || null;
  const note = document.getElementById('act-note'); if (note) activeActivity.close_note = note.value;
  activeActivity.activity_name = name;
  activeActivity.emoji = emoji || suggestHabitEmoji(name)[0] || '';
  renderActivitySheet();
}

function setActivityEffort(e) {
  if (!activeActivity) return;
  // Preserve fields
  const nameEl = document.getElementById('act-name'); if (nameEl) {
    activeActivity.activity_name = nameEl.value;
    activeActivity.emoji = suggestHabitEmoji(nameEl.value)[0] || '';
  }
  const dur = document.getElementById('act-dur'); if (dur) activeActivity.duration_min = parseInt(dur.value, 10) || null;
  const note = document.getElementById('act-note'); if (note) activeActivity.close_note = note.value;
  activeActivity.effort = (activeActivity.effort === e) ? null : e;
  renderActivitySheet();
}

function onActivityNameInput(val) {
  if (!activeActivity) return;
  activeActivity.activity_name = val;
  activeActivity.emoji = suggestHabitEmoji(val)[0] || '';

  const prev = document.getElementById('act-emoji-preview');

function saveActivity() {
  if (!activeActivity) return;
  const nameEl = document.getElementById('act-name');
  const name = nameEl ? nameEl.value.trim() : activeActivity.activity_name.trim();
  if (!name) {
    toast('Name the activity');
    if (nameEl) nameEl.focus();
    return;
  }
  const dur = document.getElementById('act-dur');
  const note = document.getElementById('act-note');
  const emoji = suggestHabitEmoji(name)[0] || '';
  const record = {
    id: activeActivity.id,
    type: 'activity',
    activity_name: name,
    emoji: emoji,
    session_name: name,  // for compat with surfaces that read session_name
    ts: new Date().toISOString(),
    started_at: activeActivity.started_at,
    duration_min: dur ? (parseInt(dur.value, 10) || null) : null,
    effort: activeActivity.effort || null,
    close_note: note ? note.value.trim() : '',
  };
  state.workouts.push(record);
  saveState();
  closeOverlay();
  activeActivity = null;
  render();
  toast('Logged.');
}

function activitySummaryLine(act) {
  const parts = [];
  if (act.duration_min) parts.push(formatDurationMin(act.duration_min));
  if (act.effort) {
    const sym = act.effort === 'down' ? '⏷' : act.effort === 'up' ? '⏶' : '·';
    parts.push(sym);
  }
  return parts.join(' · ');
}
