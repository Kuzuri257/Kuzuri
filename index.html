// WHOOP INTEGRATION (v3.0)
// Backend: Cloudflare Worker at WORKER_BASE_URL
// Sync runs:
//   - On app load if URL has ?whoop=connected (just-finished OAuth)
//   - On app load if last sync >24h ago (background)
//   - Manually via Settings → Whoop tile → Sync now
// Whoop sleep auto-fills the Pulse ring; manual entries override.
// ═══════════════════════════════════════════════════════════════════════
function startWhoopOAuth() {
  // v3.1.0: use new multi-user path with return_to for staging/production routing
  const returnTo = encodeURIComponent(window.location.origin);
  window.location.href = WORKER_BASE_URL + '/whoop/auth/start?return_to=' + returnTo;
}

async function syncWhoop({ silent = false } = {}) {
  if (!silent) toast('Syncing Whoop…');
  try {
    const r = await fetch(WORKER_BASE_URL + '/whoop/sync', { method: 'GET', credentials: 'include' });
    if (r.status === 401) {
      // Token gone — mark disconnected
      state.whoop = state.whoop || {};
      state.whoop.connected = false;
      saveState();
      if (!silent) toast('Whoop session expired — reconnect in Settings');
      return { ok: false, reason: 'not_connected' };
    }
    if (!r.ok) {
      const err = await r.text();
      if (!silent) toast('Sync failed');
      console.error('whoop sync failed:', r.status, err);
      return { ok: false, reason: 'http_' + r.status };
    }
    const data = await r.json();
    state.whoop = state.whoop || {};
    state.whoop.connected = true;
    state.whoop.profile   = data.profile || state.whoop.profile;
    state.whoop.body      = data.body    || state.whoop.body;
    state.whoop.sleep     = Array.isArray(data.sleep)    ? data.sleep    : [];
    state.whoop.recovery  = Array.isArray(data.recovery) ? data.recovery : [];
    state.whoop.cycles    = Array.isArray(data.cycles)   ? data.cycles   : [];
    state.whoop.workouts  = Array.isArray(data.workouts) ? data.workouts : [];
    state.config.whoop_last_sync = data.synced_at || new Date().toISOString();
    saveState();
    if (!silent) {
      const n = state.whoop.sleep.length + state.whoop.recovery.length;
      toast(`Synced · ${n} records`);
    }
    render();
    return { ok: true, data };
  } catch (e) {
    console.error('whoop sync error:', e);
    if (!silent) toast('Sync failed · check connection');
    return { ok: false, reason: 'network' };
  }
}

async function disconnectWhoop() {
  try {
    await fetch(WORKER_BASE_URL + '/whoop/disconnect', { method: 'POST', credentials: 'include' });
  } catch (e) { console.error('disconnect error:', e); }
  state.whoop = structuredClone(DEFAULT_STATE.whoop);
  state.config.whoop_last_sync = null;
  saveState();
  render();
  toast('Whoop disconnected');
}

// ─────────────────────────────────────────────────────────────────────
// PROVIDER-AGNOSTIC SLEEP & RECOVERY HELPERS  (v3.2.3)
// ─────────────────────────────────────────────────────────────────────
// These are the canonical read functions for all UI surfaces (Pulse,
// Life Month, Weekly Pause). They abstract over the wearable provider
// so Oura/Garmin can be added later by extending these helpers only,
// without touching Pulse rendering, Life calendar, or Pause logic.
//
// Provider priority (now): manual > Whoop
// Provider priority (future): manual > Whoop/Oura/Garmin (first with data wins)
//
// ASSUMPTIONS about Whoop data structure:
//   state.whoop.sleep[] — array of sleep records, each with:
//     .end (ISO timestamp), .nap (bool), .score.stage_summary.*_milli
//   state.whoop.recovery[] — array of recovery records, each with:
//     .created_at OR .score.recovery_date, .score.recovery_score (0–100)
//
// When Oura is added: read from state.oura.sleep[] / state.oura.readiness[]
// When Garmin is added: read from state.garmin.sleep[] / state.garmin.bodyBattery[]

// sleepHoursForDate(isoDate) — canonical sleep hours for a given date.
// Returns decimal hours (e.g. 6.5) or null if no data.
function sleepHoursForDate(isoDate) {
  // 1. Manual log — highest priority
  const manual = (state.sleep || []).find(s => s.date === isoDate);
  if (manual && typeof manual.duration_h === 'number') return manual.duration_h;
  // 2. Whoop dated record
  const wh = whoopSleepHoursFor(isoDate);
  if (wh != null) return wh;
  // 3. Oura placeholder (when state.oura is available)
  // const oh = ouraSleepHoursFor(isoDate); if (oh != null) return oh;
  // 4. Garmin placeholder
  // const gh = garminSleepHoursFor(isoDate); if (gh != null) return gh;
  return null;
}

// recoveryScoreForDate(isoDate) — canonical recovery score (0–100) for a date.
function recoveryScoreForDate(isoDate) {
  // 1. Whoop recovery
  const ws = whoopRecoveryFor(isoDate);
  if (ws != null) return ws;
  // 2. Oura readiness placeholder
  // const os = ouraReadinessFor(isoDate); if (os != null) return os;
  return null;
}

// sleepTrendForDays(n) — last n days oldest→newest, each {iso, h}
function sleepTrendForDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    out.push({ iso, h: sleepHoursForDate(iso) });
  }
  return out;
}

// recoveryTrendForDays(n) — last n days oldest→newest, each {iso, score}
function recoveryTrendForDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    out.push({ iso, score: recoveryScoreForDate(iso) });
  }
  return out;
}

// ─── Whoop helpers — raw accessors (do not call directly from UI) ─────

// Sleep duration for a given local-day ISO string (YYYY-MM-DD).
// Whoop sleep records have an "end" timestamp (UTC). We treat each record's
// end-date as the day the sleep "belongs to" (waking morning).
function whoopSleepHoursFor(dateISO) {
  const records = (state.whoop && state.whoop.sleep) || [];
  // Find the main-sleep record (not nap) whose end falls on dateISO
  for (const r of records) {
    if (r.nap) continue;
    if (!r.end) continue;
    const endLocal = new Date(r.end);
    const y = endLocal.getFullYear();
    const m = String(endLocal.getMonth() + 1).padStart(2, '0');
    const d = String(endLocal.getDate()).padStart(2, '0');
    if (`${y}-${m}-${d}` !== dateISO) continue;
    const stage = r.score && r.score.stage_summary;
    if (!stage) continue;
    // total in-bed minus awake = actual sleep
    const inBedMs = stage.total_in_bed_time_milli || 0;
    const awakeMs = stage.total_awake_time_milli || 0;
    const sleepMs = Math.max(0, inBedMs - awakeMs);
    return Math.round((sleepMs / 3600000) * 10) / 10;  // round to 1 decimal
  }
  return null;
}

// Latest recovery score (0–100) — best-effort, returns null if none today.
function whoopRecoveryFor(dateISO) {
  const records = (state.whoop && state.whoop.recovery) || [];
  for (const r of records) {
    const cycle = r.cycle_id;
    // recovery is keyed by cycle, so we infer date from created_at fallback
    const ref = r.created_at || (r.score && r.score.recovery_date);
    if (!ref) continue;
    const d = new Date(ref);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (`${y}-${m}-${dd}` !== dateISO) continue;
    if (r.score && typeof r.score.recovery_score === 'number') return r.score.recovery_score;
  }
  return null;
}

// True if this date has a Whoop sleep record we can show
function whoopHasSleepFor(dateISO) {
  return whoopSleepHoursFor(dateISO) != null;
}

// v3.0.7: Full Whoop sleep record for the given date (for stage breakdown,
// performance %). Returns the raw record or null.
function whoopSleepRecordFor(dateISO) {
  const records = (state.whoop && state.whoop.sleep) || [];
  for (const r of records) {
    if (r.nap) continue;
    if (!r.end) continue;
    const endLocal = new Date(r.end);
    const y = endLocal.getFullYear();
    const m = String(endLocal.getMonth() + 1).padStart(2, '0');
    const d = String(endLocal.getDate()).padStart(2, '0');
    if (`${y}-${m}-${d}` !== dateISO) continue;
    if (!(r.score && r.score.stage_summary)) continue;
    return r;
  }
  return null;
}

// v3.0.7: Full Whoop recovery record for the given date (for HRV, RHR).
function whoopRecoveryRecordFor(dateISO) {
  const records = (state.whoop && state.whoop.recovery) || [];
  for (const r of records) {
    const ref = r.created_at || (r.score && r.score.recovery_date);
    if (!ref) continue;
    const d = new Date(ref);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (`${y}-${m}-${dd}` !== dateISO) continue;
    if (!r.score) continue;
    return r;
  }
  return null;
}

// v3.0.7: Map a recovery score (0-100) to a state title and body line.
// Used by the Pulse sheet (Direction A — "Quiet richness").
function recoveryStateFor(score) {
  if (score == null) return null;
  if (score >= 90) return { title: 'Rested.',  body: 'a body that\u2019s ready' };
  if (score >= 67) return { title: 'Steady.',  body: 'a body that\u2019s ready, lightly' };
  if (score >= 50) return { title: 'Tender.',  body: 'a body that needs care' };
  if (score >= 34) return { title: 'Soft.',    body: 'a body that needs rest' };
  return                    { title: 'Raw.',     body: 'a body that needs the night' };
}

// v3.0.7: Sleep performance descriptor — italic word at end of "Sleep
// performance · 88% · enough." line.
function sleepPerformanceWord(pct) {
  if (pct == null) return '';
  if (pct >= 95) return 'deep';
  if (pct >= 85) return 'enough';
  if (pct >= 70) return 'most of it';
  if (pct >= 50) return 'thin';
  return 'short';
}

// v3.0.7: Format the last-Whoop-sync time as "4m ago", "2h ago", etc.
function whoopLastSyncRelative() {
  const ts = state.config && state.config.whoop_last_sync;
  if (!ts) return null;
  const d = new Date(ts);
  if (isNaN(d.getTime())) return null;
  const diffMs = Date.now() - d.getTime();
  if (diffMs < 0) return 'just now';
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days === 1) return 'yesterday';
  return `${days}d ago`;
}

// v3.0.1 (Bug B): Most recent Whoop sleep record across all dates.
// Returns { hours, dateISO } or null. Used when Whoop hasn't synced last night yet
// and we want to show the most recent night we DO have data for.
function whoopMostRecentSleep() {
  const records = (state.whoop && state.whoop.sleep) || [];
  let best = null;  // { endTs, dateISO, hours }
  for (const r of records) {
    if (r.nap) continue;
    if (!r.end) continue;
    const stage = r.score && r.score.stage_summary;
    if (!stage) continue;
    const inBedMs = stage.total_in_bed_time_milli || 0;
    const awakeMs = stage.total_awake_time_milli || 0;
    const sleepMs = Math.max(0, inBedMs - awakeMs);
    if (sleepMs <= 0) continue;
    const endTs = new Date(r.end).getTime();
    if (best && endTs <= best.endTs) continue;
    const endLocal = new Date(r.end);
    const y = endLocal.getFullYear();
    const m = String(endLocal.getMonth() + 1).padStart(2, '0');
    const d = String(endLocal.getDate()).padStart(2, '0');
    best = {
      endTs,
      dateISO: `${y}-${m}-${d}`,
      hours: Math.round((sleepMs / 3600000) * 10) / 10,
    };
  }
  return best;
}

function whoopShouldAutoSync() {
  if (!state.whoop || !state.whoop.connected) return false;
  const last = state.config.whoop_last_sync;
  if (!last) return true;
  const ageMs = Date.now() - new Date(last).getTime();
  return ageMs > 24 * 60 * 60 * 1000;  // 24h
}

// Detect ?whoop=connected in URL — fired on app load
function handleWhoopReturn() {
  try {
    const u = new URL(window.location.href);
    if (u.searchParams.get('whoop') === 'connected') {
      // Mark connected (sync will populate the rest)
      state.whoop = state.whoop || {};
      state.whoop.connected = true;
      saveState();
      // Clean URL so a refresh doesn't re-trigger
      u.searchParams.delete('whoop');
      window.history.replaceState({}, '', u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : ''));
      // First sync
      syncWhoop({ silent: false });
    } else if (whoopShouldAutoSync()) {
      // Background daily sync
      syncWhoop({ silent: true });
    }
  } catch (e) { console.error('handleWhoopReturn:', e); }
}

function todayAdjective() {
  const td = todayISO();
  const yestISO = (() => { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
  // v3.0.1 (Bug C): see Whoop sleep too. We're checking last night's sleep
  // (i.e. sleep that "belongs to" today) — manual entries are keyed on the
  // morning's date (today), so check today's manual entry first; if not there,
  // fall back to Whoop for today's date.
  const manualToday = state.sleep.find(s => s.date === td);
  const manualYest = state.sleep.find(s => s.date === yestISO);
  const sleepHoursLastNight =
    (manualToday && typeof manualToday.duration_h === 'number') ? manualToday.duration_h
    : whoopSleepHoursFor(td) != null ? whoopSleepHoursFor(td)
    : (manualYest && typeof manualYest.duration_h === 'number') ? manualYest.duration_h
    : null;
  const yestMood = [...state.moods].reverse().find(m => isSameDay(m.ts, yestISO));
  if ((sleepHoursLastNight != null && sleepHoursLastNight < 6) || (yestMood && yestMood.score <= 2)) return 'softly';
  const plannedToday = state.weekPlans.find(p => p.date === td);
  const hasIntention = state.intentions.some(i => i.for_date === td && i.text && i.text.trim());
  if (plannedToday && hasIntention) return 'clearly';
  return 'quietly';
}

// Parse a free-text birthday like "Oct 4", "October 4", "4 Oct", "10/04", "Jan 4 · turns 41"
// Returns a { month: 0-11, day: 1-31 } or null if unparseable.
function parseBirthday(s) {
  if (!s) return null;
  const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  const lower = s.toLowerCase();
  // Try "Mon D" or "D Mon"
  for (const [abbr, idx] of Object.entries(months)) {
    const rx1 = new RegExp(`${abbr}[a-z]*\\s+(\\d{1,2})`);
    const rx2 = new RegExp(`(\\d{1,2})\\s+${abbr}[a-z]*`);
    let m = lower.match(rx1) || lower.match(rx2);
    if (m) {
      const day = parseInt(m[1], 10);
      if (day >= 1 && day <= 31) return { month: idx, day };
    }
  }
  // Try M/D or MM/DD
  const slash = lower.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);
  if (slash) {
    const m = parseInt(slash[1], 10), d = parseInt(slash[2], 10);
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) return { month: m - 1, day: d };
  }
  return null;
}

// Find birthdays within ±7 days. Returns { person, date, daysUntil } for the closest one, or null.
function upcomingBirthday() {
  if (!state.people || !state.people.length) return null;
  const now = new Date();
  const year = now.getFullYear();
  let best = null;
  for (const p of state.people) {
    const bday = p.remember && p.remember.birthday;
    if (!bday) continue;
    const parsed = parseBirthday(bday);
    if (!parsed) continue;
    // Build this year's birthday date
    const dThisYear = new Date(year, parsed.month, parsed.day);
    const dNextYear = new Date(year + 1, parsed.month, parsed.day);
    const todayMid = new Date(year, now.getMonth(), now.getDate());
    // Pick whichever is closer and still within ±7 days
    for (const candidate of [dThisYear, dNextYear]) {
      const diffDays = Math.round((candidate - todayMid) / 86400000);
      if (diffDays >= -3 && diffDays <= 7) {
        if (!best || Math.abs(diffDays) < Math.abs(best.daysUntil)) {
          best = { person: p, date: candidate, daysUntil: diffDays };
        }
      }
    }
  }
  return best;
}

function dueMostPerson() {
  if (!state.people || !state.people.length) return null;
  let worst = null;
  for (const p of state.people) {
    if (!p.cadence || !CADENCE_DAYS[p.cadence]) continue;
    const lastTs = p.last_touch_ts ? new Date(p.last_touch_ts).getTime() : 0;
    const daysSince = lastTs ? Math.floor((Date.now() - lastTs) / 86400000) : 999;
    const overdue = daysSince - CADENCE_DAYS[p.cadence];
    if (overdue > 0) {
      if (!worst || overdue > worst.overdue) worst = { person: p, daysSince, overdue };
    }
  }
  return worst;
}

function peopleAvatars() {
  if (!state.people || !state.people.length) return [];
  const inner = state.people.filter(p => p.tier === 'inner' || p.tier === 'close');
  const pool = inner.length ? inner : state.people;
  return [...pool]
    .sort((a,b) => {
      const ta = a.last_touch_ts ? new Date(a.last_touch_ts).getTime() : 0;
      const tb = b.last_touch_ts ? new Date(b.last_touch_ts).getTime() : 0;
      return tb - ta;
    })
    .slice(0, 3);
}

function daysAgoShort(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return '1d ago';
  if (d < 30) return `${d}d ago`;
  const w = Math.floor(d / 7);
  if (w < 5) return `${w}w ago`;
  return `${Math.floor(d / 30)}mo ago`;
}

function isAfterSunset() {
  const [h, m] = (state.config.sunset_time || '19:30').split(':').map(Number);
  const now = new Date();
  const cutoff = new Date(now);
  cutoff.setHours(h || 19, m || 30, 0, 0);
  return now >= cutoff;
}

function isMorningWindow() {
  // Morning ritual shows between 5am (inclusive) and 12pm (exclusive) local time.
  // Outside this window, morning card hides even if intention is not set.
  const h = new Date().getHours();
  return h >= 5 && h < 12;
}

// v2.11: Four distinct ring renderers — each ring fills differently.
// At rest, all four look identical: empty 32px-radius circle, muted ink stroke.
// In active states, each fills with its own grammar (vessel / dot / sweep / ring-by-ring).
function ringSVG_train(filled) {
  // Train fills bottom-up like a vessel
  const fillHeight = filled ? 32 : 0;  // bottom-half height when filled
  return `<svg width="46" height="46" viewBox="0 0 48 48">
    <defs><clipPath id="clip-train"><circle cx="24" cy="24" r="19"/></clipPath></defs>
    <circle cx="24" cy="24" r="19" fill="none" stroke="${filled ? 'var(--accent-bright)' : 'var(--ring-track)'}" stroke-width="2.4"/>
    ${filled ? `<rect x="0" y="${48 - fillHeight}" width="48" height="${fillHeight}" fill="rgba(62,122,94,0.32)" clip-path="url(#clip-train)"/>` : ''}
  </svg>`;
}
function ringSVG_pulse(signals) {
  // v3.0.3: dot-inside aesthetic with habits-method behavior.
  // Dot grows as signals come in (1=small, 2=medium, 3=full).
  // Outline only turns sage at 3/3 — fully green ONLY when all three
  // signals (sleep, weight, mood) are tended. At 1 or 2 signals, the
  // outline stays dim — the dot tells you progress without claiming
  // the ring is "complete."
  if (signals === 0) {
    return `<svg width="46" height="46" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="var(--ring-track)" stroke-width="2.4"/>
    </svg>`;
  }
  const dotRadius = signals === 1 ? 2.5 : signals === 2 ? 4 : 5.5;
  const ringStroke = signals >= 3 ? 'var(--accent-bright)' : 'var(--ring-track)';
  return `<svg width="46" height="46" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="19" fill="none" stroke="${ringStroke}" stroke-width="2.4"/>
    <circle cx="24" cy="24" r="${dotRadius}" fill="var(--accent-bright)"/>
  </svg>`;
}
function ringSVG_mind(filled, pending) {
  // Mind: empty until examen complete, then a swept brass arc.
  // pending = brass border without sweep (after sunset, examen not yet done).
  if (filled) {
    // Full brass ring
    return `<svg width="46" height="46" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="var(--brass)" stroke-width="2.4"/>
    </svg>`;
  }
  if (pending) {
    return `<svg width="46" height="46" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="var(--brass)" stroke-width="2.4"/>
    </svg>`;
  }
  return `<svg width="46" height="46" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="19" fill="none" stroke="var(--ring-track)" stroke-width="2.4"/>
  </svg>`;
}
function ringSVG_habits(done, total) {
  // Three concentric rings filling outer → middle → inner as habits complete.
  // Ring fills at threshold points (1/3 of total, 2/3, 3/3).
  if (total === 0) {
    // No habits set up — looks like the at-rest state
    return `<svg width="46" height="46" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="var(--ring-track)" stroke-width="1.6"/>
      <circle cx="24" cy="24" r="13" fill="none" stroke="var(--ring-track)" stroke-width="1.6"/>
      <circle cx="24" cy="24" r="7"  fill="none" stroke="var(--ring-track)" stroke-width="1.6"/>
    </svg>`;
  }
  // Threshold logic: outer fills at >= 1, middle at >= ceil(total/3)+1, inner at total
  const outerOn = done >= 1;
  const middleOn = done >= Math.max(2, Math.ceil(total / 3) + 1);
  const innerOn  = done >= total;
  const ringStroke = (on) => on ? 'var(--accent-bright)' : 'var(--ring-track)';
  return `<svg width="46" height="46" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="19" fill="none" stroke="${ringStroke(outerOn)}" stroke-width="1.6"/>
    <circle cx="24" cy="24" r="13" fill="none" stroke="${ringStroke(middleOn)}" stroke-width="1.6"/>
    <circle cx="24" cy="24" r="7"  fill="none" stroke="${ringStroke(innerOn)}" stroke-width="1.6"/>
  </svg>`;
}

// v3.2.0 — tone word color helpers (consistent across Today, Looking Back, Pulse)
function toneWordColor(tone) {
  if (!tone) return 'var(--ink-muted)';
  const grounded = ['settled','grounded','open','grateful','light','peaceful','clear'];
  const heavy    = ['tired','scattered','anxious','heavy','tense','overwhelmed'];
  if (grounded.some(w => tone.includes(w))) return 'var(--accent-bright)';
  if (heavy.some(w => tone.includes(w)))    return 'var(--clay)';
  return 'var(--brass)';
}
function toneWordBg(tone) {
  const c = toneWordColor(tone);
  if (c === 'var(--accent-bright)') return 'rgba(78,141,111,0.10)';
  if (c === 'var(--clay)')          return 'rgba(196,122,99,0.10)';
  return 'rgba(200,155,106,0.10)';
}
function toneWordBorder(tone) {
  const c = toneWordColor(tone);
  if (c === 'var(--accent-bright)') return 'rgba(78,141,111,0.25)';
  if (c === 'var(--clay)')          return 'rgba(196,122,99,0.25)';

}

  const monthName = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()];
  const dateLine = `${dayName} · ${now.getDate()} ${monthName}`;

  // Ambient line
  let ambientParts = [];
  // Today's intention (highest priority — the day's focus)
  const todayIntForAmbient = todayIntention();
  if (todayIntForAmbient) {
    ambientParts.push(`Today: ${escapeHtml(todayIntForAmbient.text)}`);
  }
  // Weekly intent (shows what you said this week's work was)
  const wkIso = weekISO(new Date());
  const openIntents = state.weekly_intents.filter(i => i.week_iso === wkIso && !i.completed);
  if (openIntents.length && !todayIntForAmbient) {

  if (runway != null) ambientParts.push(`Runway: ${runway.toFixed(1)} months`);
  // Birthday within ±7 days — add before recentMention so it gets priority over "wrote about X"

    else if (bday.daysUntil === 1) when = 'tomorrow';
    else if (bday.daysUntil === -1) when = 'was yesterday';
    else if (bday.daysUntil < 0) when = `was ${Math.abs(bday.daysUntil)} days ago`;
    else {
      const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][bday.date.getDay()];

    ? ambientParts.join(' <span class="sep">·</span> ')
    : `<span class="empty">The day is yours.</span>`;

  // Morning intention card — shows 5am–noon if no intention set for today.
  // After intention is set, becomes a small brass-confirmed chip.
  let morningCard = '';
  const todayInt = todayIntention();
  const carryText = carryForwardCandidate();
  const skippedThisMorning = state._morning_skip_date === todayISO();
  if (todayInt) {
    // Intention already set — confirmation chip (visible all day, tap to edit)
    const setTime = todayInt.created_at
      ? new Date(todayInt.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : '';
    const editedTime = todayInt.edited_at
      ? new Date(todayInt.edited_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : '';
    morningCard = `
      <button class="card" onclick="openIntentionEditor()" style="background:rgba(200,155,106,0.04);border-color:rgba(200,155,106,0.22);">
        <div class="card-head">
          <span class="card-kicker" style="color:var(--brass);">Intention set${setTime ? ' · ' + setTime : ''}${editedTime ? ` · edited ${editedTime}` : ''}</span>
          <span class="card-kicker-r">tap to edit</span>
        </div>
        <div class="card-title" style="font-size:17px;">${escapeHtml(todayInt.text)}</div>
      </button>`;
  } else if (isMorningWindow() && !skippedThisMorning) {
    // Before noon, no intention yet — show the prompt
    const carryBlock = carryText ? `
      <div style="margin:10px 0 4px;padding:10px 12px;background:var(--surface-2);border:0.5px solid var(--line);border-radius:10px;">
        <div style="font-size:9.5px;letter-spacing:0.14em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:4px;">Last night you said</div>
        <div style="font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ink);line-height:1.5;">&ldquo;${escapeHtml(carryText)}&rdquo;</div>
        <div style="margin-top:10px;display:flex;gap:6px;">
          <button class="btn-primary" style="flex:1;padding:8px;font-size:11px;" onclick="acceptCarryForward()">Keep this</button>
          <button class="btn-secondary" style="flex:1;padding:8px;font-size:11px;" onclick="openIntentionEditor()">Change</button>
        </div>
      </div>
    ` : '';
    morningCard = `
      <div class="card">
        <div class="card-head">
          <span class="card-kicker">Before the day begins</span>
          <span class="card-kicker-r">~1 min</span>
        </div>
        <div class="card-title">What do you want from today?</div>
        <div class="card-sub" style="font-family:'Fraunces',serif;font-style:italic;">One sentence. Kept, not just intended.</div>
        ${carryBlock}
        ${!carryText ? `
          <div class="card-row">
            <button class="btn-primary" onclick="openIntentionEditor()">Set intention</button>
            <button class="btn-secondary" onclick="skipMorning()">Not today</button>
          </div>
        ` : `
          <div style="text-align:center;margin-top:10px;">
            <button class="btn-skip" onclick="skipMorning()" style="font-size:11px;">Not today</button>
          </div>
        `}
      </div>`;
  }

  // Examen card — only at / after sunset (or if already done today)
  let examenCard = '';
  if (examen) {
    examenCard = `
      <button class="card" onclick="openExamenSummary()">
        <div class="card-head">
          <span class="card-kicker">Evening examen</span>
          <span class="card-kicker-r">sealed</span>
        </div>
        <div class="card-title">${examen.skipped_entirely ? 'Rested tonight' : 'The day is sealed'}</div>
        <div class="card-sub">Tap to review</div>
      </button>`;
  } else if (isAfterSunset()) {
    examenCard = `
      <div class="card">
        <div class="card-head">
          <span class="card-kicker">Before sleep</span>
          <span class="card-kicker-r">~3 min</span>
        </div>
        <div class="card-title">The evening examen</div>
        <div class="card-sub">What did I do well · poorly · leave undone</div>
        <div class="card-row">
          <button class="btn-primary" onclick="openExamen()">Begin</button>
          <button class="btn-secondary" onclick="examenSkipTonight()">Not tonight</button>
        </div>
      </div>`;
  }
  // Between noon and sunset: no ritual card at all. The day is for doing.

  // v3.2.3: Ledger removed from UI

  // People card
  let peopleCard;
  if (avatars.length && dueMost) {
    const avatarHTML = avatars.map((p, i) =>
      `<div class="avatar a${(i % 3) + 1}">${escapeHtml((p.name || '?')[0].toUpperCase())}</div>`
    ).join('');
    const innerCount = state.people.filter(p => p.tier === 'inner').length;
    peopleCard = `
      <button class="card" onclick="switchTab('people')">
        <div class="card-head">
          <span class="card-kicker">People</span>
          ${innerCount ? `<span class="card-kicker-r">Inner ${innerCount}</span>` : ''}
        </div>
        <div class="people-row">
          <div class="avatars">${avatarHTML}</div>
          <div class="people-body">It&rsquo;s been a while with <span style="font-style:italic;">${escapeHtml(dueMost.person.name)}</span>.</div>
        </div>
      </button>`;
  } else if (state.people.length) {
    const avatarHTML = avatars.map((p, i) =>
      `<div class="avatar a${(i % 3) + 1}">${escapeHtml((p.name || '?')[0].toUpperCase())}</div>`
    ).join('');
    peopleCard = `
      <button class="card" onclick="switchTab('people')">
        <div class="card-head">
          <span class="card-kicker">People</span>
          <span class="card-kicker-r">${state.people.length} total</span>
        </div>
        <div class="people-row">
          <div class="avatars">${avatarHTML}</div>
          <div class="people-body">Everyone's on time.</div>
        </div>
      </button>`;
  } else {
    peopleCard = `
      <button class="card" onclick="openTouchModal()">
        <div class="card-head">
          <span class="card-kicker">People</span>
        </div>
        <div class="people-empty">No one logged yet. Tap to log a touch with someone.</div>
      </button>`;
  }

  // In progress card
  let progressCard = '';
  if (inProg) {
    progressCard = `
      <button class="progress-card" onclick="switchTab('me')">
        <div class="progress-left">
          <div class="card-kicker">In progress</div>
          <div class="progress-title">${escapeHtml(inProg.text || '')}</div>
        </div>
        <div class="progress-right">
          <div class="progress-arrow">↓</div>
          <div class="progress-ago">${daysAgoShort(inProg.ts)}</div>
        </div>
      </button>`;
  }

  // Phase 4 — Pause banner (Saturday-evening / Sunday window)
  let pauseBanner = '';
  if (pauseWindowOpen() && !thisWeekPause()) {
    const isSat = isSaturday();
    pauseBanner = `
      <button class="pause-banner" onclick="openPause()">
        <div class="kicker">${isSat ? 'Saturday · the week ends' : 'Sunday · before the new week'}</div>
        <div class="title">The Pause</div>
        <div class="sub">Look back. Look forward. About 4 minutes.</div>
        <div class="arrow">›</div>
      </button>`;
  }

  // Hard-pause workout — resume banner if there's a paused session from today
  let resumeBanner = '';
  const paused = pausedWorkoutFromToday();
  if (paused) {
    const minAgo = Math.max(1, Math.floor((Date.now() - new Date(paused.ts).getTime()) / 60000));
    const ago = formatDurationMin(minAgo);
    const doneSets = paused.exercises.reduce((a, e) => a + e.sets.filter(s => s.rating).length, 0);
    const totalSets = paused.exercises.filter(e => !e.prep).reduce((a, e) => a + e.sets.length, 0);
    resumeBanner = `
      <button class="resume-banner" onclick="resumePausedWorkout()">
        <div class="kicker">In progress</div>
        <div class="title">${escapeHtml(paused.session_name)}</div>
        <div class="sub">${doneSets} of ${totalSets} sets · started ${ago} ago</div>
        <div class="arrow">›</div>
      </button>`;
  }

  // v2.12.2 — monthly recap banner. Shows in the first 3 days of a new month
  // if the previous month had enough data to merit reading.
  let recapBanner = '';
  const recapInfo = previousMonthRecapInfo();
  if (recapInfo && state._monthly_recap_dismissed_for !== recapInfo.key) {
    recapBanner = `
      <div style="display:flex;gap:0;margin-bottom:14px;">
        <button onclick="openMonthlyRecapFromBanner()" style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(200,155,106,0.05);border:0.5px solid var(--brass-dim);border-radius:12px 0 0 12px;color:inherit;font-family:inherit;cursor:pointer;text-align:left;">
          <div>
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--brass);font-weight:500;margin-bottom:4px;">${escapeHtml(recapInfo.monthName.toUpperCase())} CLOSED</div>
            <div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink);line-height:1.4;">Read the month.</div>
          </div>
          <div style="font-size:18px;color:var(--brass);font-family:'Inter',sans-serif;flex-shrink:0;margin-left:14px;">›</div>
        </button>
        <button onclick="dismissMonthlyRecap('${recapInfo.key}')" aria-label="Dismiss" style="display:flex;align-items:center;justify-content:center;width:38px;background:rgba(200,155,106,0.05);border:0.5px solid var(--brass-dim);border-left:none;border-radius:0 12px 12px 0;color:var(--ink-faint);cursor:pointer;font-family:inherit;font-size:14px;">×</button>
      </div>
    `;
  }

  // v3.1.1 — Fix 1: pull first sentence of last examen's "went well" as headline
  const lastExamen = [...(state.examens || [])]
    .filter(e => e.completed_at && !e.skipped_entirely)
    .sort((a, b) => new Date(b.completed_at).getTime() - new Date(a.completed_at).getTime())[0];
  const examenHeadline = (() => {
    if (!lastExamen) return null;
    const text = (lastExamen.went_well || '').trim();
    if (!text || text.length < 8) return null;
    // Take first sentence or first 80 chars, whichever is shorter
    const firstSentence = text.split(/[.!?]/)[0].trim();
    return firstSentence.length > 80 ? firstSentence.slice(0, 77) + '…' : firstSentence;
  })();

  // v3.1.1 — Fix 2: last 3 examens for "Looking back" section
  const lookingBackExamens = [...(state.examens || [])]
    .filter(e => e.completed_at)
    .sort((a, b) => new Date(b.completed_at).getTime() - new Date(a.completed_at).getTime())
    .slice(0, 3);

  const lookingBackHTML = (() => {
    if (!lookingBackExamens.length) return '';
    const rows = lookingBackExamens.map(e => {
      const d = new Date(e.completed_at);
      const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const dateStr = `${dayNames[d.getDay()]} · ${d.getDate()} ${monthNames[d.getMonth()]}`;
      const snip = ((e.went_well || e.went_poorly || e.left_undone || '').trim().split(/[.!?]/)[0] || '').slice(0, 72);
      const id = escapeHtml(e.id || e.date || '');
      return `
        <button onclick="openPastExamen('${id}')" style="display:block;width:100%;background:none;border:none;padding:10px 0;border-bottom:0.5px solid rgba(237,230,216,0.06);text-align:left;cursor:pointer;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
            <div style="font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.1em;color:var(--ink-faint);font-weight:500;">${dateStr}</div>
            ${e.tone ? `<span style="font-family:'Fraunces',serif;font-style:italic;font-size:10px;color:${toneWordColor(e.tone)};">${escapeHtml(e.tone)}</span>` : ''}
          </div>
          ${snip ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--ink-muted);line-height:1.5;">${escapeHtml(snip)}${(e.went_well||'').trim().length > 72 ? '…' : ''}</div>` : `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--ink-faint);">Sealed.</div>`}
        </button>`;
    }).join('');
    return `
      <div style="height:0.5px;background:var(--line);margin:24px 0 16px;"></div>
      <div style="font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:10px;">LOOKING BACK</div>
      ${rows}
    `;
  })();

  const html = `
    <div class="today-header">
      <div class="today-header-l">
        <div class="today-date">${dateLine}</div>
        ${examenHeadline
          ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:22px;font-weight:300;color:var(--ink);letter-spacing:-0.2px;line-height:1.25;margin-top:6px;">"${escapeHtml(examenHeadline)}"</div>
             <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
               <div style="font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-faint);">Last night</div>
               ${lastExamen && lastExamen.tone ? `<span style="font-family:'Fraunces',serif;font-style:italic;font-size:10px;color:${toneWordColor(lastExamen.tone)};background:${toneWordBg(lastExamen.tone)};border:0.5px solid ${toneWordBorder(lastExamen.tone)};border-radius:999px;padding:2px 9px;">${escapeHtml(lastExamen.tone)}</span>` : ''}
             </div>`
          : `<div class="today-title">Today<span class="adj">, ${adj}.</span></div>`
        }
      </div>
      <div class="today-header-r">
        <button onclick="openSettingsOverlay()" aria-label="Profile" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;">
          ${profileAvatarHTML(30)}
        </button>
        <button class="icon-btn" onclick="toggleTheme()" aria-label="Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="rings-wrap">
      <div class="rings-label">The Four, Today</div>
      <div class="rings-row">
        <button class="ring-col" onclick="openTrainPicker()">
          ${ringSVG_train(ringValue('train') >= 1)}
          <div class="ring-label">Train</div>
        </button>
        <button class="ring-col" onclick="openPulseSheet()">
          ${ringSVG_pulse(ringValue('pulse'))}
          <div class="ring-label">Pulse</div>
        </button>
        <button class="ring-col" onclick="onMindRingTap()">
          ${ringSVG_mind(ringValue('mind') >= 1, isAfterSunset() && ringValue('mind') < 1)}
          <div class="ring-label">Mind</div>
        </button>
        <button class="ring-col" onclick="openHabitsTodaySheet()">
          ${(() => { const h = ringValue('habits'); return ringSVG_habits(h.done, h.total); })()}
          <div class="ring-label">Habits</div>
        </button>
      </div>
      <div class="ambient-line">${ambient}</div>
    </div>

    <div class="quote-card">
      <div class="quote-body">${escapeHtml(quote.text)}</div>
      <div class="quote-attr" ${quote.personal ? 'style="color:var(--brass);font-style:italic;"' : ''}>${escapeHtml(quote.attr)}</div>
    </div>

    ${recapBanner}
    ${resumeBanner}
    ${pauseBanner}
    ${morningCard}
    ${examenCard}
    ${peopleCard}
    ${progressCard}
    ${lookingBackHTML}
  `;
  document.getElementById('screen-today').innerHTML = html;
}

// v3.1.1 — open a past examen from the Looking Back section
function openPastExamen(idOrDate) {
  const e = (state.examens || []).find(x => x.id === idOrDate || x.date === idOrDate);
  if (!e) return;
  const d = new Date(e.completed_at || e.date + 'T00:00:00');
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dateStr = `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]}`;
  const section = (label, text) => text && text.trim() ? `
    <div style="margin-bottom:18px;">
      <div style="font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:8px;">${label}</div>
      <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink);line-height:1.65;">${escapeHtml(text.trim())}</div>
    </div>` : '';
  const html = `
    <div style="padding:44px 22px 40px;min-height:100vh;">
      <button onclick="renderToday();document.getElementById('screen-today').scrollTop=9999;" style="background:none;border:none;color:var(--accent-bright);font-family:'Fraunces',serif;font-size:13px;cursor:pointer;margin-bottom:22px;display:block;">‹ Today</button>
      <div style="font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:6px;">EXAMEN</div>
      <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:300;color:var(--ink);letter-spacing:-0.2px;line-height:1.2;margin-bottom:24px;">${escapeHtml(dateStr)}</div>
      <div style="height:0.5px;background:var(--line);margin-bottom:22px;"></div>
      ${e.skipped_entirely
        ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-faint);">Rested tonight.</div>`
        : `${section('WENT WELL', e.went_well)}
           ${section('WENT POORLY', e.went_poorly)}
           ${section('LEFT UNDONE', e.left_undone)}`
      }
    </div>`;
  document.getElementById('screen-today').innerHTML = html;
}

function ledgerDue() {
  if (!state.ledger || !state.ledger.length) return true;
  const latest = [...state.ledger].sort((a,b) => (b.date || '').localeCompare(a.date || ''))[0];
  if (!latest) return true;
  return Math.floor((Date.now() - new Date(latest.date).getTime()) / 86400000) >= 7;
}

// v2.10.1: dots-and-rings icon system. Today = single point, People = constellation,
// Life = three concentric rings (tree-rings of accumulated chapters), Me = single ring.
const NAV_ICONS = {
  today: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3.5"/></svg>`,
  people: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="9" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="17" r="2"/></svg>`,
  life: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="3"/></svg>`,
  me: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9"><circle cx="12" cy="12" r="6.5"/></svg>`,
};
function renderNav() {
  const active = state.nav.active || 'today';
  const tabBtn = (key, label) =>
    `<button class="tab ${active === key ? 'active' : ''}" onclick="switchTab('${key}')">
      <div class="tab-ic">${NAV_ICONS[key]}</div>
      <div class="tab-l">${label}</div>
    </button>`;
  document.getElementById('nav').innerHTML = `
    ${tabBtn('today','Today')}
    ${tabBtn('people','People')}
    <button class="orb" onclick="openOrbSheet()" aria-label="Capture"><span class="orb-plus"></span></button>
    ${tabBtn('life','Life')}
    ${tabBtn('me','Me')}
  `;
}
function switchTab(tab) {
  state.nav.active = tab;
  saveState();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + tab);
  if (target) target.classList.add('active');
  render();
}

function openOrbSheet() {
  capturePinChapterId = null;
  captureDraftPhoto = null;
  captureDraftTags = [];        // v3.2.2: reset tags on every open
  captureDraftPeopleIds = [];   // v3.2.8: reset people on every open
  const sheet = document.getElementById('sheet-orb');
  sheet.innerHTML = renderOrbSheet();
  sheet.classList.add('active');
}
function closeOrbSheet() {
  document.getElementById('sheet-orb').classList.remove('active');
}
function renderOrbSheet() {
  const hour = new Date().getHours();
  const isMorning = hour < 17;
  const td = todayISO();
  const planned = state.weekPlans.find(p => p.date === td);
  const plannedSession = planned && state.program && state.program.sessions[planned.session_id];
  const now = new Date();
  const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];

  const plannedBanner = plannedSession ? `
    <button class="planned-banner" onclick="closeOrbSheet();startLiftSession('${plannedSession.id}')">
      <div class="planned-left">
        <div class="planned-kicker">Today's planned</div>
        <div class="planned-name">${escapeHtml(plannedSession.name)}</div>
        <div class="planned-meta">${(plannedSession.exercises || []).length} exercises</div>
      </div>
      <div class="planned-go">Begin</div>
    </button>` : '';

  // v2.8.1: Capture textarea is the primary affordance.
  // Quick-tile actions become small icon buttons below.

// v3.2.2: declare draft photo state (was implicit global — now explicit)
let captureDraftPhoto = null;

// v3.2.1: capture draft tags — reset on each new capture
let captureDraftTags = [];

function captureTagsHTML() {
  const pills = captureDraftTags.map((t, i) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(237,230,216,0.06);border:0.5px solid rgba(237,230,216,0.14);border-radius:999px;font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-muted);">
      ${escapeHtml(t)}<button onclick="captureRemoveTag(${i})" style="background:none;border:none;color:var(--ink-faint);font-size:13px;line-height:1;cursor:pointer;padding:0 0 0 2px;">×</button>
    </span>`
  ).join('');
  return `
    <div style="margin-top:14px;">
      <div style="font-family:'Inter',sans-serif;font-size:8.5px;letter-spacing:0.14em;color:var(--ink-faint);font-weight:500;margin-bottom:8px;">TAGS</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;">
        ${pills}
        <button onclick="captureShowTagInput()" style="padding:4px 10px;background:transparent;border:0.5px dashed rgba(237,230,216,0.2);border-radius:999px;font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-faint);cursor:pointer;">+ tag</button>
      </div>
      <input id="capture-tag-input" type="text" placeholder="type a tag, press enter…"
        style="display:none;width:100%;padding:9px 12px;background:rgba(237,230,216,0.04);border:0.5px solid rgba(237,230,216,0.12);border-radius:10px;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ink);box-sizing:border-box;"
        onkeydown="if(event.key==='Enter'){event.preventDefault();captureConfirmTag();}"
        oninput="this.value=this.value.replace(/[^a-zA-Z0-9\\-_ ]/g,'')">
    </div>`;
}
function captureShowTagInput() {
  const inp = document.getElementById('capture-tag-input');
  if (inp) { inp.style.display = 'block'; setTimeout(() => inp.focus(), 60); }
}
function captureConfirmTag() {
  const inp = document.getElementById('capture-tag-input');
  if (!inp) return;
  const tag = normTag(inp.value);
  if (tag && !captureDraftTags.includes(tag)) {
    captureDraftTags.push(tag);
    // Re-render just the tags area without rebuilding whole sheet
    const wrap = inp.closest('div[style*="margin-top:14px"]');
    if (wrap) wrap.outerHTML = captureTagsHTML();
    else { const s = document.querySelector('.sheet-panel'); if (s) renderCaptureSheet(); }
  }
  if (inp) { inp.value = ''; inp.style.display = 'none'; }
}
function captureRemoveTag(idx) {
  captureDraftTags.splice(idx, 1);
  const wrap = document.querySelector('#capture-tag-input')?.closest('div[style*="margin-top:14px"]');
  if (wrap) wrap.outerHTML = captureTagsHTML();
}

function onCaptureTextareaInput() {
  const ta = document.getElementById('capture-textarea');
  const btn = document.getElementById('capture-save-btn');
  if (!ta || !btn) return;
  const hasContent = ta.value.trim().length > 0 || captureDraftPhoto !== null;
  btn.disabled = !hasContent;
}

function onCapturePhotoSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      captureDraftPhoto = {
        data: canvas.toDataURL('image/jpeg', 0.7),
        captured_at: new Date().toISOString(),
      };
      const wrap = document.getElementById('capture-photo-preview-wrap');
      if (wrap) {
        wrap.innerHTML = `
          <div class="capture-photo-preview">
            <img src="${captureDraftPhoto.data}" alt="">
            <button type="button" class="capture-photo-remove" onclick="removeCapturePhoto()" aria-label="Remove">×</button>
          </div>`;
      }
      onCaptureTextareaInput();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeCapturePhoto() {
  captureDraftPhoto = null;
  const wrap = document.getElementById('capture-photo-preview-wrap');
  if (wrap) wrap.innerHTML = '';
  onCaptureTextareaInput();
}

// v2.10: Pin gesture state for capture orb
let capturePinChapterId = null;

// v3.2.8: Multi-person capture helpers
// Read all linked person IDs from a capture, merging legacy person_id + new people_ids[]
function capturePeopleIds(capture) {
  if (!capture) return [];
  const ids = new Set();
  if (capture.person_id) ids.add(capture.person_id);          // legacy single
  if (Array.isArray(capture.people_ids)) capture.people_ids.forEach(id => ids.add(id));
  return [...ids];
}
function captureHasPerson(capture, personId) {
  return capturePeopleIds(capture).includes(personId);
}
function peopleForCapture(capture) {
  return capturePeopleIds(capture)
    .map(id => (state.people || []).find(p => p.id === id))
    .filter(Boolean);
}

// Draft people selected in the capture orb sheet
let captureDraftPeopleIds = [];

function captureTogglePerson(personId) {
  const idx = captureDraftPeopleIds.indexOf(personId);
  if (idx >= 0) captureDraftPeopleIds.splice(idx, 1);
  else captureDraftPeopleIds.push(personId);
  const wrap = document.getElementById('capture-people-wrap');

}

function capturePeoplePickerHTML() {
  const people = (state.people || []).slice().sort((a, b) => {
    const order = { inner: 0, close: 1, tribe: 2, community: 3 };

            ${escapeHtml(p.name)}

}

function capturePinBlockHTML() {
  const activeChapter = (state.chapters || []).find(c => !c.end_date);
  if (!activeChapter) return '';
  const isPinned = capturePinChapterId === activeChapter.id;
  return `
    <button type="button" onclick="toggleCapturePin('${activeChapter.id}')" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;background:transparent;border:0.5px solid ${isPinned ? 'var(--brass)' : 'var(--line)'};border-radius:10px;color:${isPinned ? 'var(--brass)' : 'var(--ink-muted)'};font-family:inherit;font-size:11px;cursor:pointer;margin-top:8px;letter-spacing:0.02em;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>

    </button>

function toggleCapturePin(chapterId) {
  capturePinChapterId = capturePinChapterId === chapterId ? null : chapterId;
  // Re-render just the pin block in place (avoid full sheet re-render which would lose textarea content)
  const sheet = document.querySelector('.sheet-panel');
  if (!sheet) return;
  // Find existing pin button and replace it
  const existing = Array.from(sheet.querySelectorAll('button')).find(b => /Pin to|Pinned to/.test(b.textContent));
  if (existing) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = capturePinBlockHTML().trim();
    if (wrapper.firstElementChild) {
      existing.replaceWith(wrapper.firstElementChild);
    }
  }
}

function saveCapture() {
  const ta = document.getElementById('capture-textarea');
  const text = (ta?.value || '').trim();
  if (!text && !captureDraftPhoto) return;
  state.captures = state.captures || [];
  const capture = {
    id: uid(),
    ts: new Date().toISOString(),
    text,
    photo: captureDraftPhoto || null,
    tags: [...captureDraftTags],       // v3.2.1
    people_ids: [...captureDraftPeopleIds], // v3.2.8
  };
  state.captures.push(capture);

  // v2.10: pin to active chapter if user opted in
  if (capturePinChapterId) {
    const ch = state.chapters.find(c => c.id === capturePinChapterId && !c.end_date);
    if (ch) {
      if (!Array.isArray(ch.pinned_capture_ids)) ch.pinned_capture_ids = [];
      if (!ch.pinned_capture_ids.includes(capture.id)) ch.pinned_capture_ids.push(capture.id);
    }
  }

  // Auto-extract @mentions: same pipeline as examen mentions
  if (text) {
    extractMentionsFromCapture(capture);
  }

  saveState();
  captureDraftPhoto = null;
  captureDraftTags = [];
  captureDraftPeopleIds = []; // v3.2.8
  capturePinChapterId = null;
  closeOrbSheet();
  checkStorageCapacity();
  render();
  toast('Captured.');
}

// Pull @Name mentions out of capture text and either log a touch with the matched
// person or stash as a pending mention if no match.
function extractMentionsFromCapture(capture) {
  const text = capture.text;
  const mentions = text.match(/@([A-Za-z][A-Za-z0-9_-]*)/g);
  if (!mentions) return;
  state._pendingMentions = state._pendingMentions || [];
  for (const raw of mentions) {
    const name = raw.slice(1);
    const matched = (state.people || []).find(p => p.name && p.name.toLowerCase() === name.toLowerCase());
    if (matched) {
      // Log a touch with excerpt
      const sentence = text.split(/(?<=[.!?])\s+/).find(s => s.includes(raw)) || text;
      matched.touches = matched.touches || [];
      matched.touches.push({
        id: uid(),
        ts: capture.ts,
        type: 'reflection_mention',
        note: sentence.trim().slice(0, 240),
        source: 'capture',
        source_id: capture.id,
      });
      matched.last_touch_ts = capture.ts;
    } else {
      // Stash as pending — same shape as examen-pending
      state._pendingMentions.push({
        id: uid(),
        name,
        ts: capture.ts,
        source: 'capture',
        source_id: capture.id,
      });
    }
  }
}

// v3.0.4 — CAPTURE DETAIL SHEET
// Tap on a capture card in Memories to open this. Shows photo full-size,
// full text, time, and offers Pin-to-chapter / Delete actions.
// ═══════════════════════════════════════════════════════════════════════
function openCaptureDetail(captureId) {
  const cap = (state.captures || []).find(c => c.id === captureId);
  if (!cap) return;

  const d = new Date(cap.ts);
  const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const monthName = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const dateStr = `${dayName} \u00b7 ${d.getDate()} ${monthName} ${d.getFullYear()} \u00b7 ${hh}:${mm}`;

  // Photo (full-bleed, no max-height clip — let it breathe)
  const photoHTML = (cap.photo && cap.photo.data)
    ? `<div style="margin:0 -22px 24px;background:var(--scrim-deep);">
         <img src="${cap.photo.data}" alt="" style="display:block;width:100%;height:auto;">
       </div>`
    : '';

  // Text
  const textHTML = cap.text && cap.text.trim()
    ? `<div style="font-family:'Fraunces',serif;font-size:17px;color:var(--ink);line-height:1.6;letter-spacing:-0.005em;white-space:pre-wrap;margin-bottom:32px;">${escapeHtml(cap.text.trim())}</div>`
    : '<div style="font-family:\'Fraunces\',serif;font-style:italic;font-size:14px;color:var(--ink-faint);margin-bottom:32px;">No words \u2014 just the image.</div>';

  // Chapter pin — only show if there's an active chapter
  const activeChapter = (state.chapters || []).find(c => !c.end_date);
  let pinBlock = '';
  if (activeChapter) {
    if (!Array.isArray(activeChapter.pinned_capture_ids)) activeChapter.pinned_capture_ids = [];
    const isPinned = activeChapter.pinned_capture_ids.includes(cap.id);
    pinBlock = `
      <button onclick="toggleCapturePin('${cap.id}','${activeChapter.id}')" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;background:transparent;border:0.5px solid ${isPinned ? 'var(--brass)' : 'var(--line)'};border-radius:10px;color:${isPinned ? 'var(--brass)' : 'var(--ink-muted)'};font-family:inherit;font-size:11.5px;cursor:pointer;margin-bottom:10px;letter-spacing:0.02em;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
        <span>${isPinned ? `Pinned to ${escapeHtml(activeChapter.title)}` : `Pin to ${escapeHtml(activeChapter.title)}`}</span>
      </button>
    `;
  }

  // v3.2.1: tags display + related captures
  const capTags = tagsFor(cap);
  const tagsHTML = capTags.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:24px;">
        ${capTags.map(t => `<button onclick="filterCapturesByTag('${escapeHtml(t)}')" style="padding:3px 10px;background:rgba(237,230,216,0.05);border:0.5px solid rgba(237,230,216,0.12);border-radius:999px;font-family:'Fraunces',serif;font-style:italic;font-size:10.5px;color:var(--ink-muted);cursor:pointer;">${escapeHtml(t)}</button>`).join('')}
       </div>`
    : '';

  // Related captures sharing any tag
  let relatedHTML = '';
  if (capTags.length) {
    const sharedTag = capTags[0]; // use first tag for the "related" section
    const related = (state.captures || [])
      .filter(c => c.id !== cap.id && (tagsFor(c)).includes(sharedTag))
      .sort((a,b) => new Date(b.ts).getTime() - new Date(a.ts).getTime())
      .slice(0, 3);
    if (related.length) {
      const relCards = related.map(c => {
        const d2 = new Date(c.ts);
        const dStr = `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d2.getDay()]} · ${d2.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d2.getMonth()]}`;
        const snip = (c.text||'').trim().slice(0,80);
        return `<button onclick="openCaptureDetail('${c.id}')" style="display:block;width:100%;background:none;border:none;padding:9px 0;border-bottom:0.5px solid var(--line);text-align:left;cursor:pointer;">
          <div style="font-family:'Inter',sans-serif;font-size:8.5px;color:var(--ink-faint);letter-spacing:0.1em;font-weight:500;margin-bottom:3px;">${dStr}</div>
          <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--ink-muted);line-height:1.5;">${escapeHtml(snip)}${(c.text||'').length>80?'…':''}</div>
        </button>`;
      }).join('');
      relatedHTML = `
        <div style="height:0.5px;background:var(--line);margin:24px 0 16px;"></div>
        <div style="font-family:'Inter',sans-serif;font-size:8.5px;letter-spacing:0.14em;color:var(--ink-faint);font-weight:500;margin-bottom:10px;">OTHER CAPTURES TAGGED ${escapeHtml(sharedTag.toUpperCase())}</div>
        ${relCards}`;
    }
  }

  openOverlay(`
    <div style="font-size:9.5px;letter-spacing:0.18em;color:var(--ink-faint);font-weight:500;margin-bottom:6px;text-transform:uppercase;">Capture</div>
    <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);margin-bottom:24px;">${dateStr}</div>
    ${photoHTML}
    ${textHTML}
    ${tagsHTML}
    ${pinBlock}
    <button onclick="deleteCaptureFromDetail('${cap.id}')" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:transparent;border:0.5px solid var(--line);border-radius:10px;color:var(--ink-faint);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:0.04em;">
      Delete capture
    </button>
    ${relatedHTML}
  `);
}

function filterCapturesByTag(tag) {
  // Navigate to the Life → Memories view filtered by this tag
  // For now: switch to Life tab and set the theme filter
  switchTab('life');
  reviewThemeFilter = tag;
  renderReview();
  toast(`Filtered by: ${tag}`);
}

function toggleCapturePin(captureId, chapterId) {
  const ch = (state.chapters || []).find(c => c.id === chapterId && !c.end_date);
  if (!ch) return;
  if (!Array.isArray(ch.pinned_capture_ids)) ch.pinned_capture_ids = [];
  const idx = ch.pinned_capture_ids.indexOf(captureId);
  if (idx >= 0) ch.pinned_capture_ids.splice(idx, 1);
  else ch.pinned_capture_ids.push(captureId);
  saveState();
  openCaptureDetail(captureId);  // re-render the sheet to reflect new state
}

async function deleteCaptureFromDetail(captureId) {
  const cap = (state.captures || []).find(c => c.id === captureId);
  if (!cap) return;
  const ok = await kuzuriConfirm({
    title: 'Delete this capture?',
    body: 'The text and photo will be removed. This cannot be undone.',
    confirmLabel: 'Delete',
    cancelLabel: 'Keep',
    tone: 'danger',
  });
  if (!ok) return;
  // Remove from captures
  state.captures = (state.captures || []).filter(c => c.id !== captureId);
  // Also remove from any chapter pins
  for (const ch of (state.chapters || [])) {
    if (Array.isArray(ch.pinned_capture_ids)) {
      ch.pinned_capture_ids = ch.pinned_capture_ids.filter(id => id !== captureId);
    }
  }
  saveState();
  closeOverlay();
  render();
  toast('Removed');
}

// v3.0.2 — kuzuriConfirm
// Promise-based confirmation dialog matching the design language. Replaces
// native confirm() so the prompt fits the cream/brass palette, the Fraunces
// titles, and the contemplative tone. Stacks above regular modals/overlays.
//
//   const ok = await kuzuriConfirm({
//     title: 'Retire this practice?',
//     body: 'Its history is kept — you\'ll still see it in Life — but it
//            won\'t appear in today\'s list.',
//     confirmLabel: 'Retire',
//     cancelLabel: 'Keep',
//     tone: 'danger',  // 'primary' | 'danger' (default 'primary')
//   });
//   if (!ok) return;
// ═══════════════════════════════════════════════════════════════════════
function kuzuriConfirm(opts) {
  const {
    title = 'Are you sure?',
    body = '',
    confirmLabel = 'Confirm',
    cancelLabel = 'Cancel',
    tone = 'primary',
  } = opts || {};
  return new Promise((resolve) => {
    const el = document.getElementById('confirm-modal');
    const titleHTML = escapeHtml(title);
    const bodyHTML = body ? `<div class="confirm-body">${escapeHtml(body)}</div>` : '';
    const confirmClass = tone === 'danger' ? 'danger' : 'primary';
    el.innerHTML = `
      <div class="confirm-panel">
        <div class="confirm-title">${titleHTML}</div>
        ${bodyHTML}
        <div class="confirm-row">
          <button class="confirm-btn" id="kc-cancel">${escapeHtml(cancelLabel)}</button>
          <button class="confirm-btn ${confirmClass}" id="kc-confirm">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>`;
    el.classList.add('active');
    const close = (result) => {
      el.classList.remove('active');
      el.innerHTML = '';
      resolve(result);
    };
    document.getElementById('kc-cancel').onclick = () => close(false);
    document.getElementById('kc-confirm').onclick = () => close(true);
    // Tap on scrim cancels
    el.onclick = (e) => { if (e.target === el) close(false); };
  });
}

function onTouchPhotoSelected(event, personId) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Resize to max 800px on long edge, JPEG q0.7
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      touchDraftPhoto = {
        data: dataUrl,
        captured_at: new Date().toISOString(),
        keep: false,
      };
      const preset = personId ? state.people.find(p => p.id === personId) : null;
      renderTouchSheet(preset);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  touchPinChapterId = touchPinChapterId === chapterId ? null : chapterId;
  // In-place re-render of the pin button only — preserves textarea content
  const modal = document.querySelector('.modal');
  if (!modal) return;
  const existing = Array.from(modal.querySelectorAll('button')).find(b => /Pin to|Pinned to/.test(b.textContent));
  if (existing) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = touchPinBlockHTML().trim();
    if (wrapper.firstElementChild) {
      existing.replaceWith(wrapper.firstElementChild);
    }
  }
}

function saveTouch(personId) {
  // v3.3.6: unified composer — read from textarea only, infer mode
  const note = (document.getElementById('touch-textarea')?.value || '').trim();
  const durationRaw = document.getElementById('touch-duration')?.value;
  const duration = durationRaw ? parseInt(durationRaw, 10) : null;
  // Infer mode: memory if photo or long note (≥40 chars), else 'note'
  const inferredMode = (touchDraftPhoto !== null || note.length >= 40) ? 'memory' : 'note';

  let person;
  if (personId) {
    person = state.people.find(p => p.id === personId);
  } else {
    const name = document.getElementById('touch-input').value.trim();
    if (!name) { closeModal(); return; }
    person = state.people.find(p => p.name && p.name.toLowerCase() === name.toLowerCase());
    if (!person) {
      person = { id: uid(), name, tier: 'tribe', cadence: null, last_touch_ts: null, touches: [], remember: {} };
      state.people.push(person);
    }
  }
  if (!person) { closeModal(); return; }

  const touch = {
    id: uid(),
    ts: new Date().toISOString(),
    note,
    type: touchType,
    source: 'manual',
    mode: inferredMode,  // v3.3.6: inferred from note length / photo
    tags: [...touchDraftTags],
    people_ids: personId ? [personId, ...touchDraftPeopleIds.filter(id => id !== personId)] : [...touchDraftPeopleIds], // v3.2.8
  };
  if (touchType === 'call' && duration && duration > 0) {
    touch.duration_min = duration;
  }
  if (touchDraftPhoto) {
    touch.photo = { ...touchDraftPhoto };  // includes data, captured_at, keep:false
  }

  person.last_touch_ts = touch.ts;
  person.touches = person.touches || [];
  person.touches.push(touch);

  // v3.2.8: fan out to any additional people linked via touchDraftPeopleIds
  const extraIds = (touch.people_ids || []).filter(id => id !== person.id);
  for (const extraId of extraIds) {
    const extraPerson = state.people.find(p => p.id === extraId);
    if (!extraPerson) continue;
    extraPerson.touches = extraPerson.touches || [];
    // Store a linked copy — same touch id so dedup works in memories view
    const linkedTouch = { ...touch, linked_primary_person_id: person.id };
    extraPerson.touches.push(linkedTouch);
    extraPerson.last_touch_ts = touch.ts;
  }

  // v2.10: pin to active chapter if user opted in (works in both Quick and Memory modes)
  if (touchPinChapterId) {
    const ch = state.chapters.find(c => c.id === touchPinChapterId && !c.end_date);
    if (ch) {
      if (!Array.isArray(ch.pinned_touch_ids)) ch.pinned_touch_ids = [];
      if (!ch.pinned_touch_ids.includes(touch.id)) ch.pinned_touch_ids.push(touch.id);
    }
  }

  saveState();
  closeModal();
  touchDraftPhoto = null;
  touchDraftTags = [];
  touchDraftPeopleIds = []; // v3.2.8
  touchPinChapterId = null;
  // Capacity check (4.5MB ~ 4500000 chars)
  checkStorageCapacity();
  render();
  toast(inferredMode === 'memory' ? 'Memory saved.' : `Logged ${touchType} with ${person.name}`);
}

// 30-day photo expiry — runs once on boot
function expireOldPhotos() {
  if (!state.people) return;
  const now = Date.now();
  const THIRTY_DAYS = 30 * 86400000;
  let changed = false;
  for (const p of state.people) {
    for (const t of (p.touches || [])) {
      if (t.photo && t.photo.data && !t.photo.keep && t.photo.captured_at) {
        const age = now - new Date(t.photo.captured_at).getTime();
        if (age > THIRTY_DAYS) {
          // Q2c: keep the touch + note, replace photo with faded marker
          t.photo = {
            faded: true,
            captured_at: t.photo.captured_at,
            keep: false,
          };
          changed = true;
        }
      }
    }
  }
  if (changed) saveState();
}

// Capacity warning at 4.5MB (Q from spec section 8)
function checkStorageCapacity() {
  state.config = state.config || {};
  const size = JSON.stringify(state).length;
  if (size > 4500000) {
    const lastWarn = state.config.last_capacity_warn || 0;
    if (Date.now() - lastWarn > 86400000) {  // Re-warn at most once per day
      toast('Storage is getting full. Old photos will fade unless marked Keep.');
      state.config.last_capacity_warn = Date.now();
      saveState();
    }
  }
}

// Toggle "keep this photo" — called from touch detail
function toggleTouchPhotoKeep(personId, touchId) {
  const p = state.people.find(x => x.id === personId);
  if (!p) return;
  const t = p.touches.find(x => x.id === touchId);
  if (!t || !t.photo) return;
  t.photo.keep = !t.photo.keep;
  saveState();
  openPersonDetail(personId);
  toast(t.photo.keep ? 'Photo kept.' : 'Will fade after 30 days.');
}

let examenDraft = null;
let examenStep = 0;

function voiceAvailable() {
  if (state.config.examen_voice_enabled === false) return false;
  if (typeof window.webkitSpeechRecognition === 'undefined' && typeof window.SpeechRecognition === 'undefined') return false;
  if (window.location.protocol === 'file:') return false;
  return true;
}

function openExamen() {
  const existing = todayExamen();
  if (existing) return openExamenSummary();
  // v3.0.2: capture today's intention so the Examen can ask whether it was lived
  const td = todayISO();
  const todaysIntention = (state.intentions || []).find(i => i.for_date === td && i.text && i.text.trim());
  examenDraft = {
    date_iso: todayISO(),
    went_well: '',
    went_poorly: '',
    remains: '',
    tags: [],           // v3.2.1: replaces themes
    virtue_tags: [],
    skipped: { poorly: false, remains: false },
    carry_forward: true,
    pin_to_chapter_id: null,
    // v3.0.2: intention close-the-loop (Option B)
    intention_text: todaysIntention ? todaysIntention.text.trim() : null,
    intention_outcome: null,    // 'lived' | 'drifted' | 'forgot' | null
    intention_note: '',
  };
  examenStep = 0;
  renderExamen();
}
function closeExamen() {
  stopExamenVoice();
  closeOverlay();
  examenDraft = null;
}
function renderExamen() {
  if (!examenDraft) return;
  captureExamenFields();
  const dots = [0,1,2,3,4].map(i => {
    if (i < examenStep) return '<span class="done"></span>';
    if (i === examenStep) return '<span class="active"></span>';
    return '<span></span>';
  }).join('');
  let body;
  if (examenStep === 0) body = examenInvocation();
  else if (examenStep === 1) body = examenWentWell();
  else if (examenStep === 2) body = examenWentPoorly();
  else if (examenStep === 3) body = examenRemains();
  else body = examenClosing();

  openOverlay(`
    <div class="ex-progress">${dots}</div>
    ${body}
  `);
  setTimeout(() => {
    const ta = document.querySelector('#overlay textarea');
    if (ta) ta.focus();
  }, 280);
}
function captureExamenFields() {
  if (!examenDraft) return;
  const well = document.getElementById('ex-field-well');
  if (well) examenDraft.went_well = well.value;
  const poor = document.getElementById('ex-field-poor');
  if (poor) examenDraft.went_poorly = poor.value;
  const rem = document.getElementById('ex-field-rem');
  if (rem) examenDraft.remains = rem.value;

// v3.2.0 — Opening ritual questions. Rotate nightly, never repeat two nights running.

function getOpeningQuestion() {
  const today = todayISO();

  const dayNum = Math.abs(today.split('-').reduce((a, b) => a * 31 + parseInt(b, 10), 0));
  return EXAMEN_OPENING_QUESTIONS[dayNum % EXAMEN_OPENING_QUESTIONS.length];
}

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>

      </button>`;
  }

  return `
    <svg class="ex-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <div class="ex-close-headline">The day is sealed.</div>
    ${echo}
    ${tagBlock}

    <button class="btn-brass" onclick="examenFinalize()" style="margin-top:16px;">Close</button>
    ${pinBlock}

// v2.8.2: Extract #themes from text. Matches #word patterns, dedupes case-insensitively, lowercases.
// v3.2.1 — Tags system. Replaces #themes entirely.
// extractLegacyTags: reads old #word patterns from text — used ONLY for migration.
function extractLegacyTags(text) {
  if (!text) return [];
  const matches = text.match(/#([a-zA-Z][a-zA-Z0-9_-]*)/g);
  if (!matches) return [];
  const seen = new Set();
  const out = [];
  for (const m of matches) {
    const tag = m.slice(1).toLowerCase();
    if (!seen.has(tag)) { seen.add(tag); out.push(tag); }
  }
  return out;
}

// tagsFor: canonical tag reader for any entry type. v3.2.8: reads all meaningful fields.
function tagsFor(entry) {
  if (!entry) return [];
  // Explicit tags array — primary source
  if (Array.isArray(entry.tags) && entry.tags.length) return entry.tags;
  // Legacy themes array — migrate and persist
  if (Array.isArray(entry.themes) && entry.themes.length) {
    entry.tags = [...entry.themes];
    delete entry.themes;
    return entry.tags;
  }
  // Legacy #word extraction from all meaningful text fields
  const textParts = [
    entry.went_well, entry.went_poorly, entry.remains,  // examen
    entry.text,                                          // capture
    entry.note,                                          // touch / memory
    entry.intention_text, entry.outcome_note,            // intention close-loop
    entry.reflection, entry.people_plan,                 // pause
  ].filter(Boolean).join(' ');
  const legacy = extractLegacyTags(textParts);
  if (legacy.length) {
    entry.tags = legacy;
    return entry.tags;
  }
  return entry.tags || [];
}

// normTag: lowercase, trim, max 40 chars
const normTag = t => t.toLowerCase().trim().replace(/[^a-z0-9_\-\s]/g, '').trim().slice(0, 40);

function examenFinalize() {
  if (!examenDraft) return;
  captureExamenFields();
  stopExamenVoice();
  const now = new Date().toISOString();

  const record = {
    id: uid(),
    date_iso: examenDraft.date_iso,
    went_well: examenDraft.went_well.trim(),
    went_poorly: examenDraft.went_poorly.trim(),
    remains: examenDraft.remains.trim(),
    tags: Array.isArray(examenDraft.tags) ? [...examenDraft.tags] : [], // v3.2.1: tags replace themes
    virtue_tags: [...examenDraft.virtue_tags],
    skipped: { ...examenDraft.skipped },
    carry_forward: examenDraft.carry_forward,
    intention_text: examenDraft.intention_text || null,
    intention_outcome: examenDraft.intention_outcome || null,
    intention_note: (examenDraft.intention_note || '').trim() || null,
    created_at: now,
    completed_at: now,
  };
  state.examens.push(record);
  // v3.0.2: when the examen records an intention outcome, also reflect it back
  // onto the intention record itself (so other surfaces can read it without
  // joining tables — e.g. Today, Life, intention history).
  if (examenDraft.intention_text && examenDraft.intention_outcome) {
    const intent = (state.intentions || []).find(
      i => i.for_date === examenDraft.date_iso && (i.text || '').trim() === examenDraft.intention_text
    );
    if (intent) {
      intent.outcome = examenDraft.intention_outcome;
      intent.outcome_note = (examenDraft.intention_note || '').trim() || null;
      intent.outcome_at = now;
    }
  }
  // v2.10: pin to active chapter if user opted in
  if (examenDraft.pin_to_chapter_id) {
    const ch = state.chapters.find(c => c.id === examenDraft.pin_to_chapter_id && !c.end_date);
    if (ch) {
      if (!Array.isArray(ch.pinned_examen_ids)) ch.pinned_examen_ids = [];
      if (!ch.pinned_examen_ids.includes(record.id)) ch.pinned_examen_ids.push(record.id);
    }
  }
  // @mention auto-extraction — inside-out accretion
  const mentioned = scanForMentions(
    [record.went_well, record.went_poorly, record.remains].join(' '),
    { source: 'examen', source_id: record.id, ts: now }
  );
  if (mentioned.length) {
    record.mentions = mentioned.map(p => p.id);
  }
  if (record.carry_forward && record.remains) {
    const tmrw = new Date(); tmrw.setDate(tmrw.getDate() + 1);
    const tmrwISO = tmrw.toISOString().slice(0,10);
    state.intentions = state.intentions.filter(i => i.for_date !== tmrwISO);
    state.intentions.push({
      id: uid(), for_date: tmrwISO,
      text: record.remains, completed: false, source: 'examen',
    });
  }
  saveState();
  closeExamen();
  render();
  toast('Rest well.');

  // v3.2.0: async tone + topics — fire and forget, no spinner, no blocking
  if (record.went_well || record.went_poorly || record.remains) {
    (async () => {
      try {
        const r = await fetch(WORKER_BASE_URL + '/api/examen-tone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            went_well:   record.went_well   || '',
            went_poorly: record.went_poorly || '',
            remains:     record.remains     || '',
          }),
        });
        if (!r.ok) return;
        const data = await r.json();
        if (!data.tone && (!data.topics || !data.topics.length)) return;
        const ex = state.examens.find(e => e.id === record.id);
        if (ex) {
          if (data.tone)   ex.tone   = data.tone;
          if (data.topics && data.topics.length) ex.topics = data.topics;
          saveState();
          if ((state.nav && state.nav.active) === 'today') renderToday();
        }
      } catch { /* silent */ }
    })();
  }
}
