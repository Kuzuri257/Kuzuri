// Reads:
//   - Whoop sleep stage_summary for stage bar + performance %
//   - Whoop recovery (HRV, RHR, score) for the recovery card
//   - Manual sleep/weight/mood for the +log cards
// Falls back gracefully when Whoop hasn't synced or isn't connected.
// ═══════════════════════════════════════════════════════════════════════

// Stage bar — horizontal stack: awake | light | deep | REM
// Each segment proportional to time. Returns SVG string.
// Color tokens: awake=ink-faint, light=accent-bright, deep=accent (deeper),
// REM=brass (warm, dream-like).
// v3.2.2: central sleep duration formatter.
// Input: decimal hours (e.g. 6.3 → "6h 18m"). Used everywhere sleep is shown.
function fmtSleepHours(h) {
  if (h == null || typeof h !== 'number') return null;
  const totalMin = Math.round(h * 60);
  const hours = Math.floor(totalMin / 60);
  const mins  = totalMin % 60;
  if (mins === 0) return `${hours}h`;
  return `${hours}h ${mins}m`;
}

// v3.2.6 — Mood trend helpers
// Mood scores: 1=heavy, 2=low, 3=steady, 4=good, 5=bright
const MOOD_LABELS = { 1:'heavy', 2:'low', 3:'steady', 4:'good', 5:'bright' };

function moodForDate(isoDate) {
  // Return most recent mood score for a given date, or null
  const entries = (state.moods || [])
    .filter(m => (m.ts || '').slice(0,10) === isoDate)
    .sort((a,b) => new Date(b.ts).getTime() - new Date(a.ts).getTime());
  return entries.length ? entries[0].score : null;
}

function moodTrendForDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0,10);
    out.push({ iso, score: moodForDate(iso) });
  }
  return out;
}

function moodBarColor(score, isToday) {
  if (score >= 4) return isToday ? 'var(--accent-bright)' : 'rgba(78,141,111,0.65)';
  if (score === 3) return isToday ? 'var(--brass)' : 'rgba(200,155,106,0.62)';
  return isToday ? 'var(--clay)' : 'rgba(196,122,99,0.68)';
}

function moodSummaryPhrase(trend) {
  const scored = trend.filter(d => d.score != null);
  if (!scored.length) return null;
  const avg = scored.reduce((a,b) => a + b.score, 0) / scored.length;
  const recent = scored.slice(-3);
  const recentAvg = recent.reduce((a,b) => a + b.score, 0) / recent.length;
  if (avg >= 4.2) return 'A bright stretch.';
  if (avg >= 3.5) return 'Steadier this week.';
  if (avg >= 2.8) return recentAvg > avg ? 'Lifting toward the end.' : 'Somewhere in the middle.';
  if (avg >= 2.0) return 'A softer week.';
  return 'Carrying some weight.';
}

// ═══════════════════════════════════════════════════════════════════════
// v3.3.3 — SHARED RHYTHM HELPERS
// One colour function + one dot renderer powering mood calendar,
// sleep rhythm, and recovery rhythm. Clean to extend for week/year.
// ═══════════════════════════════════════════════════════════════════════

function rhythmDotColor(signal, value, isToday) {
  // v3.3.4: theme-aware — light mode needs higher opacity on cream background
  const isLight = document.documentElement.dataset.theme === 'light';
  if (value == null) {
    // Empty dot: show structure without weight
    return isLight ? 'rgba(58,48,32,0.11)' : 'rgba(237,230,216,0.08)';
  }
  let cat;
  if (signal === 'mood')          cat = value >= 4 ? 'green' : value === 3 ? 'brass' : 'clay';
  else if (signal === 'sleep')    cat = value >= 7 ? 'green' : value >= 6 ? 'brass' : 'clay';
  else if (signal === 'recovery') cat = value >= 67 ? 'green' : value >= 34 ? 'brass' : 'clay';
  else cat = 'brass';
  if (isLight) {
    // Light mode: use warm dark-base colours with enough opacity to show on cream
    if (cat === 'green') return isToday ? 'rgba(45,94,68,0.28)' : 'rgba(45,94,68,0.60)';
    if (cat === 'brass') return isToday ? 'rgba(139,98,51,0.26)' : 'rgba(139,98,51,0.65)';
    return isToday ? 'rgba(154,74,51,0.26)' : 'rgba(154,74,51,0.70)';
  }
  // Dark mode: original values
  const alpha = isToday ? 0.30 : 0.55;
  if (cat === 'green') return `rgba(78,141,111,${alpha})`;
  if (cat === 'brass') return `rgba(200,155,106,${alpha})`;
  return `rgba(196,122,99,${alpha + 0.10})`;
}

function rhythmDotHTML(value, isToday, size, signal) {
  const fill   = rhythmDotColor(signal, value, isToday);
  // v3.3.4: today border theme-aware
  const isLight = document.documentElement.dataset.theme === 'light';
  const border = isToday
    ? (isLight ? 'border:1.5px solid rgba(58,48,32,0.35);' : 'border:1.5px solid rgba(237,230,216,0.38);')
    : '';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${fill};${border}flex-shrink:0;"></div>`;
}

function rhythmInsightPhrase(signal, trend) {
  const field = signal === 'sleep' ? 'h' : 'score';
  const vals = trend.map(d => d[field]).filter(v => v != null);
  if (!vals.length) return 'No data logged yet.';
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const recent = vals.slice(-3);
  const recentAvg = recent.reduce((a, b) => a + b, 0) / recent.length;
  const lifting = recentAvg > avg + (signal === 'recovery' ? 5 : 0.3);
  const dipping = recentAvg < avg - (signal === 'recovery' ? 5 : 0.3);
  if (signal === 'sleep') {
    if (avg >= 7.5) return 'Solid sleep across the week.';
    if (avg >= 6.5) return lifting ? 'Improving toward the weekend.' : 'Mostly steady this week.';
    if (avg >= 6.0) return dipping ? 'Shorter nights recently.' : 'A mixed week for sleep.';
    return 'A lighter week for sleep.';
  } else {
    if (avg >= 70) return lifting ? 'Recovery building well.' : 'Recovery held strong.';
    if (avg >= 50) return lifting ? 'Picking up toward the end.' : 'Mostly steady this week.';
    if (avg >= 34) return dipping ? 'A softer stretch recently.' : 'A mixed week for recovery.';
    return 'A heavier week. Rest when you can.';
  }
}

// ─── Weight trend helpers ───────────────────────────────────────────────
function weightTrendData(limit) {
  return (state.weights || [])
    .filter(w => w.ts && typeof w.weight_kg === 'number')
    .sort((a, b) => new Date(a.ts).getTime() - new Date(b.ts).getTime())
    .slice(-limit);
}

function weightTrendLineSVG(entries) {
  if (!entries || entries.length < 2) return '';
  const W = 100, H = 28;
  const vals = entries.map(e => e.weight_kg);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const px = i => ((i / (entries.length - 1)) * W).toFixed(2);
  const py = v => (H - ((v - minV) / range) * (H - 4) - 2).toFixed(2);
  const points = entries.map((e, i) => `${px(i)},${py(e.weight_kg)}`).join(' ');
  const lx = parseFloat(px(entries.length - 1));
  const ly = parseFloat(py(entries[entries.length - 1].weight_kg));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;overflow:visible;">
    <polyline points="${points}" fill="none" stroke="var(--ink-faint)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--brass)" opacity="0.75"/>
  </svg>`;
}

function weightSummaryPhrase(entries) {
  if (!entries || entries.length < 2) return 'Not enough weigh-ins yet.';
  const delta = entries[entries.length - 1].weight_kg - entries[0].weight_kg;
  if (Math.abs(delta) < 0.5) return 'Mostly stable.';
  return delta < 0 ? 'A gentle downward drift.' : 'A slight upward drift.';
}

function moodTrendCardHTML(days = 7) {
  const trend = moodTrendForDays(days);
  const scored = trend.filter(d => d.score != null);
  if (!scored.length) {
    // Empty state — show muted bars
    const emptyBars = trend.map((_,i) => {
      const barW = 100/trend.length - 2.5;
      const x = i * (barW + 2.5);
      return `<rect x="${x.toFixed(1)}" y="30" width="${barW.toFixed(1)}" height="14" rx="2" fill="rgba(237,230,216,0.07)"/>`;
    }).join('');
    return `
      <div class="pulse-card">
        <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:10px;">PAST 7 DAYS · FELT</div>
        <svg viewBox="0 0 100 44" width="100%" height="44" style="display:block;margin-bottom:6px;">${emptyBars}</svg>
        <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--ink-faint);">No moods logged yet.</div>
      </div>`;
  }
  const summary = moodSummaryPhrase(trend);
  const H = 44;
  const barCount = trend.length;
  const gap = 2.5;
  const barW = (100 - (barCount-1)*gap) / barCount;
  const bars = trend.map((d, i) => {
    const x = i * (barW + gap);
    const isToday = i === trend.length - 1;
    if (d.score == null) {
      return `<rect x="${x.toFixed(1)}" y="4" width="${barW.toFixed(1)}" height="${H-8}" rx="2" fill="rgba(237,230,216,0.07)"/>`;
    }
    const ratio = (d.score - 1) / 4; // 0–1
    const barH = Math.max(6, Math.round(ratio * (H-12) + 8));
    const y = H - barH;
    const fill = moodBarColor(d.score, isToday);
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${barH}" rx="2" fill="${fill}"/>`;
  }).join('');

  // Day labels — just first and "today"
  const firstScored = trend.find(d => d.score != null);
  const firstLabel = firstScored ? (() => {
    const dt = new Date(firstScored.iso + 'T12:00:00');
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
  })() : '';

  return `
    <div class="pulse-card">
      <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:10px;">PAST ${days} DAYS · FELT</div>
      <svg viewBox="0 0 100 ${H}" width="100%" height="52" style="display:block;">${bars}</svg>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--ink-faint);">
        <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;">${firstLabel}</span>
        ${summary ? `<span style="font-family:'Fraunces',serif;font-style:italic;color:var(--ink-muted);">${summary}</span>` : ''}
        <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;color:var(--ink);">today</span>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// v3.3.3 — MONTHLY MOOD CALENDAR  (Life → Month tab only)
// "how it felt" companion to the activity calendar
// ═══════════════════════════════════════════════════════════════════════
function moodCalendarHTML() {
  // v3.3.6: compact version — 8px dots, tighter grid, no legend, insight inline
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay(); // 0=Sun
  const offset = firstDow;  // Sun-first
  const todayStr = todayISO();

  const DAY_LABELS = ['S','M','T','W','T','F','S'];
  const headerCells = DAY_LABELS.map(l =>
    `<div style="font-size:6px;letter-spacing:0.06em;color:var(--ink-faint);text-align:center;padding-bottom:2px;">${l}</div>`
  ).join('');
  const blankCells = Array.from({length: offset}, () => `<div></div>`).join('');

  const dotCells = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isFuture = iso > todayStr;
    const isToday  = iso === todayStr;
    const score    = isFuture ? null : moodForDate(iso);
    const fill     = rhythmDotColor('mood', score, isToday);
    const isLightMode = document.documentElement.dataset.theme === 'light';
    const border   = isToday ? (isLightMode ? 'border:1.5px solid rgba(58,48,32,0.35);' : 'border:1.5px solid rgba(237,230,216,0.38);') : '';
    const opacity  = isFuture ? 'opacity:0.3;' : '';
    // v3.3.6: 8px dots, 1.5px padding
    dotCells.push(
      `<div style="display:flex;align-items:center;justify-content:center;padding:1.5px 0;">` +
      `<div style="width:8px;height:8px;border-radius:50%;background:${fill};${border}${opacity}"></div>` +
      `</div>`
    );
  }

  // Insight — first sentence only, placed inline with the kicker
  const trend = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if (iso <= todayStr) trend.push({ iso, score: moodForDate(iso) });
  }
  const rawPhrase = moodSummaryPhrase(trend) || '';
  const insight = rawPhrase ? rawPhrase.split('.')[0] + '.' : '';

  const monthLabel = now.toLocaleDateString('en',{month:'long',year:'numeric'}).toUpperCase();

  return `
    <div style="background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;">
        <div style="font-size:7px;letter-spacing:0.2em;color:var(--ink-faint);text-transform:uppercase;font-weight:500;">Felt \u00b7 ${monthLabel}</div>
        ${insight ? `<div style="font-size:10px;color:var(--ink-faint);font-style:italic;font-family:'Fraunces',serif;">${escapeHtml(insight)}</div>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;">
        ${headerCells}
        ${blankCells}
        ${dotCells.join('')}
      </div>
    </div>`;
}

function pulseStageBarSVG(stages, totalMs) {
  if (!stages || !totalMs) return '';
  const segs = [
    { ms: stages.awake || 0, color: 'var(--ink-faint)' },
    { ms: stages.light || 0, color: 'var(--accent-bright)' },
    { ms: stages.deep  || 0, color: 'var(--accent)' },
    { ms: stages.rem   || 0, color: 'var(--brass)' },
  ];
  const W = 100, H = 8;
  let x = 0;
  let parts = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="${H}" style="display:block;border-radius:3px;overflow:hidden;">`;
  for (const s of segs) {
    const w = (s.ms / totalMs) * W;
    if (w <= 0) continue;
    parts += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${H}" fill="${s.color}"/>`;
    x += w;
  }
  parts += '</svg>';
  return parts;
}

// Recovery dial — small circle with arc proportional to score, score number in middle.
// Color by score band (sage / brass / dim).
function pulseRecoveryDialSVG(score) {
  if (score == null) return '';
  const r = 30;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, score / 100));
  const dashOffset = c * (1 - pct);
  let arcColor;
  if (score >= 67) arcColor = 'var(--accent-bright)';
  else if (score >= 34) arcColor = 'var(--brass)';
  else arcColor = 'var(--brass-dim)';
  return `
    <svg width="76" height="76" viewBox="0 0 76 76">
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="3"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="${arcColor}" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}"
              transform="rotate(-90 38 38)"/>
      <text x="38" y="44" text-anchor="middle"
            font-family="Fraunces, serif" font-size="20" font-weight="500" fill="var(--ink)"
            letter-spacing="-0.01em">${score}</text>
    </svg>
  `;
}

// Past-7-nights sparkline. Anchors today on the right.
// Returns SVG string.
function pulseSleepSparklineSVG(values) {
  // v3.2.5: color-shift — bars shift clay→brass→green by duration, no legend
  if (!values || !values.length) return '';
  const W = 100, H = 44;
  const barCount = values.length;
  const gap = 2.5;
  const barW = (W - (barCount - 1) * gap) / barCount;
  const bars = values.map((v, i) => {
    const x = i * (barW + gap);
    const isToday = i === values.length - 1;
    if (typeof v.h !== 'number') {
      return `<rect x="${x.toFixed(2)}" y="4" width="${barW.toFixed(2)}" height="${(H-8).toFixed(2)}" rx="2" fill="rgba(237,230,216,0.07)"/>`;
    }
    const clamped = Math.max(4, Math.min(10, v.h));
    const ratio = (clamped - 4) / 6;
    const barH = Math.max(4, Math.round(ratio * (H - 10) + 6));
    const y = H - barH;
    // Color shifts with duration: clay <6h → brass 6–7h → green ≥7h
    let fill;
    if (isToday) {
      fill = v.h >= 7 ? 'var(--accent-bright)' : v.h >= 6 ? 'var(--brass)' : 'var(--clay)';
    } else {
      fill = v.h >= 7 ? 'rgba(78,141,111,0.68)' : v.h >= 6 ? 'rgba(200,155,106,0.62)' : 'rgba(196,122,99,0.70)';
    }
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${barH.toFixed(2)}" rx="2" fill="${fill}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="56" style="display:block;">${bars}</svg>`;
}

// v3.2.3: calm 7-bar visual for recovery scores (0-100)
function pulseRecoverySparklineSVG(values) {
  if (!values || !values.length) return '';
  const W = 100, H = 44;
  const barCount = values.length;
  const gap = 2.5;
  const barW = (W - (barCount - 1) * gap) / barCount;
  const scoreColor = s => s >= 67 ? 'rgba(78,141,111,' : s >= 34 ? 'rgba(200,155,106,' : 'rgba(196,122,99,';
  const bars = values.map((v, i) => {
    const x = i * (barW + gap);
    const isToday = i === values.length - 1;
    if (typeof v.score !== 'number') {
      return `<rect x="${x.toFixed(2)}" y="4" width="${barW.toFixed(2)}" height="${(H - 8).toFixed(2)}" rx="2" fill="rgba(237,230,216,0.07)"/>`;
    }
    const ratio = v.score / 100;
    const barH = Math.max(4, Math.round(ratio * (H - 10) + 6));
    const y = H - barH;
    const base = scoreColor(v.score);
    const fill = isToday ? `${base}0.9)` : `${base}0.55)`;
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${barH.toFixed(2)}" rx="2" fill="${fill}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="56" style="display:block;">${bars}</svg>`;
}


function openPulseSheet() {
  renderPulseSheet();
}

function renderPulseSheet() {
  const td = todayISO();
  const yesterdayISO = (() => { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();

  // ─── Sleep data (manual takes precedence; fall back to Whoop)
  const todayManualSleep = (state.sleep || []).find(s => s.date === td);
  const lastManualSleep = (state.sleep || []).slice().reverse().find(s => s.date !== td);

  // For the SLEPT card we want Whoop's full record so we can show stages.
  // Prefer today; if Whoop hasn't synced today yet, fall back to most recent.
  let whoopSleepRec = whoopSleepRecordFor(td);
  if (!whoopSleepRec) {
    // Look back up to 2 nights — the night just past may live under yesterday
    whoopSleepRec = whoopSleepRecordFor(yesterdayISO);
  }
  // The hours number we display
  let displayedSleepH = null;
  let sleepSource = null; // 'manual' | 'whoop' | null
  if (todayManualSleep && typeof todayManualSleep.duration_h === 'number') {
    displayedSleepH = todayManualSleep.duration_h;
    sleepSource = 'manual';
  } else if (whoopSleepRec) {
    const stage = whoopSleepRec.score.stage_summary;
    const sleepMs = Math.max(0, (stage.total_in_bed_time_milli || 0) - (stage.total_awake_time_milli || 0));
    displayedSleepH = Math.round((sleepMs / 3600000) * 10) / 10;
    sleepSource = 'whoop';
  }

  // ─── Recovery data (Whoop-only)
  const whoopRecRec = whoopRecoveryRecordFor(td) || whoopRecoveryRecordFor(yesterdayISO);
  const recoveryScore = whoopRecRec && whoopRecRec.score && typeof whoopRecRec.score.recovery_score === 'number'
    ? whoopRecRec.score.recovery_score
    : null;

  // ─── Weight + mood (manual only)
  const todayWeight = (state.weights || []).slice().reverse().find(w => isSameDay(w.ts, td));
  const lastWeight = (state.weights || []).slice().reverse().find(w => !isSameDay(w.ts, td));
  const todayMood = (state.moods || []).slice().reverse().find(m => isSameDay(m.ts, td));

  // ─── 7-day trend data via provider-agnostic helpers (v3.2.3)
  const spark7    = sleepTrendForDays(7);
  const recovery7 = recoveryTrendForDays(7);
  const sparkVals = spark7.map(d => d.h).filter(h => typeof h === 'number');
  const sparkAvg = sparkVals.length >= 3
    ? (sparkVals.reduce((a, b) => a + b, 0) / sparkVals.length).toFixed(1)
    : null;

  // ─── Subtitle line: source + last sync
  const syncRel = whoopLastSyncRelative();
  const isWhoopConnected = !!(state.whoop && state.whoop.connected);
  let subtitle = '';
  if (isWhoopConnected && syncRel) {
    subtitle = `<div style="display:flex;align-items:center;gap:6px;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--brass);margin-bottom:24px;">
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);"></span>
      Whoop \u00b7 last synced ${escapeHtml(syncRel)}
    </div>`;
  } else {
    subtitle = `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ink-muted);margin-bottom:24px;">Listening to what you tell it.</div>`;
  }

  // ─── SLEPT card
  let sleptCard;
  if (displayedSleepH != null) {
    const stages = whoopSleepRec ? whoopSleepRec.score.stage_summary : null;
    const sourceTag = sleepSource === 'whoop'
      ? `<span style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--brass);">via Whoop</span>`
      : `<span style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);">logged</span>`;

    let stageBlock = '';
    if (stages) {
      const awakeMs = stages.total_awake_time_milli || 0;
      const lightMs = stages.total_light_sleep_time_milli || 0;
      const deepMs  = stages.total_slow_wave_sleep_time_milli || 0;
      const remMs   = stages.total_rem_sleep_time_milli || 0;
      const totalMs = awakeMs + lightMs + deepMs + remMs;
      const fmt = (ms) => {
        if (!ms) return '0m';
        const totalMin = Math.round(ms / 60000);
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        if (h === 0) return `${m}m`;
        return `${h}h ${m}m`;
      };
      stageBlock = `
        <div style="margin-top:14px;">
          ${pulseStageBarSVG({ awake: awakeMs, light: lightMs, deep: deepMs, rem: remMs }, totalMs)}
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;">
            <div>
              <div style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);font-family:'Inter',sans-serif;letter-spacing:0.02em;">
                <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-faint);"></span>awake
              </div>
              <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ink);margin-top:1px;">${fmt(awakeMs)}</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);font-family:'Inter',sans-serif;letter-spacing:0.02em;">
                <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent-bright);"></span>light
              </div>
              <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ink);margin-top:1px;">${fmt(lightMs)}</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);font-family:'Inter',sans-serif;letter-spacing:0.02em;">
                <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);"></span>deep
              </div>
              <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ink);margin-top:1px;">${fmt(deepMs)}</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);font-family:'Inter',sans-serif;letter-spacing:0.02em;">
                <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brass);"></span>rem
              </div>
              <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ink);margin-top:1px;">${fmt(remMs)}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Sleep performance line (Whoop-only)
    let perfLine = '';
    if (whoopSleepRec && typeof whoopSleepRec.score.sleep_performance_percentage === 'number') {
      const pct = Math.round(whoopSleepRec.score.sleep_performance_percentage);
      const word = sleepPerformanceWord(pct);
      perfLine = `
        <div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--line);">
          <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--ink-muted);">
            Sleep performance \u00b7 <span style="color:var(--accent-bright);font-style:normal;font-family:'Inter',sans-serif;font-weight:500;">${pct}%</span> \u00b7 ${escapeHtml(word)}.
          </div>
        </div>
      `;
    }

    sleptCard = `
      <div class="pulse-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;">SLEPT</div>
          <button onclick="pulseEditSleep()" style="background:none;border:none;color:var(--ink-faint);font-family:inherit;font-size:11px;cursor:pointer;padding:0;letter-spacing:0.02em;">edit</button>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px;">
          <div style="font-family:'Fraunces',serif;font-size:38px;color:var(--ink);font-weight:400;letter-spacing:-0.02em;line-height:1;">${fmtSleepHours(displayedSleepH) || displayedSleepH}</div>
          <div style="margin-left:auto;">${sourceTag}</div>
        </div>
        ${stageBlock}
        ${perfLine}
        ${(() => {
          // v3.3.3: 7-night rhythm row inside the sleep card
          if (!spark7.some(d => typeof d.h === 'number')) return '';
          const DAY = ['M','T','W','T','F','S','S'];
          const cols = spark7.map((d, i) => {
            const isToday = i === spark7.length - 1;
            const dow = (new Date(d.iso + 'T12:00:00').getDay() + 6) % 7;
            const val = typeof d.h === 'number' ? Math.floor(d.h) + 'h' : '';
            const dotColor = isToday ? 'var(--ink)' : 'var(--ink-faint)';
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
              ${rhythmDotHTML(d.h, isToday, 18, 'sleep')}
              <span style="font-size:7px;color:${dotColor};font-style:italic;font-family:'Fraunces',serif;">${val}</span>
              <span style="font-size:6px;color:var(--ink-faint);letter-spacing:0.06em;">${DAY[dow]}</span>
            </div>`;
          }).join('');
          const phrase = rhythmInsightPhrase('sleep', spark7);
          const di = phrase.indexOf('.');
          const pf = di >= 0 ? phrase.slice(0, di + 1) : phrase;
          const pr = di >= 0 ? phrase.slice(di + 1).trim() : '';
          return `<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--line);">
            <div style="font-size:8.5px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:9px;">PAST 7 NIGHTS</div>
            <div style="display:flex;justify-content:space-between;gap:2px;">${cols}</div>
            <div style="margin-top:9px;font-size:11px;color:var(--ink-muted);font-style:italic;line-height:1.5;">
              <span style="color:var(--ink);">${escapeHtml(pf)}</span>${pr ? ' ' + escapeHtml(pr) : ''}
            </div>
          </div>`;
        })()}
      </div>
    `;
  } else {
    sleptCard = `
      <button onclick="pulseEditSleep()" class="pulse-card pulse-card-empty">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
          <div style="text-align:left;">
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:6px;">SLEPT</div>
            <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);">Not yet logged.</div>
            ${lastManualSleep ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-faint);margin-top:2px;">Last: ${fmtSleepHours(lastManualSleep.duration_h)}</div>` : ''}
          </div>
          <div class="pulse-log-btn">+ log</div>
        </div>
      </button>
    `;
  }

  // ─── RECOVERY card (Whoop-only)
  let recoveryCard = '';
  if (recoveryScore != null) {
    const rs = recoveryStateFor(recoveryScore);
    const hrv = whoopRecRec && whoopRecRec.score && typeof whoopRecRec.score.hrv_rmssd_milli === 'number'
      ? Math.round(whoopRecRec.score.hrv_rmssd_milli) : null;
    const rhr = whoopRecRec && whoopRecRec.score && typeof whoopRecRec.score.resting_heart_rate === 'number'
      ? Math.round(whoopRecRec.score.resting_heart_rate) : null;
    const metricLine = (hrv != null || rhr != null)
      ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--ink-muted);margin-top:4px;">${[
          hrv != null ? `HRV ${hrv}` : '',
          rhr != null ? `resting ${rhr} bpm` : '',
        ].filter(Boolean).join(' \u00b7 ')}</div>`
      : '';
    recoveryCard = `
      <div class="pulse-card">
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="flex:1;">
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:8px;">RECOVERY</div>
            <div style="font-family:'Fraunces',serif;font-size:30px;color:var(--ink);font-weight:400;letter-spacing:-0.015em;line-height:1.1;">${escapeHtml(rs.title)}</div>
            ${metricLine}
            <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.4;">${escapeHtml(rs.body)}</div>
          </div>
          <div style="flex-shrink:0;">${pulseRecoveryDialSVG(recoveryScore)}</div>
        </div>
        ${(() => {
          // v3.3.3: 7-day rhythm row inside the recovery card
          if (!recovery7.some(d => typeof d.score === 'number')) return '';
          const DAY = ['M','T','W','T','F','S','S'];
          const cols = recovery7.map((d, i) => {
            const isToday = i === recovery7.length - 1;
            const dow = (new Date(d.iso + 'T12:00:00').getDay() + 6) % 7;
            const val = typeof d.score === 'number' ? String(d.score) : '';
            const dotColor = isToday ? 'var(--ink)' : 'var(--ink-faint)';
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
              ${rhythmDotHTML(d.score, isToday, 18, 'recovery')}
              <span style="font-size:7px;color:${dotColor};font-style:italic;font-family:'Fraunces',serif;">${val}</span>
              <span style="font-size:6px;color:var(--ink-faint);letter-spacing:0.06em;">${DAY[dow]}</span>
            </div>`;
          }).join('');
          const phrase = rhythmInsightPhrase('recovery', recovery7);
          const di = phrase.indexOf('.');
          const pf = di >= 0 ? phrase.slice(0, di + 1) : phrase;
          const pr = di >= 0 ? phrase.slice(di + 1).trim() : '';
          return `<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--line);">
            <div style="font-size:8.5px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:9px;">PAST 7 DAYS</div>
            <div style="display:flex;justify-content:space-between;gap:2px;">${cols}</div>
            <div style="margin-top:9px;font-size:11px;color:var(--ink-muted);font-style:italic;line-height:1.5;">
              <span style="color:var(--ink);">${escapeHtml(pf)}</span>${pr ? ' ' + escapeHtml(pr) : ''}
            </div>
          </div>`;
        })()}
      </div>
    `;
  }

  // ─── WEIGHED card
  // v3.3.3: build weight trend once, shared by both card states
  const _wEntries = weightTrendData(14);
  const _weightTrendSection = (() => {
    if (_wEntries.length < 2) {
      return `<div style="margin-top:10px;font-size:11px;color:var(--ink-faint);font-style:italic;">Not enough weigh-ins yet.</div>`;
    }
    const phrase = weightSummaryPhrase(_wEntries);
    return `<div style="margin-top:12px;padding-top:10px;border-top:0.5px solid var(--line);">
      <div style="font-size:8.5px;letter-spacing:0.16em;color:var(--ink-faint);font-weight:500;margin-bottom:8px;">RECENT TREND</div>
      ${weightTrendLineSVG(_wEntries)}
      <div style="margin-top:6px;font-size:11px;color:var(--ink-faint);font-style:italic;">${escapeHtml(phrase)}</div>
    </div>`;
  })();
  let weighedCard;
  if (todayWeight) {
    weighedCard = `
      <div class="pulse-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:6px;">WEIGHED</div>
            <div style="display:flex;align-items:baseline;gap:6px;">
              <div style="font-family:'Fraunces',serif;font-size:24px;color:var(--ink);font-weight:400;letter-spacing:-0.015em;">${todayWeight.weight_kg}</div>
              <div style="font-family:'Fraunces',serif;font-size:13px;color:var(--ink-muted);">kg</div>
            </div>
          </div>
          <button onclick="pulseEditWeight()" style="background:none;border:0.5px solid var(--line);border-radius:12px;color:var(--ink-muted);font-family:inherit;font-size:11px;cursor:pointer;padding:5px 12px;">edit</button>
        </div>
        ${_weightTrendSection}
      </div>
    `;
  } else {
    weighedCard = `
      <button onclick="pulseEditWeight()" class="pulse-card pulse-card-empty">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
          <div style="text-align:left;">
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:6px;">WEIGHED</div>
            <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);">Not yet logged.</div>
            ${lastWeight ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:11px;color:var(--ink-faint);margin-top:2px;">Last: ${lastWeight.weight_kg}kg</div>` : ''}
          </div>
          <div class="pulse-log-btn">+ log</div>
        </div>
        ${_weightTrendSection}
      </button>
    `;
  }

  // ─── FELT card
  let feltCard;
  if (todayMood) {
    const moodLabels = { 1:'heavy', 2:'low', 3:'steady', 4:'good', 5:'bright' };
    feltCard = `
      <div class="pulse-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:28px;height:28px;color:var(--brass);">${moodFaceSVG(todayMood.score)}</div>
            <div>
              <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:4px;">FELT</div>
              <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--ink);text-transform:capitalize;line-height:1;">${moodLabels[todayMood.score]}</div>
            </div>
          </div>
          <button onclick="pulseEditMood()" style="background:none;border:0.5px solid var(--line);border-radius:12px;color:var(--ink-muted);font-family:inherit;font-size:11px;cursor:pointer;padding:5px 12px;">edit</button>
        </div>
      </div>
    `;
  } else {
    feltCard = `
      <div class="pulse-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div>
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:6px;">FELT</div>
            <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);">How does the body feel?</div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:6px;">
          ${[1,2,3,4,5].map(s => `
            <button onclick="pulseSetMood(${s})" style="flex:1;padding:12px 0;background:var(--surface-2);border:0.5px solid var(--line);border-radius:10px;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;">
              <div style="width:22px;height:22px;">${moodFaceSVG(s)}</div>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  // ─── PAST 7 NIGHTS sleep sparkline
  let sparkBlock = '';
  if (sparkVals.length >= 2) {
    const firstWithDataIdx = spark7.findIndex(d => typeof d.h === 'number');
    const firstDay = firstWithDataIdx >= 0 ? spark7[firstWithDataIdx].iso : spark7[0].iso;
    const fd = new Date(firstDay + 'T12:00:00');
    const startLabel = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][fd.getDay()];
    const isSparse = sparkVals.length < 4;
    const middleLabel = isSparse
      ? `<span style="font-family:'Fraunces',serif;font-style:italic;color:var(--ink-muted);">${sparkVals.length} ${sparkVals.length === 1 ? 'night' : 'nights'} logged</span>`
      : sparkAvg
        ? `<span style="font-family:'Fraunces',serif;font-style:italic;color:var(--ink-muted);">7-day avg \u00b7 ${fmtSleepHours(parseFloat(sparkAvg))}</span>`
        : '';
    sparkBlock = `
      <div class="pulse-card" style="margin-top:0;">
        <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:12px;">PAST 7 NIGHTS · SLEEP</div>
        ${pulseSleepSparklineSVG(spark7)}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-faint);">
          <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;">${startLabel}</span>
          ${middleLabel}
          <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;color:var(--ink);">today</span>
        </div>
      </div>
    `;
  }

  // ─── PAST 7 DAYS recovery sparkline (v3.2.2)
  let recoverySparkBlock = '';
  const recoveryVals = recovery7.map(d => d.score).filter(s => typeof s === 'number');
  if (recoveryVals.length >= 2) {
    const recovAvg = Math.round(recoveryVals.reduce((a,b)=>a+b,0) / recoveryVals.length);
    const firstRecovIdx = recovery7.findIndex(d => typeof d.score === 'number');
    const firstRecovDay = firstRecovIdx >= 0 ? recovery7[firstRecovIdx].iso : recovery7[0].iso;
    const frd = new Date(firstRecovDay + 'T12:00:00');
    const recovStartLabel = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][frd.getDay()];
    recoverySparkBlock = `
      <div class="pulse-card" style="margin-top:0;">
        <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:12px;">PAST 7 DAYS · RECOVERY</div>
        ${pulseRecoverySparklineSVG(recovery7)}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-faint);">
          <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;">${recovStartLabel}</span>
          <span style="font-family:'Fraunces',serif;font-style:italic;color:var(--ink-muted);">7-day avg \u00b7 ${recovAvg}</span>
          <span style="font-family:'Inter',sans-serif;letter-spacing:0.02em;color:var(--ink);">today</span>
        </div>
      </div>
    `;
  }

  openOverlay(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <button onclick="closeOverlay()" style="background:none;border:none;color:var(--accent-bright);font-family:inherit;font-size:13px;cursor:pointer;padding:0;">\u2039 Today</button>
    </div>
    <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:8px;">PULSE \u00b7 TODAY</div>
    <div style="font-family:'Fraunces',serif;font-size:28px;color:var(--ink);font-weight:400;letter-spacing:-0.02em;line-height:1.1;margin-bottom:10px;">The body, listening.</div>
    ${subtitle}

    ${sleptCard}
    ${recoveryCard}
    ${weighedCard}
    ${feltCard}
    ${moodTrendCardHTML(7)}
    ${/* v3.3.3: sleep/recovery 7-day rhythm now inside the SLEPT and RECOVERY cards above */''}
    ${(() => {
      // v3.2.0 — Mind card: tone history + topics from last 7 examens
      const last7 = [...(state.examens || [])]
        .filter(e => e.completed_at && !e.skipped_entirely)
        .sort((a, b) => new Date(b.completed_at).getTime() - new Date(a.completed_at).getTime())
        .slice(0, 7);
      if (!last7.length) return '';
      const withTone = last7.filter(e => e.tone);
      if (!withTone.length) return ''; // no tone data yet — don't show empty card
      // Overall tone phrase: most common tone category
      const greenWords = ['settled','grounded','open','grateful','light','peaceful','clear'];
      const clayWords  = ['tired','scattered','anxious','heavy','tense','overwhelmed'];
      const toneCounts = { green: 0, clay: 0, brass: 0 };
      withTone.forEach(e => {
        if (greenWords.some(w => (e.tone||'').includes(w))) toneCounts.green++;
        else if (clayWords.some(w => (e.tone||'').includes(w))) toneCounts.clay++;
        else toneCounts.brass++;
      });
      const dominant = Object.entries(toneCounts).sort((a,b)=>b[1]-a[1])[0][0];
      const overallPhrase = dominant === 'green' ? 'mostly settled'
                          : dominant === 'clay'  ? 'carrying some weight'
                          : 'somewhere in between';
      const overallColor = dominant === 'green' ? 'var(--accent-bright)'
                         : dominant === 'clay'  ? 'var(--clay)'
                         : 'var(--brass)';
      // Topics: flatten + dedupe + sort by frequency
      const topicCounts = {};
      last7.forEach(e => (e.topics || []).forEach(t => { topicCounts[t] = (topicCounts[t]||0)+1; }));
      const topTopics = Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t])=>t);
      // Tone bars — oldest left, newest right (reverse of sorted order)
      const barsData = last7.slice().reverse(); // oldest → newest
      const barHeights = [10,14,8,18,16,12,20]; // use index-based heights for consistency
      const bars = barsData.map((e, i) => {
        const col = e.tone ? toneWordColor(e.tone) : 'rgba(237,230,216,0.08)';
        const h = e.tone ? barHeights[i % barHeights.length] : 6;
        return `<div style="flex:1;background:${col};border-radius:2px;opacity:0.65;height:${h}px;align-self:flex-end;"></div>`;
      }).join('');
      return `
        <div class="pulse-card" style="margin-top:0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;">MIND · THIS WEEK</div>
            <span style="font-family:'Fraunces',serif;font-style:italic;font-size:10px;color:${overallColor};background:${dominant==='green'?'rgba(78,141,111,0.1)':dominant==='clay'?'rgba(196,122,99,0.1)':'rgba(200,155,106,0.1)'};border:0.5px solid ${dominant==='green'?'rgba(78,141,111,0.25)':dominant==='clay'?'rgba(196,122,99,0.25)':'rgba(200,155,106,0.25)'};border-radius:999px;padding:2px 9px;">${overallPhrase}</span>
          </div>
          <div style="display:flex;gap:3px;height:22px;align-items:flex-end;margin-bottom:8px;">
            ${bars}
          </div>

function saveChapter(chapterId, isNew) {
  const title = (document.getElementById('chapter-title')?.value || '').trim();
  const start = (document.getElementById('chapter-start')?.value || '').trim();
  const end = (document.getElementById('chapter-end')?.value || '').trim();
  const note = (document.getElementById('chapter-note')?.value || '').trim();
  if (!title) { toast('Name the chapter'); return; }
  if (!start || !/^\d{4}-\d{2}-\d{2}$/.test(start)) { toast('Pick a start date'); return; }
  if (end && !/^\d{4}-\d{2}-\d{2}$/.test(end)) { toast('End date looks off'); return; }
  if (isNew || !chapterId) {
    state.chapters.push({
      id: uid(), title, start_date: start, end_date: end || null, note, color: null,
      pinned_examen_ids: [],
      pinned_capture_ids: [],
      pinned_touch_ids: [],
      reflection_text: '',
      reflection_completed_at: null,
    });
  } else {
    const c = state.chapters.find(x => x.id === chapterId);
    if (!c) return;
    c.title = title;
    c.start_date = start;
    c.end_date = end || null;
    c.note = note;
    // v2.10: ensure pinned arrays exist on legacy chapters
    if (!Array.isArray(c.pinned_examen_ids)) c.pinned_examen_ids = [];
    if (!Array.isArray(c.pinned_capture_ids)) c.pinned_capture_ids = [];
    if (!Array.isArray(c.pinned_touch_ids)) c.pinned_touch_ids = [];
    if (typeof c.reflection_text !== 'string') c.reflection_text = '';
    if (!c.reflection_completed_at) c.reflection_completed_at = null;
  }
  saveState();
  closeOverlay();
  render();
  toast(isNew ? 'Chapter opened' : 'Saved');
}

async function deleteChapter(chapterId) {
  const c = state.chapters.find(x => x.id === chapterId);
  if (!c) return;
  const ok = await kuzuriConfirm({
    title: `Remove \u201C${c.title}\u201D?`,
    body: 'This doesn\u2019t delete any of your entries — just the chapter marker.',
    confirmLabel: 'Remove',
    cancelLabel: 'Keep',
    tone: 'danger',
  });
  if (!ok) return;
  state.chapters = state.chapters.filter(x => x.id !== chapterId);
  saveState();
  closeOverlay();
  render();
  toast('Removed');
}

// v2.12.1 — WEEK / MONTH / YEAR DIFFERENTIATION POLISH
// Small generated-prose additions per segment to give each scale its own voice.
// ═══════════════════════════════════════════════════════════════════════

// "This week's noise" — a short rhythm observation for the Week segment
function weekNoiseHTML() {
  const now = Date.now();
  const sevenDaysAgo = now - 7 * 86400000;
  const inWindow = (ts) => {
    if (!ts) return false;
    const t = new Date(ts).getTime();
    return t >= sevenDaysAgo && t <= now;
  };
  const captureCount = (state.captures || []).filter(c => inWindow(c.ts)).length;
  const examenCount = (state.examens || []).filter(e => inWindow(e.completed_at)).length;
  const touchCount = (state.people || []).reduce((sum, p) => sum + ((p.touches || []).filter(t => inWindow(t.ts)).length), 0);
  const workoutCount = (state.workouts || []).filter(w => inWindow(w.ts)).length;

  const total = captureCount + examenCount + touchCount + workoutCount;
  if (total === 0) return '';

  let text;
  if (total <= 3) {
    text = `A still week. Only ${total === 1 ? 'a single mark' : `${total} marks`} on the page.`;
  } else if (total >= 20) {
    const parts = [];
    if (examenCount) parts.push(`${examenCount} ${examenCount === 1 ? 'examen' : 'examens'}`);
    if (captureCount) parts.push(`${captureCount} ${captureCount === 1 ? 'thought' : 'thoughts'}`);
    if (touchCount) parts.push(`${touchCount} ${touchCount === 1 ? 'touch' : 'touches'}`);
    if (workoutCount) parts.push(`${workoutCount} ${workoutCount === 1 ? 'lift' : 'lifts'}`);
    text = `A talkative week — ${parts.join(', ')}.`;
  } else {
    const parts = [];
    if (examenCount >= 5) parts.push('the examens held');
    if (captureCount >= 3) parts.push('thoughts kept landing');
    if (touchCount >= 3) parts.push('the people stayed close');
    if (workoutCount >= 3) parts.push('training carried');
    if (parts.length === 0) parts.push('a quiet rhythm');
    text = `A working week. ${parts.join(', ')}.`;
    text = text.charAt(0).toUpperCase() + text.slice(1);
    // Capitalize after period
    text = text.replace(/\. ([a-z])/, (m, l) => '. ' + l.toUpperCase());
  }

  return `
    <div style="margin:14px 0 8px;padding:14px 16px;background:var(--surface-2);border:0.5px solid var(--line);border-radius:12px;">
      <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:6px;">THIS WEEK'S NOISE</div>
      <div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink);line-height:1.55;">${escapeHtml(text)}</div>
    </div>
  `;
}

// "Themes that emerged" — a paragraph reading the dominant themes for Month
function monthThemesProseHTML() {
  // Count theme/tag frequency from examens in the last 30 days
  const now = Date.now();
  const cutoff = now - 30 * 86400000;
  const counts = {};
  for (const e of (state.examens || [])) {
    if (!e.completed_at) continue;
    const t = new Date(e.completed_at).getTime();
    if (t < cutoff) continue;
    const themes = tagsFor(e);
    for (const th of themes) {
      const k = String(th).toLowerCase().trim();
      if (!k) continue;
      counts[k] = (counts[k] || 0) + 1;
    }
    // Also pull #tags from text
    const text = [(e.went_well || ''), (e.went_poorly || ''), (e.remains || '')].join(' ');
    const tagRe = /#(\w+)/g;
    let m;
    while ((m = tagRe.exec(text)) !== null) {
      const k = m[1].toLowerCase();
      counts[k] = (counts[k] || 0) + 1;
    }
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (sorted.length === 0) return '';

  const top = sorted[0];
  let text;
  if (sorted.length === 1) {
    text = `One theme ran through this month: ${top[0]}.`;
  } else if (top[1] >= sorted[1][1] * 2) {
    // Top dominates
    text = `${top[0].charAt(0).toUpperCase() + top[0].slice(1)} ran through often this month — twice as much as anything else.`;
  } else if (sorted.length >= 3 && Math.abs(sorted[0][1] - sorted[2][1]) <= 1) {
    // Three roughly tied
    text = `Three themes wove through: ${sorted[0][0]}, ${sorted[1][0]}, ${sorted[2][0]}. None dominated.`;
  } else {
    text = `${top[0].charAt(0).toUpperCase() + top[0].slice(1)} led, with ${sorted[1][0]} close behind.`;
  }

  return `
    <div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink-muted);line-height:1.55;margin:14px 0 4px;">${escapeHtml(text)}</div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════
// v2.12.2 — MONTHLY RECAP LETTER
// A short generated paragraph at the end of Life→Month, written in your
// own voice. Templates only — no AI, no generation API.
// ═══════════════════════════════════════════════════════════════════════

// Get the date range for "this month" — calendar month containing today.
function thisMonthRange() {
  const now = new Date();
  const yr = now.getFullYear();
  const mo = now.getMonth();
  const start = new Date(yr, mo, 1);
  const end = new Date(yr, mo + 1, 0);  // last day of month
  const today = new Date();
  const isComplete = today.getDate() === end.getDate() && today.getMonth() === mo;
  return {
    startISO: start.toISOString().slice(0, 10),
    endISO: end.toISOString().slice(0, 10),
    monthName: start.toLocaleDateString('en', { month: 'long' }),
    year: yr,
    isComplete,
    dayOfMonth: today.getDate(),
    daysInMonth: end.getDate(),
  };
}

function monthlyRecapLetterHTML() {
  const range = thisMonthRange();
  const inMonth = (iso) => iso >= range.startISO && iso <= range.endISO;
  const inMonthTs = (ts) => {
    if (!ts) return false;
    const iso = new Date(ts).toISOString().slice(0, 10);
    return inMonth(iso);
  };

  // Gather counts
  const examens = (state.examens || []).filter(e => e.completed_at && inMonthTs(e.completed_at));
  const captures = (state.captures || []).filter(c => inMonthTs(c.ts));
  const workouts = (state.workouts || []).filter(w => inMonthTs(w.ts));
  const habits = (state.habits || []).filter(h => !h.retired_at);

  // Need at least *some* signal to write a letter
  const totalSignals = examens.length + captures.length + workouts.length;
  if (totalSignals < 3) return '';

  const isPast = !range.isComplete && range.dayOfMonth >= range.daysInMonth;
  const partial = !range.isComplete && range.dayOfMonth < range.daysInMonth;

  // ── Sentence 1: quantity
  const quantBits = [];
  if (examens.length) quantBits.push(`${examens.length} ${examens.length === 1 ? 'examen' : 'examens'}`);
  if (captures.length) quantBits.push(`${captures.length} ${captures.length === 1 ? 'thought' : 'thoughts'}`);
  if (workouts.length) quantBits.push(`${workouts.length} ${workouts.length === 1 ? 'lift' : 'lifts'}`);

  let openingLine;
  if (partial) {
    openingLine = `So far this ${range.monthName}, you've written ${quantBits.join(', ')}.`;
  } else {
    openingLine = `${range.monthName} closed. You wrote ${quantBits.join(', ')}.`;
  }

  // ── Sentence 2: themes
  let themesLine = '';
  const counts = {};
  for (const e of examens) {
    for (const th of tagsFor(e)) {
      const k = String(th).toLowerCase().trim();
      if (!k) continue;
      counts[k] = (counts[k] || 0) + 1;
    }
    const text = [(e.went_well || ''), (e.went_poorly || ''), (e.remains || '')].join(' ');
    const tagRe = /#(\w+)/g;
    let m;
    while ((m = tagRe.exec(text)) !== null) {
      const k = m[1].toLowerCase();
      counts[k] = (counts[k] || 0) + 1;
    }
  }
  const sortedThemes = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (sortedThemes.length >= 2) {
    const top = sortedThemes.slice(0, 3).map(([t]) => t);
    if (top.length === 3) {
      themesLine = `Three themes ran through: ${top[0]}, ${top[1]}, ${top[2]}.`;
    } else {
      themesLine = `The themes were ${top.join(' and ')}.`;
    }
  } else if (sortedThemes.length === 1) {
    themesLine = `One theme ran through: ${sortedThemes[0][0]}.`;
  }

  // ── Sentence 3: habits + chapters
  const closedChapters = (state.chapters || []).filter(c => c.end_date && inMonth(c.end_date));
  const openedChapters = (state.chapters || []).filter(c => c.start_date && inMonth(c.start_date));
  let chapterLine = '';
  if (closedChapters.length && openedChapters.length) {
    const closing = closedChapters[0];
    chapterLine = `You closed "${closing.title}"${openedChapters.length === 1 ? ` and opened "${openedChapters[0].title}".` : ' and opened a new one.'}`;
  } else if (closedChapters.length) {
    chapterLine = `You closed "${closedChapters[0].title}".`;
  } else if (openedChapters.length === 1) {
    chapterLine = `You opened the chapter "${openedChapters[0].title}".`;
  }

  // Habit observation — was at least one habit held with strength?
  let habitLine = '';
  if (habits.length) {
    // For each habit, count days held within the month
    const habitStrengths = habits.map(h => {
      const possibleDays = (() => {
        if (h.cadence === 'weekly') return Math.ceil((new Date(range.endISO).getDate()) / 7);
        if (h.cadence === 'weekdays') {
          let count = 0;
          for (let d = 1; d <= range.daysInMonth; d++) {
            const dt = new Date(range.year, new Date(range.startISO).getMonth(), d);
            const dow = dt.getDay();
            if (dow >= 1 && dow <= 5) count++;
          }
          return count;
        }
        return range.daysInMonth;
      })();
      const distinct = new Set(
        (state.habitLogs || [])
          .filter(l => l.habit_id === h.id && inMonth(l.date_iso))
          .map(l => l.date_iso)
      ).size;
      const ratio = distinct / Math.max(1, possibleDays);
      return { h, distinct, possibleDays, ratio };
    });
    const strongest = habitStrengths.filter(x => x.ratio >= 0.66).sort((a, b) => b.ratio - a.ratio)[0];
    const allHeld = habitStrengths.length > 0 && habitStrengths.every(x => x.ratio >= 0.66);
    if (allHeld && habitStrengths.length >= 3) {
      habitLine = `The practices held — every one of them.`;
    } else if (strongest) {
      habitLine = `${strongest.h.title} held the most steadily — ${strongest.distinct} of ${strongest.possibleDays} ${strongest.h.cadence === 'weekly' ? 'weeks' : 'days'}.`;
    } else if (habitStrengths.some(x => x.ratio < 0.3)) {
      const weak = habitStrengths.find(x => x.ratio < 0.3);
      habitLine = `${weak.h.title} thinned this month.`;
    }
  }

  // ── Sentence 4: tone (mood + sleep average)
  let toneLine = '';
  const moods = (state.moods || []).filter(m => inMonthTs(m.ts));
  const sleeps = (state.sleep || []).filter(s => inMonth(s.date));
  if (moods.length >= 5) {
    const avg = moods.reduce((s, m) => s + (m.score || 0), 0) / moods.length;
    if (avg >= 4) toneLine = `The month felt bright. Mood averaged ${avg.toFixed(1)} of 5.`;
    else if (avg >= 3.3) toneLine = `The month felt steady. Mood averaged ${avg.toFixed(1)} of 5.`;
    else if (avg >= 2.5) toneLine = `The month felt mixed. Mood averaged ${avg.toFixed(1)} of 5.`;
    else toneLine = `The month felt heavy. Mood averaged ${avg.toFixed(1)} of 5.`;
  } else if (sleeps.length >= 5) {
    const sleepAvg = sleeps.reduce((s, x) => s + (x.duration_h || 0), 0) / sleeps.length;
    if (sleepAvg < 6.5) toneLine = `Sleep ran short — averaging ${sleepAvg.toFixed(1)}h.`;
    else if (sleepAvg >= 7.5) toneLine = `Sleep held — averaging ${sleepAvg.toFixed(1)}h.`;
  }

  // ── Sentence 5: closing question
  let closingLine;
  if (partial) {
    const daysLeft = range.daysInMonth - range.dayOfMonth;
    closingLine = `${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left in ${range.monthName}. What does it want?`;
  } else if (openedChapters.length) {
    closingLine = `What does the new chapter want?`;
  } else if (closedChapters.length) {
    closingLine = `What carries forward?`;
  } else {
    closingLine = `What ends here? What carries forward?`;
  }

  // Assemble — only include lines that exist
  const lines = [openingLine, themesLine, chapterLine, habitLine, toneLine, closingLine].filter(Boolean);

  return `
    <div class="section-h" style="margin-top:32px;">${partial ? 'This month, so far' : `${range.monthName}, in a paragraph`}</div>
    <div style="position:relative;background:rgba(200,155,106,0.04);border:0.5px solid var(--brass-dim);border-radius:12px;padding:18px 18px 18px 22px;margin-top:6px;">
      <div style="position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--brass);border-radius:1px;"></div>
      ${lines.map(l => `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink);line-height:1.6;margin-bottom:6px;">${escapeHtml(l)}</div>`).join('')}
    </div>
  `;
}

// v2.12.2 — Returns info about the previous month if its recap is worth showing
// on Today as a banner. Shows in days 1-3 of the new month if previous had data.
function previousMonthRecapInfo() {
  const now = new Date();
  const dayOfMonth = now.getDate();
  if (dayOfMonth > 3) return null;  // only first 3 days of new month

  const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 15);
  const prevYr = prevMonth.getFullYear();
  const prevMo = prevMonth.getMonth();
  const startISO = new Date(prevYr, prevMo, 1).toISOString().slice(0, 10);
  const endISO = new Date(prevYr, prevMo + 1, 0).toISOString().slice(0, 10);
  const inPrev = (iso) => iso >= startISO && iso <= endISO;
  const inPrevTs = (ts) => {
    if (!ts) return false;
    const iso = new Date(ts).toISOString().slice(0, 10);
    return inPrev(iso);
  };

  const examenCount = (state.examens || []).filter(e => e.completed_at && inPrevTs(e.completed_at)).length;
  const captureCount = (state.captures || []).filter(c => inPrevTs(c.ts)).length;
  const workoutCount = (state.workouts || []).filter(w => inPrevTs(w.ts)).length;
  const totalSignals = examenCount + captureCount + workoutCount;
  if (totalSignals < 5) return null;  // not enough to warrant a banner

  const monthName = prevMonth.toLocaleDateString('en', { month: 'long' });
  const key = `${prevYr}-${String(prevMo + 1).padStart(2, '0')}`;
  return { key, monthName, year: prevYr, monthIndex: prevMo };
}

function openMonthlyRecapFromBanner() {
  // Switch to Life → Month so the recap letter is visible
  switchTab('life');
  setTimeout(() => {
    setReviewSegment('month');
    // Scroll to the recap section after render
    setTimeout(() => {
      const screen = document.getElementById('screen-life');
      if (screen) {
        // Find the section header containing "in a paragraph" or "so far"
        const headers = screen.querySelectorAll('.section-h');
        for (const h of headers) {
          const txt = (h.textContent || '').toLowerCase();
          if (txt.includes('paragraph') || txt.includes('so far')) {
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
          }
        }
      }
    }, 200);
  }, 100);
}

function dismissMonthlyRecap(key) {
  state._monthly_recap_dismissed_for = key;
  saveState();
  render();
}

// "What changed this year" — high-level deltas for the Year segment
function yearChangedHTML() {
  const now = Date.now();
  const yearAgo = now - 365 * 86400000;
  const inWindow = (ts) => {
    if (!ts) return false;
    const t = new Date(ts).getTime();
    return t >= yearAgo && t <= now;
  };

  const lines = [];

  // Body weight delta
  const weights = (state.weights || []).filter(w => w.ts).sort((a, b) => new Date(a.ts).getTime() - new Date(b.ts).getTime());
  if (weights.length >= 2) {
    const earliestInWindow = weights.find(w => inWindow(w.ts));
    const latest = weights[weights.length - 1];
    if (earliestInWindow && latest && earliestInWindow !== latest) {
      const delta = latest.weight_kg - earliestInWindow.weight_kg;
      const sign = delta > 0 ? '+' : '';
      const absDelta = Math.abs(delta).toFixed(1);
      if (absDelta > 0.5) {
        lines.push(`You weighed ${sign}${delta.toFixed(1)} kg compared to a year ago.`);
      } else {
        lines.push(`Your weight stayed roughly the same.`);
      }
    }
  }

  // People added in the year
  const peopleAdded = (state.people || []).filter(p => inWindow(p.created_at)).length;
  if (peopleAdded > 0) {
    lines.push(`You met ${peopleAdded} new ${peopleAdded === 1 ? 'person' : 'people'}.`);
  }

  // Chapters opened/closed this year
  const chaptersOpenedThisYear = (state.chapters || []).filter(c => {
    if (!c.start_date) return false;
    const t = new Date(c.start_date + 'T12:00:00').getTime();
    return t >= yearAgo && t <= now;
  }).length;
  const chaptersClosedThisYear = (state.chapters || []).filter(c => {
    if (!c.end_date) return false;
    const t = new Date(c.end_date + 'T12:00:00').getTime();
    return t >= yearAgo && t <= now;
  }).length;
  if (chaptersOpenedThisYear || chaptersClosedThisYear) {
    if (chaptersOpenedThisYear === chaptersClosedThisYear && chaptersClosedThisYear > 0) {
      lines.push(`You opened and closed ${chaptersClosedThisYear} ${chaptersClosedThisYear === 1 ? 'chapter' : 'chapters'}.`);
    } else if (chaptersClosedThisYear > 0 && chaptersOpenedThisYear > chaptersClosedThisYear) {
      lines.push(`You closed ${chaptersClosedThisYear} ${chaptersClosedThisYear === 1 ? 'chapter' : 'chapters'} and opened ${chaptersOpenedThisYear}.`);
    } else if (chaptersOpenedThisYear > 0) {
      lines.push(`You opened ${chaptersOpenedThisYear} ${chaptersOpenedThisYear === 1 ? 'chapter' : 'chapters'}.`);
    } else if (chaptersClosedThisYear > 0) {
      lines.push(`You closed ${chaptersClosedThisYear} ${chaptersClosedThisYear === 1 ? 'chapter' : 'chapters'}.`);
    }
  }

  if (lines.length === 0) return '';

  return `
    <div style="margin:18px 0 8px;padding:16px 18px;background:var(--surface-2);border:0.5px solid var(--line);border-radius:12px;">
      <div style="font-size:9.5px;letter-spacing:0.16em;color:var(--ink-muted);font-weight:500;margin-bottom:8px;">WHAT CHANGED THIS YEAR</div>
      ${lines.map(l => `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:4px;">${escapeHtml(l)}</div>`).join('')}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════
// v2.11.1 — LIFE → HABITS LONG VIEW
// ═══════════════════════════════════════════════════════════════════════

// Window for the habits view: 28 days (4 weeks) — same shape across all habits regardless of cadence.
const HABITS_VIEW_DAYS = 28;

// Build an array of N most-recent ISO dates, oldest-first.
function lastNDates(n) {
  const out = [];
  const today = new Date(todayISO() + 'T12:00:00');
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}

// Cell density for a habit on a given date (0 = none, 1-4 levels of brass).
// For binary habits: 0 or 4. For count habits: scaled by completion ratio.
function habitCellDensity(habit, dateISO) {
  const logs = (state.habitLogs || []).filter(l => l.habit_id === habit.id && l.date_iso === dateISO);
  if (!logs.length) return 0;
  const count = logs.reduce((s, l) => s + (l.count || 1), 0);
  const need = habit.count_per_day || 1;
  if (need === 1) return count >= 1 ? 4 : 0;
  const ratio = count / need;
  if (ratio >= 1)    return 4;
  if (ratio >= 0.66) return 3;
  if (ratio >= 0.33) return 2;
  return 1;
}

// Color for a density level (0-4)
function densityColor(level) {
  // v3.2.4: use green (accent) matching the Month tab's habit color direction.
  // Solid enough to be visible on both light (#F4EEDF) and dark (#14110E) backgrounds.
  if (level === 0) return 'var(--surface-2)';
  if (level === 1) return 'rgba(62,122,94,0.35)';   // dim green
  if (level === 2) return 'rgba(62,122,94,0.60)';   // mid green
  if (level === 3) return 'rgba(62,122,94,0.82)';   // strong green
  return 'var(--accent-bright)';                    // level 4 — full accent
}

// Render a daily-cadence grid: 4 rows of 7 cells each, oldest-first across rows.
function dailyHabitGridHTML(habit) {
  const dates = lastNDates(HABITS_VIEW_DAYS);
  const cellSize = 34;
  const gap = 4;
  let cells = '';
  // Display: 4 rows × 7 cols. Oldest week on top, current week on bottom (with "this week" label).
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 7; col++) {
      const idx = row * 7 + col;
      const iso = dates[idx];
      if (!iso) continue;
      const isToday = iso === todayISO();
      const density = habitCellDensity(habit, iso);
      const fill = densityColor(density);
      const x = col * (cellSize + gap);
      const y = row * (cellSize / 2.4 + gap);
      cells += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize / 2.4}" rx="3" fill="${fill}"${isToday ? ' stroke="var(--brass)" stroke-width="0.6"' : ''}/>`;
    }
  }
  const totalW = 7 * cellSize + 6 * gap;
  const totalH = 4 * (cellSize / 2.4 + gap);
  return `
    <div style="display:flex;align-items:center;gap:8px;font-size:8.5px;color:var(--ink-faint);letter-spacing:0.06em;margin-bottom:6px;font-family:'Inter',sans-serif;">
      <span>M</span><span style="margin-left:${cellSize - 5}px;">T</span><span style="margin-left:${cellSize - 5}px;">W</span><span style="margin-left:${cellSize - 5}px;">T</span><span style="margin-left:${cellSize - 5}px;">F</span><span style="margin-left:${cellSize - 5}px;">S</span><span style="margin-left:${cellSize - 5}px;">S</span>
    </div>
    <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="display:block;">${cells}</svg>
  `;
}

// Render a weekdays-cadence grid: 4 rows of 5 cells (Mon-Fri only).
function weekdaysHabitGridHTML(habit) {
  const dates = lastNDates(HABITS_VIEW_DAYS);
  // Filter to Mon-Fri only
  const weekdayDates = dates.filter(iso => {
    const dow = new Date(iso + 'T12:00:00').getDay();
    return dow >= 1 && dow <= 5;
  });
  const cellSize = 50;
  const gap = 5;
  let cells = '';
  for (let i = 0; i < weekdayDates.length; i++) {
    const iso = weekdayDates[i];
    const isToday = iso === todayISO();
    const density = habitCellDensity(habit, iso);
    const fill = densityColor(density);
    const row = Math.floor(i / 5);
    const col = i % 5;
    const x = col * (cellSize + gap);
    const y = row * (cellSize / 2.4 + gap);
    cells += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize / 2.4}" rx="3" fill="${fill}"${isToday ? ' stroke="var(--brass)" stroke-width="0.6"' : ''}/>`;
  }
  const totalRows = Math.ceil(weekdayDates.length / 5);
  const totalW = 5 * cellSize + 4 * gap;
  const totalH = totalRows * (cellSize / 2.4 + gap);
  return `
    <div style="display:flex;align-items:center;gap:8px;font-size:8.5px;color:var(--ink-faint);letter-spacing:0.06em;margin-bottom:6px;font-family:'Inter',sans-serif;">
      <span>M</span><span style="margin-left:${cellSize - 5}px;">T</span><span style="margin-left:${cellSize - 5}px;">W</span><span style="margin-left:${cellSize - 5}px;">T</span><span style="margin-left:${cellSize - 5}px;">F</span>
    </div>
    <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="display:block;">${cells}</svg>
  `;
}

// Render a weekly-cadence grid: single horizontal track of 4 wider cells (4 weeks).
function weeklyHabitGridHTML(habit) {
  // Compute the last 4 weeks (Sunday-start). For each, check if any log exists in that week.
  const today = new Date(todayISO() + 'T12:00:00');
  const dow = today.getDay();
  const thisWeekStart = new Date(today);
  thisWeekStart.setDate(today.getDate() - dow);

  const weeks = [];
  for (let w = 3; w >= 0; w--) {
    const weekStart = new Date(thisWeekStart);
    weekStart.setDate(thisWeekStart.getDate() - w * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const startISO = weekStart.toISOString().slice(0, 10);
    const endISO = weekEnd.toISOString().slice(0, 10);
    const hasLog = (state.habitLogs || []).some(l => l.habit_id === habit.id && l.date_iso >= startISO && l.date_iso <= endISO);
    weeks.push({ startISO, endISO, hasLog, isCurrent: w === 0 });
  }

  const cellW = 78;
  const cellH = 26;
  const gap = 8;
  let cells = '';
  weeks.forEach((wk, i) => {
    const x = i * (cellW + gap);
    const fill = wk.hasLog ? 'var(--brass)' : 'var(--surface-2)';
    const stroke = wk.isCurrent && !wk.hasLog ? 'stroke="var(--brass-dim)" stroke-width="0.6" stroke-dasharray="3 2"' : '';
    cells += `<rect x="${x}" y="0" width="${cellW}" height="${cellH}" rx="6" fill="${fill}" ${stroke}/>`;
  });
  const totalW = 4 * cellW + 3 * gap;
  return `<svg width="${totalW}" height="${cellH}" viewBox="0 0 ${totalW} ${cellH}" style="display:block;">${cells}</svg>`;
}

// Generate observation prose for a habit based on its 28-day pattern.
function habitObservationProse(habit) {
  const dates = lastNDates(HABITS_VIEW_DAYS);
  const recentDates = dates.slice(-7);   // last 7 days
  const olderDates  = dates.slice(0, 7); // first 7 days of window (3 weeks ago)

  const recentDone = recentDates.filter(d => habitCellDensity(habit, d) > 0).length;
  const olderDone  = olderDates.filter(d => habitCellDensity(habit, d) > 0).length;
  const totalDone  = dates.filter(d => habitCellDensity(habit, d) > 0).length;
  const ratio      = totalDone / dates.length;

  // Weekly habits use a different prose
  if (habit.cadence === 'weekly') {
    const today = new Date(todayISO() + 'T12:00:00');
    const dow = today.getDay();
    const thisWeekStart = new Date(today);
    thisWeekStart.setDate(today.getDate() - dow);
    let weeksDone = 0;
    for (let w = 0; w < 4; w++) {
      const weekStart = new Date(thisWeekStart);
      weekStart.setDate(thisWeekStart.getDate() - w * 7);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const startISO = weekStart.toISOString().slice(0, 10);
      const endISO = weekEnd.toISOString().slice(0, 10);
      if ((state.habitLogs || []).some(l => l.habit_id === habit.id && l.date_iso >= startISO && l.date_iso <= endISO)) weeksDone++;
    }
    if (weeksDone === 4) return `Held all four weeks. The rhythm is steady.`;
    if (weeksDone === 3) return `Three of the last four weeks. Mostly held.`;
    if (weeksDone === 2) return `Two of the last four. The rhythm is uncertain.`;
    if (weeksDone === 1) return `Once in four weeks. Worth choosing it again.`;
    return `Quiet for a month. Worth a return.`;
  }

  // Daily / weekdays
  if (totalDone === 0) {
    return `Quiet across the four weeks. The image was named — when does it return?`;
  }
  if (ratio >= 0.85) {
    return `Held with strength — ${totalDone} of ${dates.length} days. The rhythm is yours.`;
  }
  if (ratio >= 0.6) {
    if (recentDone > olderDone) return `Thickening — ${totalDone} of ${dates.length} days, with the last week firmer than the first.`;
    if (recentDone < olderDone) return `Loosening lately — ${totalDone} of ${dates.length} overall, but the recent week thinner.`;
    return `Steady — ${totalDone} of ${dates.length} days. Held more than missed.`;
  }
  if (ratio >= 0.3) {
    if (recentDone > olderDone) return `Returning — ${totalDone} of ${dates.length} days, with the recent week stronger.`;
    return `Thin so far — ${totalDone} of ${dates.length} days. The image is waiting.`;
  }
  return `Mostly absent — only ${totalDone} of ${dates.length} days. ${habit.note ? `"${habit.note}" — worth a return.` : `Worth a return.`}`;
}

function lifeHabitsHTML() {
  const habits = activeHabits();
  const retiredHabits = (state.habits || []).filter(h => h.retired_at);

  if (!habits.length && !retiredHabits.length) {
    return `
      <div style="padding:48px 16px;text-align:center;">
        <div style="font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-muted);line-height:1.6;margin-bottom:18px;">
          No practices yet.<br>The shape begins when you name one.
        </div>
        <button class="btn-primary" onclick="openHabitCreateSheet()" style="width:auto;padding:10px 22px;">+ Name a practice</button>
      </div>
    `;
  }

  const habitCardHTML = (h) => {
    const grid =
      h.cadence === 'weekly'   ? weeklyHabitGridHTML(h) :
      h.cadence === 'weekdays' ? weekdaysHabitGridHTML(h) :
                                 dailyHabitGridHTML(h);
    const dates = lastNDates(HABITS_VIEW_DAYS);
    const totalDone = dates.filter(d => habitCellDensity(h, d) > 0).length;
    const need = h.count_per_day || 1;
    let countLabel;
    if (h.cadence === 'weekly') {
      countLabel = `${totalDone > 0 ? totalDone : 0} weeks`;
    } else if (need > 1) {
      const totalParts = (state.habitLogs || []).filter(l => l.habit_id === h.id && dates.includes(l.date_iso)).reduce((s, l) => s + (l.count || 1), 0);
      const possibleParts = h.cadence === 'weekdays' ? Math.round(dates.length * 5/7) * need : dates.length * need;
      countLabel = `${totalParts} OF ${possibleParts} PARTS`;
    } else {
      const possible = h.cadence === 'weekdays' ? Math.round(dates.length * 5/7) : dates.length;
      countLabel = `${totalDone} OF ${possible} DAYS`;
    }

    const isRetired = !!h.retired_at;
    const obsLine = !isRetired ? habitObservationProse(h) : `Retired ${(new Date(h.retired_at)).toISOString().slice(0,10)}. The practice ran for a season.`;

    return `
      <div style="padding:18px 0;${isRetired ? 'opacity:0.6;' : ''}">
        <button onclick="${isRetired ? '' : `openHabitCreateSheet('${h.id}')`}" style="display:flex;align-items:flex-start;width:100%;gap:12px;background:none;border:none;color:inherit;font-family:inherit;cursor:${isRetired ? 'default' : 'pointer'};text-align:left;padding:0 0 12px;">
          <div style="font-size:20px;line-height:1;flex-shrink:0;margin-top:2px;">${h.emoji || '✨'}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink);font-weight:400;line-height:1.2;">${escapeHtml(h.title)}</div>
            ${h.note ? `<div style="font-family:'Fraunces',serif;font-style:italic;font-size:11.5px;color:var(--ink-muted);margin-top:2px;line-height:1.35;">"${escapeHtml(h.note)}"</div>` : ''}
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-family:ui-monospace,monospace;font-size:14px;color:var(--ink);font-weight:400;line-height:1.1;">${countLabel.split(' ')[0]}</div>
            <div style="font-size:8.5px;color:var(--ink-faint);letter-spacing:0.08em;font-family:'Inter',sans-serif;font-weight:500;margin-top:2px;">${countLabel.split(' ').slice(1).join(' ')}</div>
          </div>
        </button>

        <div style="margin-top:8px;">${grid}</div>

        <div style="font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--ink-muted);line-height:1.55;margin-top:14px;">${escapeHtml(obsLine)}</div>
      </div>
    `;
  };

  const activeBlock = habits.map(habitCardHTML).join('<div style="height:0.5px;background:var(--line);margin:0;"></div>');
  const retiredBlock = retiredHabits.length ? `
    <div style="height:0.5px;background:var(--line);margin:24px 0;"></div>
