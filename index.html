// Helper: adopt a parsed state object back through migrations
function loadStateFromObject(parsed) {
  const merged = { ...structuredClone(DEFAULT_STATE), ...parsed };
  merged.profile = { ...DEFAULT_STATE.profile, ...(parsed.profile || {}) };
  merged.config  = { ...DEFAULT_STATE.config,  ...(parsed.config  || {}) };
  merged.nav     = { ...DEFAULT_STATE.nav,     ...(parsed.nav     || {}) };
  ['workouts','weights','sleep','moods','examens','intentions','todos','people','ledger','weekPlans','pauses','weekly_intents','chapters','subscriptions','habits','habitLogs']
    .forEach(k => { if (!Array.isArray(merged[k])) merged[k] = []; });
  if (!merged.whoop || typeof merged.whoop !== 'object') {
    merged.whoop = structuredClone(DEFAULT_STATE.whoop);
  } else {
    merged.whoop = { ...DEFAULT_STATE.whoop, ...merged.whoop };
    ['sleep','recovery','cycles','workouts'].forEach(k => {
      if (!Array.isArray(merged.whoop[k])) merged.whoop[k] = [];
    });
  }
  return merged;
}

window.kuzuriAuth = (() => {
  const WORKER = WORKER_BASE_URL;
  let currentUser = null;
  let resendTimer = null;
  let lastEmail = '';

  function showView(view) {
    document.querySelectorAll('[data-auth-view]').forEach(el => el.style.display = 'none');
    const target = document.getElementById('auth-view-' + view);
    if (target) target.style.display = '';
  }

  function showGate() {
    const gate = document.getElementById('auth-gate');
    if (gate) gate.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function hideGate() {
    const gate = document.getElementById('auth-gate');
    if (gate) gate.classList.add('hidden');
    document.body.style.overflow = '';
  }

  async function checkSession() {
    try {
      const r = await fetch(WORKER + '/auth/me', { credentials: 'include' });
      if (!r.ok) return null;
      const data = await r.json();
      if (data.signed_in) { currentUser = data.user; return data.user; }
      return null;
    } catch (e) {
      console.error('checkSession failed:', e);
      return null;
    }
  }

  // v3.1.1: request a 6-digit OTP instead of a magic link
  async function requestCode() {
    const input = document.getElementById('auth-email-input');
    const btn   = document.getElementById('auth-signin-btn');
    const err   = document.getElementById('auth-signin-error');
    const email = (input && input.value || '').trim().toLowerCase();

    // Null-safe: if elements are missing the view isn't ready
    if (!btn || !err) {
      console.error('requestCode: auth-view-signin elements not found in DOM');
      return;
    }

    err.classList.add('hidden');
    if (!email || !email.includes('@')) {
      err.textContent = 'That doesn\u2019t look like an email.';
      err.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="auth-spinner"></span>Sending\u2026';
    try {
      const r = await fetch(WORKER + '/auth/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (r.status === 429) {
          err.textContent = 'Too many attempts. Wait a minute and try again.';
        } else if (data.error === 'invalid_email') {
          err.textContent = 'That email doesn\u2019t look right.';
        } else {
          err.textContent = 'Something went wrong. Try again.';
        }
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Continue';
        return;
      }
      lastEmail = email;
      const emailSpan = document.getElementById('auth-otp-email');
      if (emailSpan) emailSpan.textContent = email;
      showView('otp');
      setTimeout(() => { const f = document.getElementById('otp-0'); if (f) f.focus(); }, 80);
      startResendCountdown();
    } catch (e) {
      console.error('requestCode fetch error:', e);
      err.textContent = 'No connection \u2014 check your network and try again.';
      err.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  }

  // v3.2.1: collect the 6 digits, verify, then redirect via handoff for reliable cookie
  async function verifyCode() {
    const digits = [0,1,2,3,4,5].map(i => {
      const el = document.getElementById('otp-' + i);
      return el ? el.value.trim() : '';
    });
    const code = digits.join('');
    const err  = document.getElementById('auth-otp-error');
    const btn  = document.getElementById('auth-otp-btn');
    if (!err || !btn) { console.error('verifyCode: OTP elements not found'); return; }
    err.classList.add('hidden');
    if (code.length !== 6 || !/^\d{6}$/.test(code)) {
      err.textContent = 'Please enter all 6 digits.';
      err.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="auth-spinner"></span>Verifying\u2026';
    try {
      const r = await fetch(WORKER + '/auth/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: lastEmail,
          code,
          return_to: window.location.origin,
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.signed_in) {
        const msg = data.error === 'invalid_code'      ? 'That code doesn\u2019t match. Check your email.'
                  : data.error === 'code_expired'      ? 'That code has expired. Request a new one.'
                  : data.error === 'code_already_used' ? 'That code has already been used. Request a new one.'
                  : 'Something went wrong. Try again.';
        err.textContent = msg;
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Verify';
        return;
      }
      // v3.2.1: redirect to Worker /auth/handoff which sets the cookie via a
      // navigation response (302 redirect). Browsers always commit cookies from
      // navigation responses — this avoids cross-origin cookie blocking on Safari
      // and Chrome. The handoff redirects back to /?kz_signin=1 to complete boot.
      btn.innerHTML = '<span class="auth-spinner"></span>Signing in\u2026';
      window.location.href = WORKER + '/auth/handoff?token=' + encodeURIComponent(data.handoff_token);
    } catch (e) {
      console.error('verifyCode error:', e);
      err.textContent = 'No connection \u2014 check your network and try again.';
      err.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }

  function startResendCountdown() {
    const btn       = document.getElementById('auth-resend-btn');
    const countdown = document.getElementById('auth-resend-countdown');
    let secs = 60;
    if (btn) btn.disabled = true;
    if (countdown) countdown.textContent = '(60s)';
    if (resendTimer) clearInterval(resendTimer);
    resendTimer = setInterval(() => {
      secs--;
      if (secs <= 0) {
        clearInterval(resendTimer);
        if (btn) btn.disabled = false;
        if (countdown) countdown.textContent = '';
      } else {
        if (countdown) countdown.textContent = `(${secs}s)`;
      }
    }, 1000);
  }

  async function resendCode() {
    if (!lastEmail) return backToSignIn();
    const btn = document.getElementById('auth-resend-btn');
    if (btn) { btn.disabled = true; }
    try {
      const r = await fetch(WORKER + '/auth/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: lastEmail }),
      });
      if (r.ok) {
        // Clear boxes and refocus
        [0,1,2,3,4,5].forEach(i => {
          const el = document.getElementById('otp-' + i);
          if (el) { el.value = ''; el.classList.remove('filled'); }
        });
        const err = document.getElementById('auth-otp-error');
        if (err) err.classList.add('hidden');
        setTimeout(() => { const f = document.getElementById('otp-0'); if (f) f.focus(); }, 80);
        startResendCountdown();
      }
    } catch {}
  }

  function backToSignIn() {
    if (resendTimer) clearInterval(resendTimer);
    [0,1,2,3,4,5].forEach(i => {
      const el = document.getElementById('otp-' + i);
      if (el) { el.value = ''; el.classList.remove('filled'); }
    });
    const input = document.getElementById('auth-email-input');
    if (input) input.value = lastEmail;
    showView('signin');
  }

  async function signOut() {
    try {
      await fetch(WORKER + '/auth/logout', { method: 'POST', credentials: 'include' });
    } catch {}
    localStorage.removeItem(STORAGE_KEY);
    window.location.href = window.location.pathname;
  }

  function getUser() { return currentUser; }
  function setUser(u) { currentUser = u; }

  return {
    checkSession, requestCode, verifyCode, resendCode, backToSignIn,
    signOut, getUser, setUser, showGate, hideGate, showView,
  };
})();

// OTP input helpers — auto-advance, backspace, paste support
function otpInput(idx) {
  const el = document.getElementById('otp-' + idx);
  if (!el) return;
  const val = el.value.replace(/\D/g, '').slice(-1);
  el.value = val;
  el.classList.toggle('filled', val.length > 0);
  if (val && idx < 5) {
    const next = document.getElementById('otp-' + (idx + 1));
    if (next) next.focus();
  }
  // Auto-submit when all 6 filled
  const all = [0,1,2,3,4,5].every(i => {
    const e = document.getElementById('otp-' + i);
    return e && e.value.trim().length === 1;
  });
  if (all) kuzuriAuth.verifyCode();
}

function otpKey(e, idx) {
  if (e.key === 'Backspace') {
    const el = document.getElementById('otp-' + idx);
    if (el && el.value === '' && idx > 0) {
      const prev = document.getElementById('otp-' + (idx - 1));
      if (prev) { prev.value = ''; prev.classList.remove('filled'); prev.focus(); }
    }
  }
  // Handle paste across all boxes
  if (e.key === 'v' && (e.metaKey || e.ctrlKey)) return; // let paste handler run
}

// Paste the whole code at once
document.addEventListener('paste', function(e) {
  const firstOtp = document.getElementById('otp-0');
  if (!firstOtp || !document.activeElement || !document.activeElement.classList.contains('auth-otp-input')) return;
  const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
  if (!pasted) return;
  e.preventDefault();
  pasted.split('').forEach((ch, i) => {
    const el = document.getElementById('otp-' + i);
    if (el) { el.value = ch; el.classList.add('filled'); }
  });
  const lastFilled = Math.min(pasted.length, 5);
  const focus = document.getElementById('otp-' + lastFilled);
  if (focus) focus.focus();
  if (pasted.length === 6) kuzuriAuth.verifyCode();
});

// ─── Local-first sync layer ──────────────────────────────────────────
window.kuzuriSync = (() => {
  const WORKER = WORKER_BASE_URL;
  let syncTimer = null;
  let pending = false;
  let _signinTs = 0; // timestamp of last successful sign-in — suppress 401 gate for 30s after

  // Called by verifyCode after session confirmed — starts the grace window
  function markSignedIn() { _signinTs = Date.now(); }

  // Wrap saveState to also push to server (debounced)
  const _origSaveState = saveState;
  window.saveState = function () {
    _origSaveState();
    schedulePush();
  };

  function schedulePush() {
    pending = true;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushNow, 1500);
  }

  async function pushNow() {
    if (!pending) return;
    if (!kuzuriAuth.getUser()) return;
    pending = false;
    try {
      const r = await fetch(WORKER + '/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ state }),
      });
      if (!r.ok && r.status === 401) {
        // Never interrupt if we're within 30 seconds of a sign-in —
        // the session is still establishing and 401s are expected.
        const withinGracePeriod = (Date.now() - _signinTs) < 30_000;
        if (!withinGracePeriod) {
          if (typeof toast === 'function') toast('Session expired — please sign in again.');
          setTimeout(() => kuzuriAuth.showGate(), 1500);
        }
      }
    } catch (e) {
      // Silent failure — local state is intact, will retry on next save
    }
  }

  async function pullFromServer() {
    if (!kuzuriAuth.getUser()) return null;
    try {
      const r = await fetch(WORKER + '/api/state', { credentials: 'include' });
      if (!r.ok) return null;
      const data = await r.json();
      return data.state;
    } catch {
      return null;
    }
  }

  // Push pending state on tab close (best effort)
  window.addEventListener('beforeunload', () => {
    if (pending && kuzuriAuth.getUser()) {
      navigator.sendBeacon &&
        navigator.sendBeacon(
          WORKER + '/api/state',
          new Blob([JSON.stringify({ state })], { type: 'application/json' })
        );
    }
  });

  return { pushNow, pullFromServer, schedulePush, markSignedIn };
})();

// ─── Onboarding flow ─────────────────────────────────────────────────
window.kuzuriOnboarding = (() => {
  const WORKER = WORKER_BASE_URL;
  let _migrationData = null;  // localStorage blob waiting to be migrated

  // Called when sign-in completes. Determines which onboarding screen to show.
  async function decideNextStep() {
    const user = kuzuriAuth.getUser();
    if (!user) return 'signin';

    // v3.1.0 fix: ALWAYS pull server state first, before deciding next step.
    // Otherwise we might overwrite real server data with empty local defaults.
    const serverState = await kuzuriSync.pullFromServer();
    if (serverState && Object.keys(serverState).length > 2) {
      // Server has real data — adopt it
      state = loadStateFromObject(serverState);
      saveState();
    }

    // Step 1: name? If the user record has no name AND local/server state has no name, ask.
    const stateName = (state.profile && state.profile.name && state.profile.name !== 'there') ? state.profile.name : '';
    const effectiveName = (user.name && user.name.trim()) || stateName;
    if (!effectiveName) {
      const input = document.getElementById('auth-name-input');
      if (input) input.value = '';
      return 'name';
    }

    // Name exists somewhere. Sync to local state.
    state.profile = state.profile || {};
    state.profile.name = effectiveName;
    if (user && !user.name) {
      // Update cached user too
      user.name = effectiveName;
      kuzuriAuth.setUser(user);
    }

    // Step 2: migration? Only show if local has data NOT YET on server.
    // This is now far less likely to fire since we pull server first.
    const hasLocalData = state.startDate || (state.examens && state.examens.length) || (state.captures && state.captures.length);
    if (hasLocalData && !serverState) {
      _migrationData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      // Strip provider connection state from migrated data — OAuth tokens live in D1
      // per-user, not in localStorage. Carrying over whoop/oura connected flags from
      // a different session (e.g. production v3.0.0) would show false connected state.
      if (_migrationData.whoop) delete _migrationData.whoop;
      if (_migrationData.oura)  delete _migrationData.oura;
      const summaryEl = document.getElementById('auth-migrate-summary');
      if (summaryEl) {
        const counts = [];
        if (Array.isArray(_migrationData.examens) && _migrationData.examens.length) counts.push(`${_migrationData.examens.length} examens`);
        if (Array.isArray(_migrationData.captures) && _migrationData.captures.length) counts.push(`${_migrationData.captures.length} captures`);
        if (Array.isArray(_migrationData.chapters) && _migrationData.chapters.length) counts.push(`${_migrationData.chapters.length} chapters`);
        if (Array.isArray(_migrationData.people) && _migrationData.people.length) counts.push(`${_migrationData.people.length} people`);
        const summary = counts.length ? counts.join(' · ') : 'A record of your time has been kept.';
        summaryEl.textContent = summary;
      }
      return 'migrate';
    }

    // Step 3: connections? Only show if first time AND user hasn't seen this screen before
    if (!state._onboarding_connections_seen) {
      renderConnectionsList();
      return 'connections';
    }

    return 'app';
  }

  async function saveName() {
    const input = document.getElementById('auth-name-input');
    const btn = document.getElementById('auth-name-btn');
    const err = document.getElementById('auth-name-error');
    const name = (input && input.value || '').trim();
    err.classList.add('hidden');
    if (!name) {
      err.textContent = 'Just a first name is fine.';
      err.classList.remove('hidden');
      return;
    }
    if (name.length > 40) {
      err.textContent = 'Keep it under 40 characters.';
      err.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="auth-spinner"></span>Saving\u2026';
    // Save to local state immediately
    state.profile = state.profile || {};
    state.profile.name = name;
    saveState();
    // Update the cached user object in kuzuriAuth
    const user = kuzuriAuth.getUser();
    if (user) { user.name = name; kuzuriAuth.setUser(user); }
    // Push to server (the saveState wrapper will handle this via debounced sync)
    // But we want it to land before continuing — force push:
    try {
      await fetch(WORKER + '/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ state }),
      });
    } catch (e) { /* silent */ }
    btn.disabled = false;
    btn.textContent = 'Continue';
    // Move to next step
    const next = await decideNextStep();
    showStep(next);
  }

  async function acceptMigration() {
    if (!_migrationData) return finishOnboarding();
    const btn = document.getElementById('auth-migrate-yes');
    const err = document.getElementById('auth-migrate-error');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<span class="auth-spinner"></span>Bringing it over\u2026';
    try {
      const r = await fetch(WORKER + '/api/migrate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ localStorage_json: _migrationData }),
      });
      if (!r.ok) {
        const errData = await r.json().catch(() => ({}));
        const code = errData.error || r.status;
        if (r.status === 401) {
          err.textContent = 'Session expired. Please sign in again.';
        } else {
          err.textContent = `Something went wrong (${code}). Try again.`;
        }
        throw new Error('migrate_failed');
      }
      // Server now has our data. Local state is already correct.
      _migrationData = null;
      btn.disabled = false;
      btn.textContent = 'Bring it with me';
      // Continue
      if (!state._onboarding_connections_seen) {
        renderConnectionsList();
        showStep('connections');
      } else {
        finishOnboarding();
      }
    } catch (e) {
      if (!err.classList.contains('hidden') === false) {
        err.textContent = 'Something went wrong. Try again.';
        err.classList.remove('hidden');
      }
      btn.disabled = false;
      btn.textContent = 'Bring it with me';
    }
  }

  function declineMigration() {
    // The auth gate is at z-index 9999, kuzuriConfirm modal is at 500 — it would
    // appear behind the gate. Just proceed without confirmation; the "Start fresh
    // instead" label and click is intentional enough.
    _migrationData = null;
    const preserveName = state.profile && state.profile.name;
    localStorage.removeItem(STORAGE_KEY);
    state = structuredClone(DEFAULT_STATE);
    if (preserveName) state.profile.name = preserveName;
    saveState();
    renderConnectionsList();
    showStep('connections');
  }

  async function renderConnectionsList() {
    const listEl = document.getElementById('auth-connections-list');
    if (!listEl) return;

    // Probe Whoop status
    let whoopConnected = false;
    try {
      const wr = await fetch(WORKER + '/whoop/status', { credentials: 'include' });
      if (wr.ok) {
        const wd = await wr.json();
        whoopConnected = !!wd.connected;
      }
    } catch {}

    // Probe Oura status (will return error if not configured server-side)
    let ouraConnected = false;
    let ouraConfigured = true;
    try {
      const or = await fetch(WORKER + '/oura/status', { credentials: 'include' });
      if (or.status === 503) { ouraConfigured = false; }
      else if (or.ok) {
        const od = await or.json();
        ouraConnected = !!od.connected;
      }
    } catch { ouraConfigured = false; }

    let html = '';
    // Whoop card
    html += `
      <div class="connection-card${whoopConnected ? ' connected' : ''}">
        <div class="connection-card-info">
          <div class="connection-card-name">Whoop</div>
          <div class="connection-card-desc">Sleep, recovery, strain</div>
        </div>
        ${whoopConnected
          ? `<button class="connection-card-action connected" disabled>Connected</button>`
          : `<button class="connection-card-action primary" onclick="startWhoopOAuth()">Connect</button>`
        }
      </div>
    `;

    // Oura card (only if configured server-side)
    if (ouraConfigured) {
      html += `
        <div class="connection-card${ouraConnected ? ' connected' : ''}">
          <div class="connection-card-info">
            <div class="connection-card-name">Oura</div>
            <div class="connection-card-desc">Sleep, readiness</div>
          </div>
          ${ouraConnected
            ? `<button class="connection-card-action connected" disabled>Connected</button>`
            : `<button class="connection-card-action primary" onclick="kuzuriOnboarding.connectOura()">Connect</button>`
          }
        </div>
      `;
    }

    // Garmin card (always visible, always "soon")
    html += `
      <div class="connection-card">
        <div class="connection-card-info">
          <div class="connection-card-name">Garmin</div>
          <div class="connection-card-desc">Workouts, sleep</div>
        </div>
        <button class="connection-card-action disabled" disabled>Soon</button>
      </div>
    `;

    listEl.innerHTML = html;
  }

  function connectOura() {
    const returnTo = encodeURIComponent(window.location.origin);
    window.location.href = WORKER + '/oura/auth/start?return_to=' + returnTo;
  }

  function finishOnboarding() {
    state._onboarding_connections_seen = true;
    saveState();
    kuzuriAuth.hideGate();
    // Activate the right screen and render
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const bootActive = state.nav.active || 'today';
    const bootScreen = document.getElementById('screen-' + bootActive);
    if (bootScreen) bootScreen.classList.add('active');
    render();
    handleWhoopReturn();
    // v3.3.1: show onboarding tour once after first sign-in
    if (!state._onboarding_tour_seen) {
      setTimeout(() => openKuzuriOnboarding(), 400);
    }
  }

  function showStep(stepName) {
    if (stepName === 'app') {
      finishOnboarding();
      return;
    }
    kuzuriAuth.showGate();
    kuzuriAuth.showView(stepName);
    // Auto-focus inputs where appropriate
    if (stepName === 'name') {
      setTimeout(() => {
        const inp = document.getElementById('auth-name-input');
        if (inp) inp.focus();
      }, 80);
    }
  }

  return { decideNextStep, saveName, acceptMigration, declineMigration, connectOura, finishOnboarding, showStep, renderConnectionsList };
})();

// ─── Boot sequence ───────────────────────────────────────────────────
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const justConnectedWhoop = params.has('whoop');
  const justConnectedOura  = params.has('oura');
  const kzSignin = params.has('kz_signin');

  // Clean up the URL — remove any auth params before proceeding
  if (kzSignin || justConnectedWhoop || justConnectedOura) {
    const cleanUrl = window.location.pathname;
    window.history.replaceState({}, '', cleanUrl);
  }

  // kz_signin=1 means we just came back from /auth/handoff which set the
  // session cookie via a navigation response. Mark signin so pushNow
  // doesn't interrupt with a 401 gate during the first 30s.
  if (kzSignin) {
    kuzuriSync.markSignedIn();
  }

  const user = await kuzuriAuth.checkSession();

  if (!user) {
    kuzuriAuth.showGate();
    kuzuriAuth.showView('signin');
    return;
  }

  // If user just returned from a Whoop or Oura connect flow (during onboarding),
  // they need to land back on the connections screen, not redo onboarding from scratch.
  if (justConnectedWhoop || justConnectedOura) {
    // If there's a server state and user has a name, they've completed core onboarding.
    // Just refresh the connections list and re-show it (or finish if connections already seen).
    const serverState = await kuzuriSync.pullFromServer();
    if (serverState) state = loadStateFromObject(serverState);
    state.profile = state.profile || {};
    if (user.name) state.profile.name = user.name;
    saveState();

    if (!state._onboarding_connections_seen) {
      // First-run: mark whoop synced if needed
      if (justConnectedWhoop) {
        state.whoop = state.whoop || {};
        state.whoop.connected = true;
        saveState();
      }
      kuzuriOnboarding.renderConnectionsList();
      kuzuriAuth.showGate();
      kuzuriAuth.showView('connections');
    } else {
      // Returning user: just go to app, handleWhoopReturn picks up from there
      kuzuriAuth.hideGate();
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const bootActive = state.nav.active || 'today';
      const bootScreen = document.getElementById('screen-' + bootActive);
      if (bootScreen) bootScreen.classList.add('active');
      render();
      handleWhoopReturn();
    }
    return;
  }

  // Normal sign-in flow: route through onboarding decider
  const next = await kuzuriOnboarding.decideNextStep();
  if (next === 'app') {
    kuzuriOnboarding.finishOnboarding();
  } else {
    kuzuriOnboarding.showStep(next);
  }
})();

</script>
</body>
